name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g., v2.6.0)"
        required: false
        type: string
      ref:
        description: "Git ref (branch, tag, or commit) to build; defaults to the tag"
        required: false
        type: string
      targets:
        description: "Comma-separated list of release targets, or 'all'"
        required: false
        type: string
        default: "all"
      dry_run:
        # ~keep Before tagging, dispatch this on main with both tag and ref empty. A commit SHA
        # as ref prevents prepare-release-metadata from synthesizing the dry-run tag.
        description: "Prepare artifacts without publishing (before tagging: dispatch on main, leave tag/ref empty)"
        required: false
        type: boolean
        default: false
      republish:
        description: "Delete and re-create the tag on current HEAD before publishing"
        required: false
        type: boolean
        default: false
      force_republish:
        description: "Force republish targets whose registry version already exists"
        required: false
        type: boolean
        default: false
      nuget_runtime_run_id:
        description: "Recover missing NuGet runtime packages from an existing release run; skip other targets"
        required: false
        type: string
  release:
    types: [published]
  repository_dispatch:
    types: [publish-release]

permissions:
  contents: read
  id-token: write

concurrency:
  group: >-
    ${{ github.workflow }}-${{ inputs.nuget_runtime_run_id &&
    format('nuget-runtimes-{0}', inputs.nuget_runtime_run_id) ||
    (github.event_name == 'workflow_dispatch' && (github.event.inputs.ref || github.event.inputs.tag)) ||
    github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  recover-nuget-runtimes:
    name: Recover missing NuGet runtime packages
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.nuget_runtime_run_id != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Validate original release run
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_RUN_ID: ${{ inputs.nuget_runtime_run_id }}
          EXPECTED_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}" > release-run.json
          python3 - <<'PY'
          import json
          import os
          import re

          run = json.load(open('release-run.json'))
          tag = os.environ['EXPECTED_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('Recovery requires an explicit stable release tag')
          if (run['path'], run['event'], run['head_branch']) != ('.github/workflows/publish.yaml', 'release', tag):
              raise SystemExit('Source must be the original Publish Release event for the requested tag')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"sha={run['head_sha']}\n")
          PY

      - name: Check out current recovery tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}

      - name: Check out original release source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: release-source

      - name: Verify release source and checksum-only metadata
        id: version
        shell: bash
        working-directory: release-source
        env:
          EXPECTED_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_RUN_ID: ${{ inputs.nuget_runtime_run_id }}
        run: |
          git fetch --depth=1 origin "refs/tags/${EXPECTED_TAG}:refs/tags/${EXPECTED_TAG}"
          if [[ "$(git rev-parse "${EXPECTED_TAG}^{commit}")" != "$EXPECTED_SHA" ]]; then
            gh run download "$RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name swift-checksum --dir dist/provenance-swift
          fi
          python3 "$GITHUB_WORKSPACE/scripts/ci/csharp/verify_recovery_source.py" \
            "$EXPECTED_SHA" "$EXPECTED_TAG" dist/provenance-swift
          python3 - <<'PY'
          import os
          import tomllib

          with open('Cargo.toml', 'rb') as manifest:
              version = tomllib.load(manifest)['workspace']['package']['version']
          if f'v{version}' != os.environ['EXPECTED_TAG']:
              raise SystemExit('Release tag and source version differ')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY

      - uses: actions/download-artifact@v8
        with:
          pattern: csharp-ffi-*
          path: release-source/dist/csharp-ffi
          merge-multiple: true
          run-id: ${{ inputs.nuget_runtime_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Pack only missing runtime package candidates
        shell: bash
        working-directory: release-source
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for dir in dist/csharp-ffi/*/; do
            rid="$(basename "$dir")"
            mkdir -p "packages/csharp/HtmlToMarkdown/runtimes/${rid}/native"
            cp -v "${dir}native/"* "packages/csharp/HtmlToMarkdown/runtimes/${rid}/native/"
          done
          # Every concrete RID is packed, and RequireRuntimeAssets rejects a missing artifact.
          # This directory deliberately contains no managed package.
          bash "$GITHUB_WORKSPACE/scripts/ci/csharp/pack-runtimes.sh" "$VERSION" dist/nuget-runtimes

      - uses: xberg-io/actions/publish-nuget@v1
        with:
          packages-dir: release-source/dist/nuget-runtimes
          expected-version: ${{ steps.version.outputs.version }}
          dry-run: ${{ inputs.dry_run }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

  prepare:
    name: Prepare metadata
    # This workflow publishes the release object itself, which re-enters it through
    # `on: release` and queues a full duplicate publish run behind the dispatch run that
    # created it. Keyed on `actor`, not `release.author` and not `triggering_actor`:
    # release.author is always the bot because the bot creates the release as a draft, so it
    # would suppress a human publishing that draft. triggering_actor becomes the human on a
    # re-run, so it would ADMIT a duplicate when someone re-runs the bot's own recursive run.
    # `actor` is pinned to whoever initiated the original run and survives re-runs. ~keep
    if: >-
      !inputs.nuget_runtime_run_id &&
      (github.event_name != 'release' ||
      github.actor != 'xberg-dev-publisher[bot]')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      # ~keep PyPI and RubyGems respell a semver prerelease, so the release version cannot be
      # handed to their publish guards verbatim. See the step that computes these below.
      pypi_version: ${{ steps.version_forms.outputs.pypi_version }}
      gem_version: ${{ steps.version_forms.outputs.gem_version }}
      ref: ${{ steps.meta.outputs.ref }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      target_sha: ${{ steps.meta.outputs.target_sha }}
      matrix_ref: ${{ steps.meta.outputs.matrix_ref }}
      is_tag: ${{ steps.meta.outputs.is_tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      npm_tag: ${{ steps.meta.outputs.npm_tag }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      force_republish: ${{ steps.meta.outputs.force_republish }}
      release_targets: ${{ steps.meta.outputs.release_targets }}
      release_any: ${{ steps.meta.outputs.release_any }}
      release_python: ${{ steps.meta.outputs.release_python }}
      release_node: ${{ steps.meta.outputs.release_node }}
      release_ruby: ${{ steps.meta.outputs.release_ruby }}
      release_cli: ${{ steps.meta.outputs.release_cli }}
      release_crates: ${{ steps.meta.outputs.release_crates }}
      release_homebrew: ${{ steps.meta.outputs.release_homebrew }}
      release_scoop: ${{ steps.meta.outputs.release_scoop }}
      release_java: ${{ steps.meta.outputs.release_java }}
      release_csharp: ${{ steps.meta.outputs.release_csharp }}
      release_go: ${{ steps.meta.outputs.release_go }}
      release_wasm: ${{ steps.meta.outputs.release_wasm }}
      release_php: ${{ steps.meta.outputs.release_php }}
      release_elixir: ${{ steps.meta.outputs.release_elixir }}
      release_c_ffi: ${{ steps.meta.outputs.release_c_ffi }}
      release_kotlin: ${{ steps.meta.outputs.release_kotlin }}
      release_swift: ${{ steps.meta.outputs.release_swift }}
      release_dart: ${{ steps.meta.outputs.release_dart }}
      release_zig: ${{ steps.meta.outputs.release_zig }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ (inputs.republish == true && (inputs.ref || github.event.repository.default_branch)) || inputs.ref || inputs.tag || github.ref }}
          fetch-depth: 0
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "xberg-dev-publisher[bot]"
          git config user.email "291994444+xberg-dev-publisher[bot]@users.noreply.github.com"

      - name: Retag for republish
        if: ${{ inputs.republish == true || github.event.client_payload.republish == true }}
        uses: xberg-io/actions/retag-for-republish@v1
        with:
          tag: ${{ inputs.tag || github.event.client_payload.tag }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve release metadata
        id: meta
        uses: xberg-io/actions/prepare-release-metadata@v1

      # ~keep Every publish job gates on `is_tag == 'true'`, so a run that resolves it false
      # skips all of them and still reports success -- a green check having published nothing.
      # crawlberg run 35122273610 did exactly that: a `workflow_dispatch` carrying `ref: main`
      # made prepare-release-metadata emit `refs/heads/main`, which is not a tag, and the Maven
      # republish it was dispatched to perform silently never ran. `is_tag` is true in every
      # legitimate mode, dry-run included (the synthesized `vX.Y.Z-dryrun-<sha>` tag still
      # reads as a tag), so there is no case this refuses that should have published.
      - name: Assert the run can publish at all
        shell: bash
        env:
          IS_TAG: ${{ steps.meta.outputs.is_tag }}
          RESOLVED_REF: ${{ steps.meta.outputs.ref }}
          TARGETS: ${{ steps.meta.outputs.release_targets }}
        run: |
          set -euo pipefail
          if [[ "${IS_TAG}" != "true" ]]; then
            echo "::error::Resolved ref '${RESOLVED_REF}' is not a tag, so every publish job" \
                 "would be skipped and this run would report success having published nothing." \
                 "Requested targets: '${TARGETS}'. Dispatch with the 'tag' input alone (and" \
                 "'republish' if the tag must move); do not pass a branch as 'ref'." >&2
            exit 1
          fi
          echo "Publishing from ${RESOLVED_REF} (targets: ${TARGETS})"

      # ~keep The publish actions compare `expected-version` against the artifact's own version
      # string, and two ecosystems respell a semver prerelease: PyPI dist filenames carry the
      # PEP 440 form (1.9.0-rc.2 -> 1.9.0rc2) and gem filenames the RubyGems form
      # (1.9.0-rc.2 -> 1.9.0.pre.rc.2). Those are the spellings alef writes into the manifests
      # the artifacts are built from, so the guard has to be handed the same spelling or every
      # prerelease would fail it on a version that is in fact correct. A final release has no
      # suffix and passes through both expressions untouched.
      - name: Respell the release version for PyPI and RubyGems
        id: version_forms
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          pypi="$(printf '%s' "${VERSION}" \
            | sed -E 's/-alpha\.?([0-9]+)$/a\1/; s/-beta\.?([0-9]+)$/b\1/; s/-([A-Za-z]+)\.?([0-9]+)$/\1\2/')"
          gem="$(printf '%s' "${VERSION}" | sed -E 's/^([^-]+)-(.*)$/\1.pre.\2/' | tr '_-' '..')"
          {
            echo "pypi_version=${pypi}"
            echo "gem_version=${gem}"
          } >>"$GITHUB_OUTPUT"

      - name: Ensure GitHub Release exists for tag
        if: ${{ steps.meta.outputs.is_tag == 'true' && steps.meta.outputs.dry_run != 'true' }}
        uses: xberg-io/actions/publish-github-release@v1
        with:
          tag: ${{ steps.meta.outputs.tag }}
          target: ${{ steps.meta.outputs.target_sha }}
          notes: "Release ${{ steps.meta.outputs.tag }}"
          draft: "true"
          prerelease: ${{ steps.meta.outputs.is_prerelease }}
          token: ${{ steps.app-token.outputs.token }}

      # ~keep Every release starts life as a draft here and is flipped by `promote-release` at
      # the very end, so a run that dies in between leaves the draft behind. `release-report`
      # already fails when THIS tag is still a draft, but it cannot when the whole run is
      # cancelled -- and a draft never creates its git tag, so GitHub stores `tag_name` as
      # `untagged-<hash>` and the release becomes invisible to every lookup by tag. Seven
      # releases accumulated that way before anyone noticed, two of them holding the only copy
      # of 23 and 9 published assets respectively.
      #
      # `prepare` is the one job early enough that a later cancellation cannot suppress it, so
      # the audit lives here. It warns rather than fails: unrelated leftover debt must not block
      # the release in flight.
      - name: Audit for abandoned draft releases
        if: ${{ steps.meta.outputs.is_tag == 'true' && steps.meta.outputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          drafts="$(gh api repos/:owner/:repo/releases --paginate \
            --jq '.[] | select(.draft) | "\(.tag_name)\t\(.name)\t\(.assets | length)"' \
            | grep -v "^${TAG}\b" || true)"
          if [ -z "${drafts}" ]; then
            echo "No abandoned draft releases." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          count="$(printf '%s\n' "${drafts}" | wc -l | tr -d ' ')"
          echo "::warning title=Abandoned draft releases::${count} draft release(s) other than ${TAG} exist; a draft holds its assets but is invisible to lookup by tag. See the job summary."
          {
            echo "### ${count} abandoned draft release(s)"
            echo
            echo "A \`untagged-*\` tag_name means the draft never created its git tag, so the"
            echo "release cannot be found by tag and any assets on it are stranded."
            echo
            echo "| stored tag_name | name | assets |"
            echo "| --- | --- | --- |"
            printf '%s\n' "${drafts}" | awk -F'\t' '{printf "| `%s` | %s | %s |\n", $1, $2, $3}'
          } >>"$GITHUB_STEP_SUMMARY"

  validate-versions:
    name: Validate language manifest versions
    needs: prepare
    if: ${{ needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Validate versions
        uses: xberg-io/actions/validate-versions@v1
        with:
          version: ${{ needs.prepare.outputs.version }}

      # The coding-agent plugin under plugin/ carries its own version source
      # (plugin/.ai-rulez/config.toml [plugin].version) that the shared
      # validate-versions action does not know about. Assert it against the tag
      # actually being released, so a drifted plugin fails the release instead of
      # shipping a bundle that lags the version it claims to be. ~keep
      # ~keep A dry run synthesizes its tag as `<version>-dryrun-<sha>`, so the release
      # version carries a suffix no manifest will ever hold and the assertion below fails
      # on a plugin that is in fact correct. Strip the suffix rather than skipping the step
      # on dry runs -- a dry run is exactly where a drifted plugin should surface, while
      # there is still no tag and nothing has been published.
      - name: Validate plugin version matches the release
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/sync_plugin_version.py --expect "${VERSION%%-dryrun-*}"

  check-pypi:
    name: Check PyPI for existing version
    needs: prepare
    if: ${{ (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.prepare.outputs.release_python == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: pypi
          package: html-to-markdown
          version: ${{ needs.prepare.outputs.version }}

  check-npm:
    name: Check npm for existing versions
    needs: prepare
    if: ${{ (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.prepare.outputs.release_node == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      node_exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: npm
          package: "@xberg-io/html-to-markdown"
          version: ${{ needs.prepare.outputs.version }}

  check-wasm:
    name: Check npm for existing WASM package
    needs: prepare
    if: ${{ (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.prepare.outputs.release_wasm == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: npm
          package: "@xberg-io/html-to-markdown-wasm"
          version: ${{ needs.prepare.outputs.version }}

  check-rubygems:
    name: Check RubyGems for existing version
    needs: prepare
    if: ${{ (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.prepare.outputs.release_ruby == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: rubygems
          package: html-to-markdown
          version: ${{ needs.prepare.outputs.version }}

  check-maven:
    name: Check Maven Central for existing version
    needs: prepare
    if: ${{ (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.prepare.outputs.release_java == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: maven
          package: "io.xberg:html-to-markdown"
          version: ${{ needs.prepare.outputs.version }}

  check-nuget:
    name: Check NuGet for existing version
    needs: prepare
    if: ${{ (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.prepare.outputs.release_csharp == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: nuget
          package: XbergIo.HtmlToMarkdown
          version: ${{ needs.prepare.outputs.version }}

  check-packagist:
    name: Check Packagist for existing version
    needs: prepare
    if: ${{ (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.prepare.outputs.release_php == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: packagist
          package: xberg-io/html-to-markdown
          version: ${{ needs.prepare.outputs.version }}

  check-cratesio:
    name: Check crates.io for existing versions
    needs: prepare
    if: ${{ (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.prepare.outputs.release_crates == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      rs_exists: ${{ steps.check.outputs.exists }}
      cli_exists: ${{ steps.check.outputs.cli_exists }}
      all_exist: ${{ steps.check.outputs['all-exist'] }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: cratesio
          package: html-to-markdown-rs
          version: ${{ needs.prepare.outputs.version }}
          extra-packages: |
            cli_exists=html-to-markdown-cli

  check-hex:
    name: Check Hex.pm for existing version
    needs: prepare
    if: ${{ (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.prepare.outputs.release_elixir == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: hex
          package: html_to_markdown
          version: ${{ needs.prepare.outputs.version }}

  check-homebrew:
    name: Check Homebrew tap for formula
    needs: prepare
    if: ${{ (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.prepare.outputs.release_homebrew == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: homebrew
          package: html-to-markdown
          version: ${{ needs.prepare.outputs.version }}
          tap-repo: xberg-io/homebrew-tap

  check-cli:
    name: Check GitHub Release for CLI assets
    needs: prepare
    if: ${{ (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.prepare.outputs.release_cli == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: github-release
          package: html-to-markdown
          version: ${{ needs.prepare.outputs.version }}
          repo: ${{ github.repository }}
          tag: ${{ needs.prepare.outputs.tag }}
          asset-prefix: cli-

  check-go:
    name: Check GitHub Release for Go FFI assets
    needs: prepare
    if: ${{ (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.prepare.outputs.release_go == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: github-release
          package: html-to-markdown
          version: ${{ needs.prepare.outputs.version }}
          repo: ${{ github.repository }}
          tag: ${{ needs.prepare.outputs.tag }}
          asset-prefix: html-to-markdown-rs-go-

  check-c-ffi:
    name: Check GitHub Release for C FFI assets
    needs: prepare
    if: ${{ (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.prepare.outputs.release_c_ffi == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: github-release
          package: html-to-markdown
          version: ${{ needs.prepare.outputs.version }}
          repo: ${{ github.repository }}
          tag: ${{ needs.prepare.outputs.tag }}
          asset-prefix: html-to-markdown-rs-ffi-

  check-elixir-release:
    name: Check GitHub Release for Elixir NIF assets
    needs: prepare
    if: ${{ (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.prepare.outputs.release_elixir == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: github-release
          package: html-to-markdown
          version: ${{ needs.prepare.outputs.version }}
          repo: ${{ github.repository }}
          tag: ${{ needs.prepare.outputs.tag }}
          asset-prefix: libhtml_to_markdown_nif-

  check-maven-kotlin:
    name: Check Maven Central for Kotlin Android
    needs: prepare
    if: ${{ (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.prepare.outputs.release_kotlin == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: maven
          package: "io.xberg:html-to-markdown-android"
          version: ${{ needs.prepare.outputs.version }}

  check-pub:
    name: Check pub.dev for Dart package
    needs: prepare
    if: ${{ (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.prepare.outputs.release_dart == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: pub
          package: html_to_markdown
          version: ${{ needs.prepare.outputs.version }}

  dart-natives:
    name: Build Dart native library (${{ matrix.rid }})
    needs: [prepare, check-pub]
    if: ${{ needs.prepare.outputs.release_dart == 'true' && (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && (needs.check-pub.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, rid: macos-arm64, target: aarch64-apple-darwin }
          - { os: macos-15-intel, rid: macos-x64, target: x86_64-apple-darwin }
          - { os: windows-latest, rid: windows-x64, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, rid: windows-arm64, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: xberg-io/actions/free-disk-space-linux@v1

      - uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.target }}
          cache-key-prefix: publish-dart-${{ matrix.rid }}

      - name: Build and stage Dart native library
        shell: bash
        run: |
          cargo build --release --locked -p html-to-markdown-rs-dart --target ${{ matrix.target }}
          mkdir -p "dist/dart-natives/${{ matrix.rid }}"
          for src in "target/${{ matrix.target }}/release" "target/release"; do
            [[ -d "$src" ]] || continue
            find "$src" -maxdepth 1 -type f \( -name 'libhtml_to_markdown_rs_dart.so' -o -name 'libhtml_to_markdown_rs_dart.dylib' -o -name 'html_to_markdown_rs_dart.dll' \) -exec cp {} "dist/dart-natives/${{ matrix.rid }}/" \;
          done
          ls -la "dist/dart-natives/${{ matrix.rid }}/"

      - uses: actions/upload-artifact@v7
        with:
          name: dart-natives-${{ matrix.rid }}
          path: dist/dart-natives
          if-no-files-found: error
          retention-days: 14

  assemble-dart-package:
    name: Assemble Dart package artifact
    permissions:
      contents: write
    needs: [prepare, check-pub, dart-natives]
    if: ${{ needs.prepare.outputs.release_dart == 'true' && (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.dart-natives.result == 'success' && (needs.check-pub.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: actions/download-artifact@v8
        with:
          pattern: dart-natives-*
          path: dart-natives-artifacts
          merge-multiple: true

      - name: Package native download assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/publish/dart/package_native_assets.py dart-natives-artifacts dist/dart "$VERSION"
      - name: Upload Dart native download assets
        uses: xberg-io/actions/upload-release-assets@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          working-directory: dist/dart
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          assets: |
            *.tar.gz
            *.sha256

      - name: Stage prebuilt native libraries into Dart package
        shell: bash
        run: |
          for dir in dart-natives-artifacts/*/; do
            rid="$(basename "$dir")"
            mkdir -p "packages/dart/lib/src/native/${rid}"
            cp -r "${dir}." "packages/dart/lib/src/native/${rid}/"
            echo "Staged Dart native library for ${rid}:"
            ls -la "packages/dart/lib/src/native/${rid}/"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: dart-package-assembled
          path: packages/dart
          if-no-files-found: error
          retention-days: 7

  assemble-zig-package:
    name: Assemble Zig package with prebuilt FFI libraries
    needs: [prepare, check-c-ffi, c-ffi-libraries]
    if: ${{ needs.prepare.outputs.release_zig == 'true' && (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
          submodules: recursive

      - uses: actions/download-artifact@v8
        with:
          pattern: c-ffi-*
          path: c-ffi-artifacts
          merge-multiple: true

      - name: Stage original C FFI archives for the Zig packager
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/stage_zig_native_assets.py c-ffi-artifacts zig-ffi-artifacts "$RELEASE_VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: zig-package-assembled
          path: zig-ffi-artifacts
          if-no-files-found: error
          retention-days: 7

  check-zig:
    name: Check Zig package presence
    needs: prepare
    if: ${{ (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.prepare.outputs.release_zig == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: github-release
          package: html-to-markdown-rs-zig-v${{ needs.prepare.outputs.version }}.tar.gz
          version: ${{ needs.prepare.outputs.version }}
          repo: ${{ github.repository }}
          assets: html-to-markdown-rs-zig-v${{ needs.prepare.outputs.version }}.tar.gz

  python-wheels:
    name: Build Python wheels (${{ matrix.os }})
    needs: [prepare, check-pypi]
    if: ${{ needs.prepare.outputs.release_python == 'true' && (needs.check-pypi.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.12"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: xberg-io/actions/free-disk-space-linux@v1

      - name: Setup Rust on host (macOS, Windows)
        if: runner.os != 'Linux'
        uses: xberg-io/actions/setup-rust@v1
        with:
          use-sccache: "false"

      - name: Build wheels
        uses: xberg-io/actions/build-python-wheels@v1
        with:
          python-version: "3.13"
          package-dir: packages/python
          cibw-build: "cp310-*"
          cibw-before-build-linux: >
            yum install -y openssl-devel &&
            (test -x /usr/bin/aarch64-linux-gnu-gcc ||
              ln -sf "$(command -v gcc)" /usr/local/bin/aarch64-linux-gnu-gcc 2>/dev/null || true) &&
            pip install maturin uv &&
            source ~/.cargo/env &&
            python scripts/prepare_wheel.py
          cibw-before-build-macos: >
            pip install maturin uv &&
            source ~/.cargo/env &&
            python scripts/prepare_wheel.py
          cibw-before-build-windows: >
            pip install maturin uv &&
            set PATH=%USERPROFILE%\.cargo\bin;%PATH% &&
            python scripts\prepare_wheel.py
          upload-artifact: "false"

      - uses: actions/upload-artifact@v7
        with:
          name: python-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          retention-days: 14

  python-sdist:
    name: Build Python sdist
    needs: [prepare, check-pypi, crates-gate]
    if: ${{ !cancelled() && needs.crates-gate.outputs.ok == 'true' && needs.prepare.outputs.release_python == 'true' && (needs.check-pypi.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: recursive

      - uses: xberg-io/actions/setup-rust@v1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build and bundle CLI binary
        shell: bash
        run: |
          cargo build --release --locked --package html-to-markdown-cli
          mkdir -p packages/python/html_to_markdown/_cli
          cp target/release/html-to-markdown packages/python/html_to_markdown/_cli/ 2>/dev/null \
            || cp target/release/html-to-markdown.exe packages/python/html_to_markdown/_cli/

      - uses: xberg-io/actions/build-python-sdist@v1
        with:
          package-dir: packages/python
          output-dir: dist
          dry-run: ${{ needs.prepare.outputs.dry_run }}

      - uses: actions/upload-artifact@v7
        with:
          name: python-sdist
          path: dist/*.tar.gz
          retention-days: 14

  node-typescript-defs:
    name: Generate Node TypeScript definitions
    needs: [prepare, check-npm]
    if: ${{ needs.prepare.outputs.release_node == 'true' && (needs.check-npm.outputs.node_exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: recursive

      - uses: xberg-io/actions/setup-rust@v1
      - uses: xberg-io/actions/setup-node-workspace@v1
        with:
          node-version: "24"

      - name: Generate TypeScript definitions
        shell: bash
        run: |
          pnpm --filter ./crates/html-to-markdown-node exec napi build --release
          # `napi build` clobbers index.d.ts with its own thin declarations; the committed file is
          # alef-generated (rustdoc, JsonValue, real enums) and freshness-gated by `alef verify`, so
          # restore it. ~keep
          git checkout HEAD -- crates/html-to-markdown-node/index.d.ts
          # index.js is NOT emitted by this command at all -- it is committed, hand-maintained
          # source that this job stages and the publish job copies verbatim into the tarball.
          # Verify it instead of trusting a build to produce it: a `napi build` run from the repo
          # root rewrites it to require `html-to-markdown-monorepo-*` packages that are never
          # published, which would ship a package broken on every platform. ~keep
          node crates/html-to-markdown-node/scripts/verify-loader-manifest.mjs
          mkdir -p typescript-defs
          cp crates/html-to-markdown-node/index.js crates/html-to-markdown-node/index.d.ts typescript-defs/

      - uses: actions/upload-artifact@v7
        with:
          name: node-typescript-defs
          path: typescript-defs/
          retention-days: 14

  node-bindings:
    name: Build Node bindings (${{ matrix.target }})
    needs: [prepare, check-npm]
    if: ${{ needs.prepare.outputs.release_node == 'true' && (needs.check-npm.outputs.node_exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    # ~keep The NAPI action recreates npm/ after deleting it. pnpm 12 otherwise rejects the
    # temporarily missing workspace importers before napi can recreate them.
    env:
      PNPM_CONFIG_FROZEN_LOCKFILE: "false"
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              os: macos-latest,
              target: aarch64-apple-darwin,
              rust_target: "",
              use_napi_cross: false,
              use_zig_cross: false,
            }
          - {
              os: macos-15-intel,
              target: x86_64-apple-darwin,
              rust_target: "",
              use_napi_cross: false,
              use_zig_cross: false,
            }
          - {
              os: ubuntu-latest,
              target: x86_64-unknown-linux-gnu,
              rust_target: "",
              use_napi_cross: false,
              use_zig_cross: false,
            }
          - {
              os: ubuntu-latest,
              target: aarch64-unknown-linux-gnu,
              rust_target: aarch64-unknown-linux-gnu,
              use_napi_cross: true,
              use_zig_cross: false,
            }
          - {
              os: ubuntu-latest,
              target: x86_64-unknown-linux-musl,
              rust_target: x86_64-unknown-linux-musl,
              use_napi_cross: false,
              use_zig_cross: true,
            }
          - {
              os: ubuntu-latest,
              target: aarch64-unknown-linux-musl,
              rust_target: aarch64-unknown-linux-musl,
              use_napi_cross: false,
              use_zig_cross: true,
            }
          - {
              os: windows-latest,
              target: x86_64-pc-windows-msvc,
              rust_target: "",
              use_napi_cross: false,
              use_zig_cross: false,
            }
          - {
              os: windows-latest,
              target: aarch64-pc-windows-msvc,
              rust_target: aarch64-pc-windows-msvc,
              use_napi_cross: false,
              use_zig_cross: false,
            }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: xberg-io/actions/free-disk-space-linux@v1

      - uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.rust_target || matrix.target }}
          cache-key-prefix: publish-node-${{ matrix.target }}
          # setup-rust otherwise exports CC/CARGO_TARGET_*_LINKER=musl-gcc for musl targets,
          # and cargo-zigbuild only sets those when unset — so the zig cross-compile below
          # silently linked with musl-gcc instead, which cannot produce a musl cdylib
          # (`cannot find libgcc_s.so.1`) or target another architecture at all. ~keep
          configure-musl-cc: ${{ matrix.use_zig_cross && 'false' || 'true' }}

      - uses: xberg-io/actions/setup-node-workspace@v1
        with:
          node-version: "24"

      # napi-rs cross-compiles musl targets via `napi build -x`, which shells
      # out to cargo-zigbuild — unlike the gnu targets' --use-napi-cross
      # (docker-based @napi-rs/cross-toolchain). The shared action drives it
      # through its `cross-compile` input but deliberately does not install the
      # toolchain, because the zig version is a per-repo pin; hence these two
      # setup steps.
      - name: Setup Zig (musl cross-compile)
        if: matrix.use_zig_cross
        uses: xberg-io/actions/setup-zig@v1
        with:
          version: "0.16.0"

      - name: Install cargo-zigbuild (musl cross-compile)
        if: matrix.use_zig_cross
        shell: bash
        run: command -v cargo-zigbuild || cargo install --locked cargo-zigbuild

      - name: Build native module
        if: ${{ !matrix.use_zig_cross }}
        uses: xberg-io/actions/build-node-napi@v1
        with:
          crate-dir: crates/html-to-markdown-node
          target: ${{ matrix.target }}
          use-napi-cross: ${{ matrix.use_napi_cross }}
          pack-target-tarball: node-bindings-${{ matrix.target }}.tar.gz
          install-deps: "false"

      - name: Build native module (musl, zig cross-compile)
        if: matrix.use_zig_cross
        uses: xberg-io/actions/build-node-napi@v1
        with:
          crate-dir: crates/html-to-markdown-node
          target: ${{ matrix.target }}
          cross-compile: "true"
          install-deps: "false"
          pack-target-tarball: node-bindings-${{ matrix.target }}.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: node-bindings-${{ matrix.target }}
          path: node-bindings-${{ matrix.target }}.tar.gz
          retention-days: 14

  wasm-bindings:
    name: Build WASM package
    needs: [prepare, check-wasm]
    if: ${{ needs.prepare.outputs.release_wasm == 'true' && (needs.check-wasm.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: recursive

      - uses: xberg-io/actions/setup-rust@v1
        with:
          target: wasm32-unknown-unknown
          cache-key-prefix: publish-wasm

      - uses: xberg-io/actions/setup-node-workspace@v1
        with:
          node-version: "24"

      - uses: xberg-io/actions/build-wasm-package@v1
        with:
          crate-dir: crates/html-to-markdown-wasm
          pack-tarball: "false"

      - uses: actions/upload-artifact@v7
        with:
          name: wasm-bundle
          path: |
            crates/html-to-markdown-wasm/dist/**
            crates/html-to-markdown-wasm/dist-node/**
            crates/html-to-markdown-wasm/dist-web/**
            crates/html-to-markdown-wasm/pkg/**
            crates/html-to-markdown-wasm/package.json
          retention-days: 14

  ruby-gem:
    name: Build Ruby gem (${{ matrix.label }})
    needs: [prepare, check-rubygems, crates-gate]
    if: ${{ !cancelled() && needs.crates-gate.outputs.ok == 'true' && needs.prepare.outputs.release_ruby == 'true' && (needs.check-rubygems.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      RB_SYS_CARGO_PROFILE: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: linux }
          - { os: ubuntu-24.04-arm, label: linux-aarch64 }
          - { os: macos-latest, label: macos-arm64 }
          - { os: macos-15-intel, label: macos-x86_64 }
          - { os: ubuntu-latest, label: windows-x64, dock_platform: x64-mingw-ucrt }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: xberg-io/actions/free-disk-space-linux@v1

      - name: Drop cached CLI binaries
        shell: bash
        run: rm -rf packages/ruby/exe/* packages/ruby/pkg

      - name: Install MSYS2 toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ridk install 1 2 3
          $msys2Path = (ridk version).Split("`n") | Where-Object { $_ -match "msys2:" } | ForEach-Object { ($_ -split ":\s*")[1].Trim() }
          if (-not $msys2Path) { $msys2Path = "C:\msys64" }
          ridk exec pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-clang mingw-w64-ucrt-x86_64-libffi
          "$msys2Path\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Rust (GNU on Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup install stable-x86_64-pc-windows-gnu
          rustup default stable-x86_64-pc-windows-gnu
          rustup target add x86_64-pc-windows-gnu
          rustc --version

      - name: Configure bindgen sysroot (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          UCRT="/c/msys64/ucrt64"
          echo "BINDGEN_EXTRA_CLANG_ARGS=--sysroot=${UCRT} -I${UCRT}/include" >>"$GITHUB_ENV"
          echo "LIBCLANG_PATH=${UCRT}/bin" >>"$GITHUB_ENV"

      - uses: xberg-io/actions/setup-rust@v1
        if: runner.os != 'Windows'
        with:
          cache-key-prefix: publish-ruby-${{ matrix.label }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler: "4.0.3"
          bundler-cache: false

      - name: Install Ruby dependencies
        shell: bash
        working-directory: packages/ruby
        run: |
          gem install bundler -v 4.0.3
          bundle config set --local path 'vendor/bundle'
          bundle install --jobs 4 --retry 3

      - uses: xberg-io/actions/build-ruby-gem@v1
        if: matrix.dock_platform == ''
        with:
          package-dir: packages/ruby
          dry-run: ${{ needs.prepare.outputs.dry_run }}

      - name: Build platform gem
        shell: bash
        run: |
          if [ -n "${{ matrix.dock_platform }}" ]; then
            # Cross-compile for Windows via Docker using rb-sys-dock.
            # The rb-sys-dock container ships its own Ruby toolchain; bundler
            # must `install` inside the container before `exec rake` so the
            # lockfile materializes against the container's Ruby version
            # rather than the host's.
            # Pin gem below 0.9.128 to get the 0.9.127 container, then exclude
            # Ruby 4.0.2 via RUBY_CC_VERSION — both 0.9.127 and 0.9.128 ship
            # Ruby 4.0.2 whose <ruby/defines.h> pulls <sys/select.h>, which
            # clang cannot resolve in the mingw cross sysroot. 0.9.127's
            # container also ships 3.1.7/3.2.11/3.3.11/3.4.9; pin to those.
            #
            # Run rb-sys-dock from the WORKSPACE ROOT so the container mounts
            # the whole repo — the gem's Cargo.toml has a path-dep
            # `html-to-markdown-rs = { path = "../../../../../crates/html-to-markdown" }`
            # which resolves outside `packages/ruby/` and would not exist in
            # a container mounted at the gem dir. Use `--directory packages/ruby`
            # so the container's working dir is still the gem root.
            gem install rb_sys -v '< 0.9.128'
            # Use `env VAR=val` to plant RUBY_CC_VERSION into the *command's* process
            # environment, surviving the container's /etc/profile.d default that
            # otherwise re-introduces Ruby 4.0.2 after `export`.
            # Wrap the in-container command in `set -euo pipefail` and
            # `::group::` markers so an individual step failure surfaces
            # its exit code on the runner log instead of disappearing into
            # the joined `&&` chain (rb-sys-dock chronic windows-x64
            # failures have been opaque since rc.19 because everything ran
            # inside one `bash -c "step1 && step2 && …"`).
            rb-sys-dock --directory packages/ruby --platform "${{ matrix.dock_platform }}" -- env RUBY_CC_VERSION=3.4.9:3.3.11:3.2.11:3.1.7 bash -c '
              set -euo pipefail
              echo "::group::rustup toolchain install"
              rustup toolchain install stable --no-self-update --profile minimal
              echo "::endgroup::"
              echo "::group::rustup default + target add"
              rustup default stable
              rustup target add x86_64-pc-windows-gnu
              echo "::endgroup::"
              echo "::group::bundle install"
              bundle install --jobs=4 --retry=3
              echo "::endgroup::"
              echo "::group::rake compile"
              bundle exec rake compile
              echo "::endgroup::"
              echo "::group::rake build"
              bundle exec rake build
              echo "::endgroup::"
            '
          else
            # Native build on matching architecture
            cd packages/ruby
            bundle exec rake compile
            bundle exec rake build
          fi

      - name: Drop source gem on non-canonical builders
        if: ${{ matrix.label != 'linux' }}
        shell: bash
        run: |
          shopt -s nullglob
          for f in packages/ruby/pkg/*.gem; do
            base="$(basename "$f")"
            case "$base" in
              *-x86_64-linux.gem|*-aarch64-linux.gem|*-arm64-darwin.gem|*-x86_64-darwin.gem|*-x64-mingw32.gem|*-x64-mingw-ucrt.gem|*-arm64-mingw-ucrt.gem) ;;
              *) echo "Removing non-canonical source gem $base"; rm -f "$f" ;;
            esac
          done

      - uses: actions/upload-artifact@v7
        with:
          name: rubygems-${{ matrix.label }}
          path: packages/ruby/pkg/*.gem
          retention-days: 14

  php-extension:
    name: Build PHP extension (php${{ matrix.php }} ${{ matrix.platform.label }})
    needs: [prepare, check-packagist, crates-gate]
    if: ${{ !cancelled() && needs.crates-gate.outputs.ok == 'true' && needs.prepare.outputs.release_php == 'true' && (needs.check-packagist.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        platform:
          - { os: ubuntu-latest, label: linux-x86_64, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, label: linux-arm64, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, label: macos-arm64, target: aarch64-apple-darwin }
          - { os: windows-latest, label: windows-x86_64, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: recursive

      - uses: xberg-io/actions/setup-php@v1
        with:
          php-version: ${{ matrix.php }}

      - uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: publish-php-${{ matrix.platform.label }}-php${{ matrix.php }}

      - uses: xberg-io/actions/install-alef@v1

      - uses: xberg-io/actions/build-php-extension@v1
        with:
          crate-name: html-to-markdown-php
          lib-name: html_to_markdown_php
          php-version: ${{ matrix.php }}
          php-ts: nts
          dry-run: ${{ needs.prepare.outputs.dry_run }}

      - name: Determine Windows compiler
        if: runner.os == 'Windows'
        id: wincompiler
        shell: pwsh
        run: |
          $compiler = switch ('${{ matrix.php }}') {
            '8.2' { 'vs16' }
            '8.3' { 'vs16' }
            '8.4' { 'vs17' }
            '8.5' { 'vs17' }
            default { 'vs17' }
          }
          "compiler=$compiler" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: xberg-io/actions/package-php-pie@v1
        with:
          php-version: ${{ matrix.php }}
          php-ts: nts
          target: ${{ matrix.platform.target }}
          windows-compiler: ${{ steps.wincompiler.outputs.compiler }}
          version: ${{ needs.prepare.outputs.version }}
          output-dir: dist/php-package

      - uses: actions/upload-artifact@v7
        with:
          name: php-package-${{ matrix.platform.label }}-php${{ matrix.php }}
          path: |
            dist/php-package/php_*.tgz
            dist/php-package/php_*.tgz.sha256
            dist/php-package/php_*.zip
            dist/php-package/php_*.zip.sha256
          retention-days: 14

  go-ffi-libraries:
    name: Build Go FFI library (${{ matrix.platform }})
    needs: [prepare, check-go]
    if: ${{ needs.prepare.outputs.release_go == 'true' && (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && (needs.check-go.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x64, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, platform: linux-arm64, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, platform: darwin-arm64, target: aarch64-apple-darwin }
          - { os: macos-15-intel, platform: darwin-x64, target: x86_64-apple-darwin }
          - { os: windows-latest, platform: windows-x64, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, platform: windows-arm64, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: xberg-io/actions/free-disk-space-linux@v1

      - uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.target }}
          cache-key-prefix: publish-go-${{ matrix.platform }}

      - uses: xberg-io/actions/install-alef@v1

      - name: Build and package Go FFI library
        shell: bash
        run: |
          alef publish build --lang ffi --target ${{ matrix.target }}
          alef publish package --lang go --target ${{ matrix.target }} -o dist/go-ffi
          # Workaround: alef 0.19.6 packages Go FFI archives with the same
          # `-ffi-` infix as the C FFI packager, which collides with the
          # `html-to-markdown-rs-ffi-*` asset-prefix probe used by check-go and
          # the verify-release-assets pattern list. Rename `-ffi-v` → `-go-v` so
          # downstream gating can distinguish Go from C FFI tarballs. Drop this
          # block once h2m's alef.toml moves to a release that ships the
          # alef-side fix (alef/src/publish/package/go.rs already uses `-go-`
          # on main).
          shopt -s nullglob
          for archive in dist/go-ffi/*-ffi-v*.tar.gz; do
            renamed="${archive/-ffi-v/-go-v}"
            mv "$archive" "$renamed"
          done
          shopt -u nullglob

      - uses: actions/upload-artifact@v7
        with:
          name: go-ffi-${{ matrix.platform }}
          path: dist/go-ffi
          retention-days: 14

  c-ffi-libraries:
    name: Build C FFI distribution (${{ matrix.platform }})
    needs: [prepare, check-c-ffi]
    if: ${{ needs.prepare.outputs.release_c_ffi == 'true' && (needs.check-c-ffi.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x64, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, platform: linux-arm64, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, platform: darwin-arm64, target: aarch64-apple-darwin }
          - { os: macos-15-intel, platform: darwin-x64, target: x86_64-apple-darwin }
          - { os: windows-latest, platform: windows-x64, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, platform: windows-arm64, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: xberg-io/actions/free-disk-space-linux@v1

      - uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.target }}
          cache-key-prefix: publish-c-ffi-${{ matrix.platform }}

      - uses: xberg-io/actions/install-alef@v1
        with:
          version: "0.107.12"

      - uses: xberg-io/actions/build-rust-ffi@v1
        with:
          crate-name: html-to-markdown-ffi
          target: ${{ matrix.target }}
          require-static: "true"

      - name: Package C FFI distribution
        shell: bash
        run: alef publish package --lang ffi --target ${{ matrix.target }} -o dist/c-ffi

      - uses: actions/upload-artifact@v7
        with:
          name: c-ffi-${{ matrix.platform }}
          path: dist/c-ffi
          retention-days: 14

  swift-artifactbundle:
    name: Build Swift Artifact Bundle
    needs: [prepare]
    if: ${{ (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.prepare.outputs.release_swift == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: recursive

      - uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: publish-swift-artifactbundle

      - uses: xberg-io/actions/build-swift-artifactbundle@v1
        id: build
        with:
          crate-name: html-to-markdown-rs-swift
          artifact-name: HtmlToMarkdown-rs
          header-path: target/release/build/html-to-markdown-rs-swift-*/out
          output-dir: dist/swift-artifactbundle
          build-profile: release

      - name: Record checksum
        id: checksum
        run: |
          CHECKSUM=$(cat "${{ steps.build.outputs.bundle-zip }}.sha256" 2>/dev/null || swift package compute-checksum "${{ steps.build.outputs.bundle-zip }}")
          echo "checksum=${CHECKSUM}" >> "$GITHUB_OUTPUT"
          echo "Artifact bundle checksum: ${CHECKSUM}"

      - uses: actions/upload-artifact@v7
        with:
          name: swift-artifactbundle
          path: dist/swift-artifactbundle
          retention-days: 14

      - name: Save checksum as artifact
        run: |
          mkdir -p dist/swift-checksums
          echo "${{ steps.checksum.outputs.checksum }}" > dist/swift-checksums/HtmlToMarkdown-rs.artifactbundle.zip.checksum

      - uses: actions/upload-artifact@v7
        with:
          name: swift-checksum
          path: dist/swift-checksums/
          retention-days: 14

  java-natives:
    name: Build Java FFI library (${{ matrix.platform }})
    needs: [prepare, check-maven]
    if: ${{ needs.prepare.outputs.release_java == 'true' && (needs.check-maven.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x86_64, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, platform: macos-arm64, target: aarch64-apple-darwin }
          - { os: macos-15-intel, platform: macos-x86_64, target: x86_64-apple-darwin }
          - { os: windows-latest, platform: windows-x86_64, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, platform: windows-aarch64, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: xberg-io/actions/free-disk-space-linux@v1

      - uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.target }}
          cache-key-prefix: publish-java-${{ matrix.platform }}

      - uses: xberg-io/actions/install-alef@v1

      - name: Build and stage FFI library
        shell: bash
        run: |
          alef publish build --lang ffi --target ${{ matrix.target }}
          mkdir -p "dist/java-ffi/${{ matrix.platform }}/native"
          for src in "target/${{ matrix.target }}/release" "target/release"; do
            [[ -d "$src" ]] || continue
            find "$src" -maxdepth 1 -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) -name '*html_to_markdown_ffi*' -exec cp {} "dist/java-ffi/${{ matrix.platform }}/native/" \;
          done
          ls -la "dist/java-ffi/${{ matrix.platform }}/native/"

      - uses: actions/upload-artifact@v7
        with:
          name: java-ffi-${{ matrix.platform }}
          path: dist/java-ffi
          if-no-files-found: error
          retention-days: 14

  csharp-natives:
    name: Build C# FFI library (${{ matrix.rid }})
    needs: [prepare, check-nuget]
    if: ${{ needs.prepare.outputs.release_csharp == 'true' && (needs.check-nuget.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, rid: osx-arm64, target: aarch64-apple-darwin }
          - { os: macos-15-intel, rid: osx-x64, target: x86_64-apple-darwin }
          - { os: windows-latest, rid: win-x64, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, rid: win-arm64, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: xberg-io/actions/free-disk-space-linux@v1

      - uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.target }}
          cache-key-prefix: publish-csharp-${{ matrix.rid }}

      - uses: xberg-io/actions/install-alef@v1

      - name: Build and stage FFI library
        shell: bash
        run: |
          alef publish build --lang ffi --target ${{ matrix.target }}
          mkdir -p "dist/csharp-ffi/${{ matrix.rid }}/native"
          for src in "target/${{ matrix.target }}/release" "target/release"; do
            [[ -d "$src" ]] || continue
            find "$src" -maxdepth 1 -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) -name '*html_to_markdown_ffi*' -exec cp {} "dist/csharp-ffi/${{ matrix.rid }}/native/" \;
          done
          ls -la "dist/csharp-ffi/${{ matrix.rid }}/native/"

      - uses: actions/upload-artifact@v7
        with:
          name: csharp-ffi-${{ matrix.rid }}
          path: dist/csharp-ffi
          if-no-files-found: error
          retention-days: 14

  elixir-natives:
    name: Build Elixir NIF (${{ matrix.label }})
    needs: [prepare, check-elixir-release, crates-gate]
    if: ${{ !cancelled() && needs.crates-gate.outputs.ok == 'true' && needs.prepare.outputs.release_elixir == 'true' && (needs.check-elixir-release.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: linux-x86_64, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, label: linux-aarch64, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, label: macos-arm64, target: aarch64-apple-darwin }
          - { os: macos-15-intel, label: macos-x86_64, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: xberg-io/actions/free-disk-space-linux@v1

      - uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.target }}
          cache-key-prefix: publish-elixir-${{ matrix.label }}

      - name: Rewrite native dependencies to registry versions
        if: needs.prepare.outputs.dry_run != 'true'
        uses: xberg-io/actions/rewrite-native-deps@v1
        with:
          lang: elixir

      - name: Build NIF
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          cargo build --release --locked --target "${TARGET}" \
            --manifest-path packages/elixir/native/html_to_markdown_nif/Cargo.toml
          NIF_DIR="packages/elixir/native/html_to_markdown_nif"
          # Source library extension on disk (set by cargo's cdylib output).
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            SRC_EXT="dylib"
          elif [[ "${RUNNER_OS}" == "Windows" ]]; then
            SRC_EXT="dll"
          else
            SRC_EXT="so"
          fi
          # Published artifact extension. rustler_precompiled (<= 0.9) hardcodes
          # `dll` for windows and `so` for everything else (including macOS) in
          # its download URL — see `lib_name_with_ext/2`. If we publish a .dylib
          # tarball, consumers 404 on darwin. Normalize to `so` on non-windows.
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            ARTIFACT_EXT="dll"
          else
            ARTIFACT_EXT="so"
          fi
          LIB_NAME="libhtml_to_markdown_nif.${SRC_EXT}"
          LIB_PATH="${NIF_DIR}/target/${TARGET}/release/${LIB_NAME}"
          [[ -f "$LIB_PATH" ]] || LIB_PATH="${NIF_DIR}/target/release/${LIB_NAME}"
          mkdir -p dist/elixir
          for NIF_VERSION in 2.16 2.17; do
            ARTIFACT="libhtml_to_markdown_nif-v${VERSION}-nif-${NIF_VERSION}-${TARGET}.${ARTIFACT_EXT}"
            cp "$LIB_PATH" "${ARTIFACT}"
            tar -czf "dist/elixir/${ARTIFACT}.tar.gz" "${ARTIFACT}"
            rm -f "${ARTIFACT}"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: elixir-${{ matrix.label }}
          path: dist/elixir/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  elixir-package:
    name: Build Elixir Hex package
    needs: [prepare, check-hex, crates-gate]
    if: ${{ !cancelled() && needs.crates-gate.outputs.ok == 'true' && needs.prepare.outputs.release_elixir == 'true' && (needs.check-hex.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: recursive

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28.1"

      - uses: xberg-io/actions/setup-rust@v1

      - uses: xberg-io/actions/build-elixir-hex@v1
        with:
          package-dir: packages/elixir
          nif-crate-path: packages/elixir/native/html_to_markdown_nif
          dry-run: ${{ needs.prepare.outputs.dry_run }}

      - uses: actions/upload-artifact@v7
        with:
          name: elixir-hex-package
          path: packages/elixir/html_to_markdown-*.tar
          retention-days: 14

  cargo-packages:
    name: Package Rust crates
    needs: [prepare, check-cratesio]
    if: ${{ needs.prepare.outputs.release_crates == 'true' && (needs.check-cratesio.outputs.all_exist != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: recursive

      - uses: xberg-io/actions/setup-rust@v1

      - name: Package crates
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          cargo package -p html-to-markdown-rs --allow-dirty
          cli_status=0
          cargo package -p html-to-markdown-cli --allow-dirty --no-verify || cli_status=$?
          mkdir -p crate-artifacts
          cp target/package/html-to-markdown-rs-*.crate crate-artifacts/
          if [[ "${cli_status}" -eq 0 ]]; then
            cp target/package/html-to-markdown-cli-*.crate crate-artifacts/
          else
            echo "::warning::Skipping html-to-markdown-cli crate packaging; html-to-markdown-rs ${RELEASE_VERSION} is not yet on crates.io."
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: cargo-crates
          path: crate-artifacts/*.crate
          retention-days: 14

  upload-cli-release:
    name: Build & upload CLI binaries
    needs: [prepare, validate-versions, check-cli]
    if: ${{ needs.prepare.outputs.release_cli == 'true' && (needs.check-cli.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') && (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') }}
    permissions:
      contents: write
    uses: xberg-io/actions/.github/workflows/reusable-cli-release.yml@v1
    with:
      package-name: html-to-markdown-cli
      binary-name: html-to-markdown
      tag: ${{ needs.prepare.outputs.tag }}
      asset-prefix: cli-
      checkout-ref: ${{ needs.prepare.outputs.checkout_ref }}
      dry-run: ${{ needs.prepare.outputs.dry_run }}
      build-musl: true
      checksums: true

  verify-binstall:
    # ~keep Must wait for promote-release, not just upload-cli-release. binstall resolves
    # `[package.metadata.binstall] pkg-url` to
    # `.../releases/download/v<version>/cli-<target>.tar.gz`, and that path 404s while the
    # release is still a draft (verified: draft asset 404, published asset 200). With
    # `--strategies crate-meta-data` there is no source fallback, so the job failed with
    # "Fallback to cargo-install is disabled" (exit 94) despite every asset being uploaded.
    name: Verify cargo-binstall install
    needs: [prepare, upload-cli-release, promote-release]
    # ~keep `promote-release.outputs.promoted`, not `.result`: promote-release now waits on the
    # per-language uploads, so its result carries their failure poison. See the note above it.
    if: ${{ !cancelled() && needs.prepare.outputs.release_cli == 'true' && needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.dry_run != 'true' && needs.upload-cli-release.result == 'success' && needs.promote-release.outputs.promoted == 'true' }}
    uses: xberg-io/actions/.github/workflows/reusable-binstall-verify.yml@v1
    with:
      package-name: html-to-markdown-cli
      binary-name: html-to-markdown
      manifest-path: crates/html-to-markdown-cli
      checkout-ref: ${{ needs.prepare.outputs.checkout_ref }}
      smoke-command: |
        html-to-markdown --version
        test "$(printf '<h1>Hello</h1>' | html-to-markdown)" = "# Hello"

  upload-go-release:
    name: Upload Go FFI archives to GitHub Release
    needs: [prepare, validate-versions, go-ffi-libraries]
    if: ${{ needs.prepare.outputs.release_go == 'true' && (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.go-ffi-libraries.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - uses: actions/download-artifact@v8
        with:
          pattern: go-ffi-*
          path: dist/go-ffi
          merge-multiple: true

      - name: Prepare Go installer archive aliases and checksums
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/prepare_go_release_assets.py dist/go-ffi html-to-markdown-rs "$RELEASE_VERSION"

      - uses: xberg-io/actions/upload-release-assets@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          working-directory: dist/go-ffi
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          assets: |
            **/*.tar.gz
            **/*.tar.gz.sha256
            **/*.zip

  upload-c-ffi-release:
    name: Upload C FFI archives to GitHub Release
    needs: [prepare, validate-versions, c-ffi-libraries]
    if: ${{ (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.c-ffi-libraries.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: c-ffi-*
          path: dist/c-ffi
          merge-multiple: true

      - uses: xberg-io/actions/upload-release-assets@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          working-directory: dist/c-ffi
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          assets: |
            **/*.tar.gz
            **/*.zip

  upload-swift-release:
    name: Upload Swift Artifact Bundle to GitHub Release
    needs: [prepare, validate-versions, swift-artifactbundle]
    if: ${{ (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.swift-artifactbundle.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: swift-*
          path: dist/swift
          merge-multiple: true

      - uses: xberg-io/actions/upload-release-assets@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          working-directory: dist/swift
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          assets: |
            **/*.zip
            **/*.checksum

  upload-elixir-release:
    name: Upload Elixir NIF archives to GitHub Release
    needs: [prepare, validate-versions, elixir-natives]
    # ~keep `!cancelled()` is load-bearing, not decoration. `crates-gate` is `if: always()`
    # over `check-cratesio`/`publish-crates`, which SKIP on a partial-target dispatch (e.g.
    # targets=ruby,elixir). `elixir-natives` survives that only because it carries its own
    # `!cancelled()`; without one here, GitHub's skipped-state propagation resumes at this job
    # and skips it before the `if` below is ever consulted -- observed on runs 33491693123,
    # 33494806766 and 33495781759, where every leg was green and this job still skipped.
    # Opting out of propagation means every need that must have succeeded is named explicitly.
    if: ${{ !cancelled() && (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.validate-versions.result == 'success' && needs.elixir-natives.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: elixir-*
          path: dist/elixir
          merge-multiple: true

      - uses: xberg-io/actions/upload-release-assets@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          working-directory: dist/elixir
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          assets: libhtml_to_markdown_nif-*.tar.gz

  upload-php-pie-release:
    name: Upload PHP PIE archives to GitHub Release
    needs: [prepare, validate-versions, php-extension]
    # ~keep `!cancelled()` opts this job out of failure propagation, so the `needs:` edge on
    # validate-versions orders it but does not gate it. The explicit `.result == 'success'`
    # term is what actually blocks publishing when the manifest versions do not match the tag.
    if: ${{ !cancelled() && needs.validate-versions.result == 'success' && (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.php-extension.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: php-package-*
          path: dist/php-package
          merge-multiple: true

      - uses: xberg-io/actions/upload-release-assets@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          working-directory: dist/php-package
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          assets: |
            php_*.tgz
            php_*.tgz.sha256
            php_*.zip
            php_*.zip.sha256

  publish-crates:
    name: Publish crates.io packages
    needs: [prepare, validate-versions, cargo-packages, check-cratesio]
    if: ${{ needs.prepare.outputs.release_crates == 'true' && needs.prepare.outputs.is_tag == 'true' && needs.cargo-packages.result == 'success' && (needs.check-cratesio.outputs.all_exist != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          submodules: recursive

      - uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: publish-crates

      - uses: xberg-io/actions/publish-crates@v1
        with:
          crates: html-to-markdown-rs html-to-markdown-cli
          version: ${{ needs.prepare.outputs.version }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}

      # ~keep A `cargo publish`/registry-upload action reporting success is not
      # proof the package actually landed — this repo has previously shipped a
      # release where an npm publish step reported success for two releases
      # while publishing nothing (html-to-markdown audit #39). Post-verify the
      # external effect instead of trusting the tool's exit code.
      - name: Verify crates.io indexing
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        uses: xberg-io/actions/wait-for-package@v1
        with:
          registry: cratesio
          package: html-to-markdown-rs
          version: ${{ needs.prepare.outputs.version }}
          max-attempts: "60"

  # ~keep `needs.publish-crates.result != 'failure'` is TRUE when publish-crates was SKIPPED,
  # and publish-crates skips for two opposite reasons: the version is already on crates.io
  # (a re-run or a resumed release — downstream must proceed), or an upstream gate such as
  # cargo-packages failed (downstream must NOT proceed). `result` alone cannot tell them
  # apart, so every downstream job that read it was gating on nothing: tree-sitter-language-pack
  # v1.15.5 published a GitHub release to zero registries that way and still reported success.
  # This job always runs, so its outputs always exist, and it resolves the ambiguity once into
  # an explicit outcome the whole workflow tests instead of re-deriving it at each call site.
  crates-gate:
    name: Crates.io publish gate
    needs: [prepare, check-cratesio, publish-crates]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.decide.outputs.ok }}
      outcome: ${{ steps.decide.outputs.outcome }}
    steps:
      - id: decide
        name: Decide whether the crates.io prerequisite is satisfied
        shell: bash
        env:
          RESULT_PUBLISH_CRATES: ${{ needs.publish-crates.result }}
          RELEASE_CRATES: ${{ needs.prepare.outputs.release_crates }}
          IS_TAG: ${{ needs.prepare.outputs.is_tag }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
          FORCE_REPUBLISH: ${{ needs.prepare.outputs.force_republish }}
          ALREADY_ON_CRATESIO: ${{ needs.check-cratesio.outputs.all_exist }}
        run: |
          set -uo pipefail

          if [[ "${RESULT_PUBLISH_CRATES}" == "failure" ]]; then
            outcome="blocked"
          elif [[ "${RESULT_PUBLISH_CRATES}" == "success" ]]; then
            outcome="published"
          elif [[ "${RELEASE_CRATES}" != "true" ]]; then
            outcome="not-required"
          elif [[ "${DRY_RUN}" == "true" ]]; then
            outcome="dry-run"
          elif [[ "${IS_TAG}" != "true" ]]; then
            outcome="not-a-tag"
          elif [[ "${ALREADY_ON_CRATESIO}" == "true" && "${FORCE_REPUBLISH}" != "true" ]]; then
            outcome="already-present"
          else
            outcome="blocked"
          fi

          if [[ "${outcome}" == "blocked" ]]; then
            ok="false"
            echo "::error title=crates.io prerequisite not met::publish-crates finished with '${RESULT_PUBLISH_CRATES}' and this version is not on crates.io — every job that builds or publishes against the released crate will be held back."
          else
            ok="true"
          fi

          echo "outcome=${outcome}" >>"$GITHUB_OUTPUT"
          echo "ok=${ok}" >>"$GITHUB_OUTPUT"
          echo "crates-gate: outcome=${outcome} ok=${ok} (publish-crates=${RESULT_PUBLISH_CRATES})"

  publish-pypi:
    name: Publish to PyPI
    needs: [prepare, validate-versions, python-wheels, python-sdist, check-pypi]
    # ~keep See `upload-elixir-release`: `python-sdist` reaches this job through the
    # `crates-gate` chain and survives a partial-target dispatch only via its own
    # `!cancelled()`. Without one here the propagated skip wins over the `if:`. Both build
    # needs are already named explicitly, which is what opting out of propagation requires.
    if: ${{ !cancelled() && needs.prepare.outputs.release_python == 'true' && needs.prepare.outputs.is_tag == 'true' && needs.validate-versions.result == 'success' && needs.python-wheels.result == 'success' && needs.python-sdist.result == 'success' && (needs.check-pypi.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: python-wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: python-sdist
          path: dist

      - uses: xberg-io/actions/publish-pypi@v1
        with:
          packages-dir: dist
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          expected-version: ${{ needs.prepare.outputs.pypi_version }}

      - name: Verify PyPI indexing
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        uses: xberg-io/actions/wait-for-package@v1
        with:
          registry: pypi
          package: html-to-markdown
          version: ${{ needs.prepare.outputs.version }}
          max-attempts: "60"

  publish-rubygems:
    name: Publish Ruby gems
    needs: [prepare, validate-versions, ruby-gem, check-rubygems]
    # ~keep See `upload-elixir-release`: `ruby-gem` reaches this job through `crates-gate`,
    # which is `if: always()` over jobs that skip on a partial-target dispatch. Without
    # `!cancelled()` here the propagated skip wins over the `if`.
    if: ${{ !cancelled() && needs.prepare.outputs.release_ruby == 'true' && needs.prepare.outputs.is_tag == 'true' && needs.validate-versions.result == 'success' && needs.ruby-gem.result == 'success' && (needs.check-rubygems.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: rubygems-*
          path: dist
          merge-multiple: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Update RubyGems
        run: gem update --system
        shell: bash

      - uses: rubygems/configure-rubygems-credentials@v2.1.0

      - uses: xberg-io/actions/publish-rubygems@v1
        with:
          gems-dir: dist
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          expected-version: ${{ needs.prepare.outputs.gem_version }}

      - name: Verify RubyGems indexing
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        uses: xberg-io/actions/wait-for-package@v1
        with:
          registry: rubygems
          package: html-to-markdown
          version: ${{ needs.prepare.outputs.version }}
          max-attempts: "60"

  publish-node:
    name: Publish Node packages
    needs: [prepare, validate-versions, node-bindings, node-typescript-defs, check-npm]
    if: ${{ needs.prepare.outputs.release_node == 'true' && needs.prepare.outputs.is_tag == 'true' && needs.node-bindings.result == 'success' && needs.node-typescript-defs.result == 'success' && (needs.check-npm.outputs.node_exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          submodules: recursive

      - uses: actions/download-artifact@v8
        with:
          pattern: node-bindings-*
          path: node-artifacts
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: node-typescript-defs
          path: typescript-defs

      - uses: xberg-io/actions/setup-node-workspace@v1
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"

      - name: Stage platform packages and main package
        shell: bash
        run: |
          rm -rf crates/html-to-markdown-node/npm
          mkdir -p crates/html-to-markdown-node/npm
          for pkg in node-artifacts/*.tar.gz; do
            tar -xzf "${pkg}" -C crates/html-to-markdown-node
          done
          cp typescript-defs/index.js typescript-defs/index.d.ts crates/html-to-markdown-node/

          # Pack each platform sub-package as a tarball
          cd crates/html-to-markdown-node/npm
          for dir in */; do
            if [ -f "$dir/package.json" ]; then
              (cd "$dir" && npm pack && mv ./*.tgz ..)
            fi
          done
          cd ../../..

          # Stamp main package's optionalDependencies with all platform packages
          tmp_pkg_json="$(mktemp)"
          optional_deps_json='{}'
          for platform_pkg_json in crates/html-to-markdown-node/npm/*/package.json; do
            name="$(jq -r '.name // empty' "$platform_pkg_json")"
            version="$(jq -r '.version // empty' "$platform_pkg_json")"
            [[ -z "$name" || -z "$version" ]] && { echo "Invalid: $platform_pkg_json" >&2; exit 1; }
            optional_deps_json="$(jq -c --arg n "$name" --arg v "$version" '. + {($n): $v}' <<<"$optional_deps_json")"
          done
          jq --argjson deps "$optional_deps_json" '.optionalDependencies = $deps' \
            crates/html-to-markdown-node/package.json > "$tmp_pkg_json"
          mv "$tmp_pkg_json" crates/html-to-markdown-node/package.json

      - name: Verify platform package binaries
        uses: xberg-io/actions/verify-platform-packages@v1
        with:
          manifest-path: crates/html-to-markdown-node/package.json
          mode: binaries
          version: ${{ needs.prepare.outputs.version }}

      - name: Publish platform sub-packages
        uses: xberg-io/actions/publish-npm@v1
        with:
          packages-dir: crates/html-to-markdown-node/npm
          npm-tag: ${{ needs.prepare.outputs.npm_tag }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          expected-version: ${{ needs.prepare.outputs.version }}

      - name: Verify platform packages on npm
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        uses: xberg-io/actions/verify-platform-packages@v1
        with:
          manifest-path: crates/html-to-markdown-node/package.json
          mode: registry
          registry: npm
          version: ${{ needs.prepare.outputs.version }}
          max-attempts: "60"

      - name: Publish main @xberg-io/html-to-markdown package
        uses: xberg-io/actions/publish-npm@v1
        with:
          package-dir: crates/html-to-markdown-node
          npm-tag: ${{ needs.prepare.outputs.npm_tag }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          expected-version: ${{ needs.prepare.outputs.version }}

      - name: Wait for main Node package indexing
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        uses: xberg-io/actions/wait-for-package@v1
        with:
          registry: npm
          package: "@xberg-io/html-to-markdown"
          version: ${{ needs.prepare.outputs.version }}
          max-attempts: "60"

  publish-wasm:
    name: Publish WASM package
    needs: [prepare, validate-versions, wasm-bindings, check-wasm]
    if: ${{ needs.prepare.outputs.release_wasm == 'true' && needs.prepare.outputs.is_tag == 'true' && needs.wasm-bindings.result == 'success' && (needs.check-wasm.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          submodules: recursive

      - uses: actions/download-artifact@v8
        with:
          name: wasm-bundle
          path: crates/html-to-markdown-wasm

      - name: Drop dist .gitignore files
        shell: bash
        run: |
          rm -f crates/html-to-markdown-wasm/dist/.gitignore
          rm -f crates/html-to-markdown-wasm/dist-node/.gitignore
          rm -f crates/html-to-markdown-wasm/dist-web/.gitignore

      - uses: xberg-io/actions/setup-node-workspace@v1
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"

      - uses: xberg-io/actions/publish-npm@v1
        with:
          package-dir: crates/html-to-markdown-wasm
          npm-tag: ${{ needs.prepare.outputs.npm_tag }}
          provenance: "true"
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          expected-version: ${{ needs.prepare.outputs.version }}

      - name: Verify npm indexing
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        uses: xberg-io/actions/wait-for-package@v1
        with:
          registry: npm
          package: "@xberg-io/html-to-markdown-wasm"
          version: ${{ needs.prepare.outputs.version }}
          max-attempts: "60"

  publish-packagist:
    name: Trigger Packagist update
    needs: [prepare, validate-versions, upload-php-pie-release, check-packagist]
    # ~keep Packagist indexes the git tag, not the PIE archives, so a dropped PHP matrix cell must
    # not stop it. `!cancelled()` opts out of the failure that propagates from `php-extension`.
    # It also opts out of a failed validate-versions, hence the explicit result term below.
    if: ${{ !cancelled() && needs.validate-versions.result == 'success' && needs.prepare.outputs.release_php == 'true' && needs.prepare.outputs.is_tag == 'true' && (needs.check-packagist.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: xberg-io/actions/publish-packagist@v1
        with:
          packagist-username: Goldziher
          package-name: xberg-io/html-to-markdown
          version: ${{ needs.prepare.outputs.version }}
          repository-url: https://github.com/xberg-io/html-to-markdown
          dry-run: ${{ needs.prepare.outputs.dry_run }}
        env:
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}

      - name: Verify Packagist indexing
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        uses: xberg-io/actions/wait-for-package@v1
        with:
          registry: packagist
          package: xberg-io/html-to-markdown
          version: ${{ needs.prepare.outputs.version }}
          max-attempts: "60"

  publish-maven:
    name: Publish Maven (Java) package
    needs: [prepare, validate-versions, java-natives, check-maven]
    if: ${{ needs.prepare.outputs.release_java == 'true' && needs.prepare.outputs.is_tag == 'true' && needs.java-natives.result == 'success' && (needs.check-maven.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          submodules: recursive

      - uses: actions/download-artifact@v8
        with:
          pattern: java-ffi-*
          path: java-ffi-artifacts
          merge-multiple: true

      - name: Stage natives into resources
        shell: bash
        run: |
          mkdir -p packages/java/src/main/resources/natives
          rm -rf packages/java/src/main/resources/natives/*
          for dir in java-ffi-artifacts/*/; do
            classifier="$(basename "$dir")"
            mkdir -p "packages/java/src/main/resources/natives/${classifier}"
            cp -r "${dir}native/." "packages/java/src/main/resources/natives/${classifier}/"
          done

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - uses: xberg-io/actions/setup-maven@v1

      - uses: xberg-io/actions/configure-maven-gpg@v1
        with:
          pom-file: packages/java/pom.xml

      - uses: xberg-io/actions/publish-maven@v1
        with:
          pom-file: packages/java/pom.xml
          maven-profile: publish
          extra-args: -DskipTests
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          expected-version: ${{ needs.prepare.outputs.version }}
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Verify Maven Central indexing
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        uses: xberg-io/actions/wait-for-package@v1
        with:
          registry: maven
          package: "io.xberg:html-to-markdown"
          version: ${{ needs.prepare.outputs.version }}
          max-attempts: "60"

  publish-nuget:
    name: Publish NuGet package
    needs: [prepare, validate-versions, csharp-natives, check-nuget]
    if: ${{ needs.prepare.outputs.release_csharp == 'true' && needs.prepare.outputs.is_tag == 'true' && needs.csharp-natives.result == 'success' && (needs.check-nuget.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          submodules: recursive

      - uses: actions/download-artifact@v8
        with:
          pattern: csharp-ffi-*
          path: dist/csharp-ffi
          merge-multiple: true

      # ~keep CSHARP_RIDS is the csharp-natives build matrix, the runtime.json.template
      # RID-fallback graph, and the csproj <RuntimeIdentifiers> — one list so the three
      # cannot drift. The copy used to end in `|| true`, which turned a RID whose native
      # library never arrived (a matrix leg that failed under `fail-fast: false`, or an
      # artifact that downloaded empty) into a silent partial stage. Fail on the copy and
      # then assert every expected RID actually landed, so a missing native is loud here
      # instead of shipping a runtime graph pointing at payloads that do not exist.
      - name: Stage runtimes/<rid>/native into NuGet project
        shell: bash
        env:
          CSHARP_RIDS: linux-x64 linux-arm64 osx-arm64 osx-x64 win-x64 win-arm64
        run: |
          mkdir -p packages/csharp/HtmlToMarkdown/runtimes
          for dir in dist/csharp-ffi/*/; do
            rid="$(basename "$dir")"
            mkdir -p "packages/csharp/HtmlToMarkdown/runtimes/${rid}/native"
            cp -v "${dir}native/"* "packages/csharp/HtmlToMarkdown/runtimes/${rid}/native/"
          done
          missing=""
          for rid in ${CSHARP_RIDS}; do
            dest="packages/csharp/HtmlToMarkdown/runtimes/${rid}/native"
            if [[ -z "$(find "${dest}" -type f -print -quit 2>/dev/null)" ]]; then
              missing="${missing} ${rid}"
            fi
          done
          if [[ -n "${missing}" ]]; then
            echo "::error::no native library staged for RID(s):${missing}"
            exit 1
          fi
          echo "staged natives for all RIDs: ${CSHARP_RIDS}"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Render runtime.json from template
        uses: xberg-io/actions/render-runtime-json@v1
        with:
          template-path: packages/csharp/HtmlToMarkdown/runtime.json.template
          version: ${{ needs.prepare.outputs.version }}

      - name: Pack NuGet package
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          bash scripts/ci/csharp/pack-runtimes.sh "$VERSION" dist/nuget
          dotnet restore packages/csharp/HtmlToMarkdown/HtmlToMarkdown.csproj
          dotnet pack packages/csharp/HtmlToMarkdown/HtmlToMarkdown.csproj \
            -c Release \
            -p:Version=${{ needs.prepare.outputs.version }} \
            -o dist/nuget

      - uses: xberg-io/actions/publish-nuget@v1
        with:
          packages-dir: dist/nuget
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          expected-version: ${{ needs.prepare.outputs.version }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: Verify NuGet indexing
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        uses: xberg-io/actions/wait-for-package@v1
        with:
          registry: nuget
          package: XbergIo.HtmlToMarkdown
          version: ${{ needs.prepare.outputs.version }}
          max-attempts: "60"

  publish-hex:
    name: Publish Hex package
    needs: [prepare, validate-versions, elixir-package, upload-elixir-release, check-hex]
    # ~keep See `upload-elixir-release`. Both `elixir-package` and `upload-elixir-release`
    # sit downstream of the skip-propagating `crates-gate` chain, so each is named explicitly.
    if: ${{ !cancelled() && needs.prepare.outputs.release_elixir == 'true' && needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.dry_run != 'true' && needs.validate-versions.result == 'success' && needs.elixir-package.result == 'success' && needs.upload-elixir-release.result == 'success' && (needs.check-hex.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          submodules: recursive

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28.1"

      - name: Generate NIF checksum file
        uses: xberg-io/actions/generate-elixir-checksums@v1
        with:
          github-repo: ${{ github.repository }}
          tag: ${{ needs.prepare.outputs.tag }}
          version: ${{ needs.prepare.outputs.version }}
          lib-name: html_to_markdown_nif
          nif-versions: "2.16,2.17"
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,aarch64-apple-darwin,x86_64-apple-darwin
          output-path: packages/elixir/checksum-Elixir.HtmlToMarkdown.Native.exs
          token: ${{ steps.app-token.outputs.token }}

      - uses: xberg-io/actions/publish-hex@v1
        with:
          package-dir: packages/elixir
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          expected-version: ${{ needs.prepare.outputs.version }}
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

      # ~keep Job-level `if:` already excludes dry_run == 'true' for this job, but
      # keep the guard explicit here too so this step reads correctly in isolation.
      - name: Verify Hex.pm indexing
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        uses: xberg-io/actions/wait-for-package@v1
        with:
          registry: hex
          package: html_to_markdown
          version: ${{ needs.prepare.outputs.version }}
          max-attempts: "60"

  kotlin-android-natives:
    name: Build Kotlin Android natives (${{ matrix.abi }})
    needs: [prepare]
    if: ${{ needs.prepare.outputs.release_kotlin == 'true' && (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64, armeabi-v7a, x86]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          submodules: recursive

      - uses: xberg-io/actions/setup-rust@v1
        with:
          targets: aarch64-linux-android,x86_64-linux-android,armv7-linux-androideabi,i686-linux-android

      # Google removed the legacy `tools` SDK package, but setup-android's `packages` input
      # still defaults to `tools platform-tools`, so a bare invocation now dies on
      # `Warning: Failed to find package 'tools'` -> sdkmanager exit 1, which took out all four
      # kotlin-android-natives legs of the 3.13.0 release. Request platform-tools explicitly. ~keep
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      # ~keep Bundle the JNI crate (libhtm_jni.so) that the Kotlin bridge loads
      # via System.loadLibrary("htm_jni") — NOT the plain C-FFI crate, whose
      # lib*_ffi.so lacks the JNI entry points (html-to-markdown#446).
      - uses: xberg-io/actions/build-android-natives@v1
        with:
          crate-name: html-to-markdown-rs-jni
          lib-name: htm_jni
          abis: ${{ matrix.abi }}

      - uses: actions/upload-artifact@v7
        with:
          name: kotlin-android-${{ matrix.abi }}
          # Upload the natives root so the ${{ matrix.abi }}/ subdir is preserved
          # in the artifact and merges back per-ABI at staging time.
          path: dist/android-natives
          if-no-files-found: error
          retention-days: 7

  publish-kotlin-android:
    name: Publish Kotlin Android to Maven Central
    needs: [prepare, validate-versions, kotlin-android-natives, check-maven-kotlin]
    if: ${{ needs.prepare.outputs.release_kotlin == 'true' && needs.prepare.outputs.is_tag == 'true' && (needs.check-maven-kotlin.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          submodules: recursive

      - uses: actions/download-artifact@v8
        with:
          pattern: kotlin-android-*
          path: kotlin-android-artifacts
          merge-multiple: true

      - name: Stage Android natives into Kotlin Android module
        shell: bash
        run: |
          for abi in arm64-v8a x86_64 armeabi-v7a x86; do
            dest="packages/kotlin-android/src/main/jniLibs/${abi}"
            mkdir -p "$dest"
            # ~keep cp fails the job if the lib is missing — a jni-less AAR must
            # never publish (html-to-markdown#446). The gradle guard is the backstop.
            cp -v "kotlin-android-artifacts/${abi}/libhtm_jni.so" "$dest/"
          done

      - uses: xberg-io/actions/publish-maven-gradle@v1
        with:
          working-directory: packages/kotlin-android
          gradle-task: publishAndReleaseToMavenCentral
          dry-run: ${{ needs.prepare.outputs.dry_run }}
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Verify Maven Central indexing
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        uses: xberg-io/actions/wait-for-package@v1
        with:
          registry: maven
          package: "io.xberg:html-to-markdown-android"
          version: ${{ needs.prepare.outputs.version }}
          max-attempts: "60"

  trigger-pubdev:
    name: Trigger pub.dev publish workflow
    # ~keep Named `trigger-` rather than `publish-`, but it dispatches publish-pubdev.yaml, which
    # publishes to pub.dev. pub.dev refuses to replace a published version, so it needs the same
    # validate-versions gate as the jobs that publish directly.
    needs: [prepare, validate-versions, check-pub, assemble-dart-package]
    if: ${{ needs.prepare.outputs.release_dart == 'true' && needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.dry_run != 'true' && (needs.check-pub.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - name: Dispatch publish-pubdev workflow
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # pub.dev OIDC validation requires refType=tag on the token. When this
          # workflow is triggered by `release: published`, github.ref_name is the
          # release-creating branch (e.g. main), which yields refType=branch and
          # pub.dev rejects with "publishing is only allowed from 'tag' refType".
          # Dispatch against the actual tag instead.
          gh workflow run publish-pubdev.yaml \
            --ref ${{ needs.prepare.outputs.tag }} \
            -f run_id=${{ github.run_id }}

  publish-zig:
    name: Publish Zig package metadata
    needs: [prepare, validate-versions, check-zig, assemble-zig-package]
    if: ${{ needs.prepare.outputs.release_zig == 'true' && needs.prepare.outputs.is_tag == 'true' && (needs.check-zig.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') && needs.assemble-zig-package.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - uses: actions/download-artifact@v8
        with:
          name: zig-package-assembled
          path: zig-ffi-artifacts

      - uses: xberg-io/actions/publish-zig@v1
        with:
          working-directory: packages/zig
          tag: ${{ needs.prepare.outputs.tag }}
          # ~keep → 404 + consumer build.zig.zon placeholder hash.
          package-name: html-to-markdown-rs-zig
          multi-platform-ffi-dir: zig-ffi-artifacts
          module-name: html_to_markdown_rs
          ffi-lib-name: html_to_markdown_ffi
          update-release-notes: "true"
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          token: ${{ steps.app-token.outputs.token }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  # --- Release spine: promote -> finalize -> announce ------------------------------------------
  # These jobs decide whether the release exists at all, so they gate ONLY on release-blocking
  # jobs: version validation, crates.io, and the CLI + C FFI assets the release page, Homebrew
  # and cargo-binstall are built around. Per-language artifact jobs stay in `needs` for ordering
  # but never appear in the `if`.
  #
  # Two GitHub Actions rules make that distinction load-bearing, and v3.11.3 (run 32467842571)
  # hit both. Four `php-extension` Windows legs failed and nothing else did, yet the release was
  # never promoted, never finalized, never announced, and the Homebrew bottles and binstall
  # verification never ran:
  #   1. A failure propagates down the whole `needs` chain, so a job's implicit `success()` gate
  #      is false even when its own direct needs all succeeded. `!cancelled()` (or `always()`)
  #      is required to opt out of that.
  #   2. The propagated failure also poisons the VALUE of `needs.<job>.result`. In that run
  #      `upload-php-pie-release` concluded `success`, but downstream jobs read its result as
  #      `failure`, so `!contains(needs.*.result, 'failure')` was false and `always()` did not
  #      save `verify-assets`, `release-finalize` or `announce-discord`.
  # Consequence: a result check is only trustworthy for a job whose ENTIRE ancestry is
  # release-blocking. To hand a trustworthy signal downstream, promote-release publishes a
  # `promoted` output instead — job outputs carry no failure poison. ~keep
  promote-release:
    name: Publish GitHub Release from draft
    needs:
      - prepare
      - validate-versions
      - crates-gate
      - upload-cli-release
      - upload-c-ffi-release
      # ~keep Ordering only: the draft flips once every per-language asset upload has settled, so
      # a published release is not missing assets that are still uploading. Their results are
      # deliberately absent from the `if` below — one language's artifact must not block the
      # release.
      - upload-go-release
      - upload-swift-release
      - upload-elixir-release
      - upload-php-pie-release
      - upload-r-release
    if: |
      !cancelled() &&
      needs.prepare.outputs.is_tag == 'true' &&
      needs.prepare.outputs.dry_run != 'true' &&
      needs.validate-versions.result == 'success' &&
      needs.crates-gate.outputs.ok == 'true' &&
      needs.upload-cli-release.result == 'success' &&
      needs.upload-c-ffi-release.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      promoted: ${{ steps.flip.outputs.promoted }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io
      - name: Flip release out of draft
        id: flip
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit "${{ needs.prepare.outputs.tag }}" --draft=false
          echo "promoted=true" >>"$GITHUB_OUTPUT"

  publish-homebrew-formula:
    name: Update Homebrew formulas
    needs: [prepare, validate-versions, check-homebrew, upload-cli-release, upload-c-ffi-release]
    if: ${{ needs.prepare.outputs.release_homebrew == 'true' && needs.upload-cli-release.result == 'success' && needs.upload-c-ffi-release.result == 'success' && (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && (needs.check-homebrew.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: tap-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io
          repositories: homebrew-tap

      - uses: actions/create-github-app-token@v3
        id: source-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - uses: actions/checkout@v7
        with:
          repository: xberg-io/homebrew-tap
          token: ${{ steps.tap-token.outputs.token }}
          path: homebrew-tap
          persist-credentials: true

      - uses: xberg-io/actions/publish-homebrew-source-formulas@v1
        with:
          tap-dir: ${{ github.workspace }}/homebrew-tap
          config-file: scripts/publish/homebrew.json
          tag: ${{ needs.prepare.outputs.tag }}
          version: ${{ needs.prepare.outputs.version }}
          github-repo: ${{ github.repository }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          token: ${{ steps.source-token.outputs.token }}

      - name: Commit and push to tap
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        working-directory: homebrew-tap
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: |
          git config user.name "xberg-dev-publisher[bot]"
          git config user.email "291994444+xberg-dev-publisher[bot]@users.noreply.github.com"
          if git diff --quiet Formula/; then
            echo "No formula changes; skipping commit."
            exit 0
          fi
          git add Formula/html-to-markdown.rb Formula/libhtml-to-markdown.rb
          git commit -m "html-to-markdown ${{ needs.prepare.outputs.version }}"
          # Every repo's publish pipeline pushes to this one shared tap, so a concurrent
          # release can land between our checkout and our push and reject it as non-fast-forward.
          # Each repo touches only its own formulas, so rebasing onto the new tip and retrying is
          # safe -- there is nothing for two releases to genuinely conflict over. ~keep
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto the current tap tip"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::tap rebase hit a real conflict; refusing to force the push"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "::error::could not push to the tap after 5 attempts"
          exit 1

  # The Windows counterpart of publish-homebrew-formula. There is deliberately no
  # `check-scoop` idempotency gate: the render step rewrites the manifest in place and
  # the commit below is guarded by `git diff --quiet bucket/`, so re-running a release
  # is already a no-op. ~keep
  publish-scoop-manifest:
    name: Update Scoop manifest
    needs: [prepare, validate-versions, upload-cli-release]
    if: ${{ needs.prepare.outputs.release_scoop == 'true' && needs.upload-cli-release.result == 'success' && (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: bucket-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io
          repositories: scoop-bucket

      - uses: actions/create-github-app-token@v3
        id: source-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - uses: actions/checkout@v7
        with:
          repository: xberg-io/scoop-bucket
          token: ${{ steps.bucket-token.outputs.token }}
          path: scoop-bucket
          persist-credentials: true

      - uses: xberg-io/actions/publish-scoop-manifests@v1
        with:
          bucket-dir: ${{ github.workspace }}/scoop-bucket
          config-file: scripts/publish/scoop.json
          tag: ${{ needs.prepare.outputs.tag }}
          version: ${{ needs.prepare.outputs.version }}
          github-repo: ${{ github.repository }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          token: ${{ steps.source-token.outputs.token }}

      - name: Commit and push to bucket
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        working-directory: scoop-bucket
        env:
          GH_TOKEN: ${{ steps.bucket-token.outputs.token }}
        run: |
          git config user.name "xberg-dev-publisher[bot]"
          git config user.email "291994444+xberg-dev-publisher[bot]@users.noreply.github.com"
          if git diff --quiet bucket/; then
            echo "No manifest changes; skipping commit."
            exit 0
          fi
          git add bucket/html-to-markdown.json
          git commit -m "html-to-markdown ${{ needs.prepare.outputs.version }}"
          # Six release pipelines push to this one bucket, so a concurrent release can land
          # between our checkout and our push and reject it as non-fast-forward. Each repo
          # touches only its own manifest, so rebasing onto the new tip and retrying is safe --
          # there is nothing for two releases to genuinely conflict over. ~keep
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto the current bucket tip"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::bucket rebase hit a real conflict; refusing to force the push"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "::error::could not push to the bucket after 5 attempts"
          exit 1

  homebrew-bottles:
    name: Build Homebrew bottle (${{ matrix.bottle_tag }})
    needs: [prepare, publish-homebrew-formula, promote-release]
    if: ${{ !cancelled() && needs.prepare.outputs.release_homebrew == 'true' && needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.dry_run != 'true' && needs.publish-homebrew-formula.result == 'success' && needs.promote-release.outputs.promoted == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, bottle_tag: arm64_sonoma, install_brew: false }
          - { os: ubuntu-latest, bottle_tag: x86_64_linux, install_brew: true }
          - { os: ubuntu-24.04-arm, bottle_tag: arm64_linux, install_brew: true }
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Install Homebrew (Linux)
        if: ${{ matrix.install_brew }}
        uses: xberg-io/actions/install-homebrew-linux@v1

      - name: Build bottles
        uses: xberg-io/actions/homebrew-build-bottles@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          version: ${{ needs.prepare.outputs.version }}
          tap: xberg-io/tap
          formulas: |
            html-to-markdown
            libhtml-to-markdown
          out-dir: ${{ github.workspace }}/bottle-json
          github-repo: xberg-io/html-to-markdown
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/upload-artifact@v7
        with:
          name: homebrew-bottle-json-${{ matrix.bottle_tag }}
          path: ${{ github.workspace }}/bottle-json/*.json
          if-no-files-found: error
          retention-days: 14

  publish-homebrew-bottles:
    name: Merge Homebrew bottle DSL
    needs: [prepare, validate-versions, publish-homebrew-formula, homebrew-bottles, promote-release]
    # ~keep `homebrew-bottles.result` is poisoned by anything upstream of promote-release, so gate
    # on the two clean signals instead. A genuinely failed bottle leg still turns the run red on
    # its own, and this job then fails loudly on the missing bottle JSON rather than vanishing.
    # `!cancelled()` also waives a failed validate-versions, hence the explicit result term.
    if: ${{ !cancelled() && needs.validate-versions.result == 'success' && needs.prepare.outputs.release_homebrew == 'true' && needs.prepare.outputs.is_tag == 'true' && needs.publish-homebrew-formula.result == 'success' && needs.promote-release.outputs.promoted == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: tap-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io
          repositories: homebrew-tap

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - uses: actions/checkout@v7
        with:
          repository: xberg-io/homebrew-tap
          token: ${{ steps.tap-token.outputs.token }}
          path: homebrew-tap
          persist-credentials: true

      - uses: actions/download-artifact@v8
        with:
          path: ${{ github.workspace }}/bottle-json
          pattern: homebrew-bottle-json-*
          merge-multiple: true

      - uses: xberg-io/actions/homebrew-merge-bottles@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          version: ${{ needs.prepare.outputs.version }}
          tap-dir: ${{ github.workspace }}/homebrew-tap
          json-dir: ${{ github.workspace }}/bottle-json
          formulas: |
            html-to-markdown
            libhtml-to-markdown
          github-repo: xberg-io/html-to-markdown

      - name: Commit and push bottle DSL
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        working-directory: homebrew-tap
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: |
          git config user.name "xberg-dev-publisher[bot]"
          git config user.email "291994444+xberg-dev-publisher[bot]@users.noreply.github.com"
          if git diff --quiet Formula/; then
            echo "No bottle DSL changes; skipping commit."
            exit 0
          fi
          git add Formula/html-to-markdown.rb Formula/libhtml-to-markdown.rb
          git commit -m "html-to-markdown ${{ needs.prepare.outputs.version }}: add bottle DSL"
          # Every repo's publish pipeline pushes to this one shared tap, so a concurrent
          # release can land between our checkout and our push and reject it as non-fast-forward.
          # Each repo touches only its own formulas, so rebasing onto the new tip and retrying is
          # safe -- there is nothing for two releases to genuinely conflict over. ~keep
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto the current tap tip"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::tap rebase hit a real conflict; refusing to force the push"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "::error::could not push to the tap after 5 attempts"
          exit 1

  # ~keep Reporting gate, not a release gate. It runs unconditionally on a real tag and fails when
  # the published release is missing an expected asset, which is how a partial release becomes
  # visible. It is deliberately absent from every `if` in the release spine: the old
  # `!contains(needs.*.result, 'failure')` guard read the poisoned result of
  # `upload-php-pie-release` and skipped this job outright in v3.11.3, which is the opposite of
  # what an asset audit is for — the audit must run precisely when something went wrong.
  verify-assets:
    name: Verify release assets
    needs:
      - prepare
      - upload-cli-release
      - upload-go-release
      - upload-c-ffi-release
      - upload-elixir-release
      - upload-php-pie-release
    if: ${{ always() && needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: xberg-io/actions/verify-release-assets@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          token: ${{ steps.app-token.outputs.token }}
          expected-assets: |
            # CLI
            cli-*.tar.gz
            cli-*.zip
            # Go FFI
            html-to-markdown-rs-go-*.tar.gz
            # C FFI
            html-to-markdown-rs-ffi-*.tar.gz
            # Elixir NIF
            libhtml_to_markdown_nif-*.tar.gz
            # PHP PIE — explicit per-cell patterns so a single dropped
            # matrix cell (the recurring #333 failure) is named in the failure
            # output instead of hiding inside a wildcard. 4 PHP versions ×
            # {arm64-darwin, arm64-linux, x86_64-linux} unix + windows x86_64.
            php_html_to_markdown-*_php8.2-arm64-darwin-bsdlibc-nts.tgz
            php_html_to_markdown-*_php8.2-arm64-linux-glibc-nts.tgz
            php_html_to_markdown-*_php8.2-x86_64-linux-glibc-nts.tgz
            php_html_to_markdown-*_php8.3-arm64-darwin-bsdlibc-nts.tgz
            php_html_to_markdown-*_php8.3-arm64-linux-glibc-nts.tgz
            php_html_to_markdown-*_php8.3-x86_64-linux-glibc-nts.tgz
            php_html_to_markdown-*_php8.4-arm64-darwin-bsdlibc-nts.tgz
            php_html_to_markdown-*_php8.4-arm64-linux-glibc-nts.tgz
            php_html_to_markdown-*_php8.4-x86_64-linux-glibc-nts.tgz
            php_html_to_markdown-*_php8.5-arm64-darwin-bsdlibc-nts.tgz
            php_html_to_markdown-*_php8.5-arm64-linux-glibc-nts.tgz
            php_html_to_markdown-*_php8.5-x86_64-linux-glibc-nts.tgz
            php_html_to_markdown-*-8.2-nts-vs*-x86_64.zip
            php_html_to_markdown-*-8.3-nts-vs*-x86_64.zip
            php_html_to_markdown-*-8.4-nts-vs*-x86_64.zip
            php_html_to_markdown-*-8.5-nts-vs*-x86_64.zip

  update-swift-package-manifest:
    name: Update Swift Package.swift manifest with artifact URL and checksum
    needs: [prepare, upload-swift-release]
    if: ${{ (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.upload-swift-release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Check out release recovery tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          sparse-checkout: scripts/ci/swift/finalize_release_manifest.py
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: swift-checksum
          path: swift-checksums

      - name: Update Package.swift with version and checksum
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          CHECKSUM=$(cat swift-checksums/*.checksum | tr -d '[:space:]')

          if ! [[ "${CHECKSUM}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Expected a single sha256 checksum, got: '${CHECKSUM}'"
            exit 1
          fi
          git config user.name "xberg-dev-publisher[bot]"
          git config user.email "291994444+xberg-dev-publisher[bot]@users.noreply.github.com"
          python3 .release-tooling/scripts/ci/swift/finalize_release_manifest.py "${CHECKSUM}" "${VERSION}"

          # ~keep The count above cannot see a placeholder alef renamed. This catches that case.
          if grep -nE '__ALEF_[A-Z0-9_]+__' Package.swift; then
            echo "::error::Package.swift still contains an unsubstituted alef placeholder"
            exit 1
          fi

          echo "Updated Package.swift:"
          head -30 Package.swift

          # Commit the substituted Package.swift back to the rc tag.
          # The checksum is only known after the artifact bundle is built, but consumers
          # (test_apps) fetch the tagged tree and need the substituted manifest.
          # Force-update the tag to point at this post-substitution commit.
          #
          # This workflow is the sole writer for this tag's substituted state, so
          # `--force-with-lease` adds no safety and breaks against annotated→lightweight
          # tag conversion (the lease's expected SHA is the annotated tag object, but the
          # server compares it differently after we replace it with a lightweight tag).
          # Use plain `--force` and retry transient network failures.
          git tag -f "v${VERSION}" HEAD
          for attempt in 1 2 3; do
            if git push origin "v${VERSION}" --force; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::Failed to push tag v${VERSION} after 3 attempts"
              exit 1
            fi
            echo "Push attempt ${attempt} failed, retrying in 5s..."
            sleep 5
          done

          # Also publish the checksummed commit to a release/swift/<version> branch. The
          # alef-generated Swift e2e/test-app pins `branch: "release/swift/<version>"`, so
          # this ref must exist for SwiftPM to resolve the package with the real checksum.
          for attempt in 1 2 3; do
            if git push origin "HEAD:refs/heads/release/swift/${VERSION}" --force; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::Failed to push release/swift/${VERSION} branch after 3 attempts"
              exit 1
            fi
            echo "Branch push attempt ${attempt} failed, retrying in 5s..."
            sleep 5
          done

      - name: Update release notes with artifact URL
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          CHECKSUM=$(cat swift-checksums/*.checksum | tr -d '[:space:]')
          ASSET_URL="https://github.com/xberg-io/html-to-markdown/releases/download/v${VERSION}/HtmlToMarkdown-rs.artifactbundle.zip"

          cat > /tmp/swift-notes.md << EOF
          ## Swift Package Manager

          Add to your \`Package.swift\`:

          \`\`\`swift
          .package(url: "https://github.com/xberg-io/html-to-markdown", from: "${VERSION}")
          \`\`\`

          The Swift binding is distributed as a pre-built artifact bundle. No Rust toolchain required.

          **Artifact**: [HtmlToMarkdown-rs.artifactbundle.zip](${ASSET_URL})
          **Checksum**: \`${CHECKSUM}\`
          EOF

          gh release edit "v${VERSION}" --notes-file /tmp/swift-notes.md

  build-r-package:
    name: Build R source tarball
    needs: prepare
    if: ${{ needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          submodules: recursive

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3

      - name: Build R source tarball
        working-directory: packages/r
        run: |
          R CMD build .
          ls -la htmltomarkdown_*.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: r-source-tarball
          path: packages/r/htmltomarkdown_*.tar.gz
          if-no-files-found: error
          retention-days: 7

  upload-r-release:
    name: Upload R source tarball to GitHub Release
    needs: [prepare, validate-versions, build-r-package]
    if: ${{ (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.build-r-package.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: r-source-tarball
          path: dist/r

      - uses: xberg-io/actions/upload-release-assets@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          working-directory: dist/r
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          assets: |
            htmltomarkdown_*.tar.gz

  release-finalize:
    name: Finalize GitHub Release
    needs:
      - prepare
      - promote-release
      - verify-assets
      - crates-gate
      - publish-pypi
      - publish-rubygems
      - publish-node
      - publish-wasm
      - publish-packagist
      - publish-maven
      - publish-nuget
      - publish-hex
      - publish-homebrew-bottles
      - publish-scoop-manifest
      - publish-kotlin-android
      - trigger-pubdev
      - publish-zig
      - upload-cli-release
      - verify-binstall
      - upload-go-release
      - upload-c-ffi-release
      - upload-swift-release
      - update-swift-package-manifest
      - upload-r-release
    # ~keep Everything above `promote-release` is ordering only, so finalize still runs last. The
    # gate is the promotion output plus crates.io: if the release page exists and the crates
    # published, the release is real and must be finalized even if a language artifact is missing.
    if: |
      !cancelled() &&
      needs.prepare.outputs.is_tag == 'true' &&
      needs.prepare.outputs.dry_run != 'true' &&
      needs.promote-release.outputs.promoted == 'true' &&
      needs.crates-gate.outputs.ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: xberg-io/actions/finalize-release@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          is-prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' && 'true' || 'false' }}
          go-module-path: packages/go/v3
          token: ${{ steps.app-token.outputs.token }}

  announce-discord:
    name: Announce release on Discord
    needs:
      - prepare
      - promote-release
      - crates-gate
      - publish-pypi
      - publish-rubygems
      - publish-node
      - publish-wasm
      - publish-packagist
      - publish-maven
      - publish-nuget
      - publish-hex
      - publish-homebrew-bottles
      - publish-scoop-manifest
      - publish-kotlin-android
      - trigger-pubdev
      - publish-zig
      - upload-cli-release
      - upload-go-release
      - upload-c-ffi-release
      - upload-elixir-release
      - upload-php-pie-release
      - upload-r-release
      - release-finalize
    # ~keep Announce when the release actually shipped. `release-finalize.result` cannot be read
    # here — finalize needs verify-assets, so its result inherits any language-artifact failure —
    # so this gates on the same clean promotion output finalize does, and orders after it.
    if: |
      !cancelled() &&
      needs.prepare.outputs.is_tag == 'true' &&
      needs.prepare.outputs.dry_run != 'true' &&
      needs.prepare.outputs.is_prerelease != 'true' &&
      needs.promote-release.outputs.promoted == 'true' &&
      needs.crates-gate.outputs.ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: xberg-io/actions/announce-release-discord@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          project-name: html-to-markdown
          token: ${{ steps.app-token.outputs.token }}

  # ~keep Deliberately off-cycle and therefore deliberately without `needs:`. The proxy has
  # its own version lineage (cli-proxy/npm/package.json 0.0.1, cli-proxy/pypi/pyproject.toml
  # 0.1.0) and its own `cli-proxy-v*` tag lineage, independent of the core crate version. It
  # is gated on that tag prefix alone; a core release never runs it, and validate-versions —
  # which asserts the language manifests against the *core* version — would be meaningless
  # here and would fail every proxy release. Do not add it to `needs:`.
  cli-proxy:
    name: Publish CLI proxy package (npm)
    if: ${{ github.event_name == 'release' && startsWith(github.event.release.tag_name, 'cli-proxy-v') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/publish-npm@v1
        with:
          package-dir: cli-proxy/npm
          access: public
          provenance: "true"

  # --- Coding-agent plugin (lives in plugin/, generated by ai-rulez; see plugin/README.md) ---
  # Additive best-effort like the language jobs above: intentionally NOT part of
  # finalize-release / announce `needs`, so a plugin hiccup never blocks the core
  # release. Both publish the same content every tagged release (version tracks core), so
  # each guards against an already-published version. The plugin has no build- or
  # runtime-dependency on the core packages (mcp-launch.sh resolves the CLI at runtime), so
  # both publish in parallel with the core jobs — but they DO depend on validate-versions,
  # which owns the `plugin/.ai-rulez/config.toml [plugin].version == tag` assertion. Both
  # `if:` blocks open with `!cancelled()`, which opts out of automatic failure propagation,
  # so the `needs:` edge alone is not a gate: the explicit
  # `needs.validate-versions.result == 'success'` term below is what actually stops a
  # drifted plugin from shipping. Without it, liter-llm v1.19.0 published an npm bundle
  # carrying 1.18.4 manifests (unrecoverable — npm forbids republishing a version) while
  # the Hermes job rebuilt the 1.18.4 wheel, hit publish-pypi's skip-existing guard, and
  # reported success having published nothing for the tag. ~keep

  publish-plugin-opencode:
    name: Publish OpenCode and Pi plugin to npm
    needs: [prepare, validate-versions]
    if: >-
      ${{ !cancelled() && needs.prepare.outputs.release_any == 'true'
      && needs.prepare.outputs.is_tag == 'true'
      && needs.validate-versions.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - uses: xberg-io/actions/setup-node-workspace@v1
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
      - name: Install ai-rulez
        uses: xberg-io/actions/setup-ai-rulez@98adf87f1ed4c62a57ff56f9010d62faf42d4db6
        with:
          source-revision: 02a8bf25768d37648d4dac35f049c3671c9f7308
      - name: Verify generated plugin bundles before publishing
        run: |
          ai-rulez verify --plugin
      # ~keep validate-versions asserts the plugin *source* pin
      # (plugin/.ai-rulez/config.toml [plugin].version); it says nothing about the rendered
      # bundle this job actually uploads. plugin/package.json is regenerated from that pin
      # by ai-rulez, and its freshness is only enforced by ci-plugin.yaml, which does not
      # gate this workflow. A stale plugin/package.json breaks the guard below both ways:
      # the probe reads the *artifact's* version, so a stale-but-published version sets
      # skip=true and the job goes green having shipped nothing for the tag, while a
      # stale-but-unpublished version is permanently accepted by npm — under
      # needs.prepare.outputs.npm_tag, i.e. possibly `latest`. Assert artifact == release
      # before anything is probed or uploaded.
      - name: Assert the plugin bundle matches the release
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          actual="$(jq -r '.version' plugin/package.json)"
          # ~keep A dry run synthesizes its tag as `<version>-dryrun-<sha>`; the manifests never
          # carry that suffix, so comparing it verbatim fails on a bundle that is in fact
          # correct. Strip it rather than skipping the assertion on dry runs -- a dry run is
          # where a drifted bundle should surface, while nothing has been published.
          expected="${VERSION%%-dryrun-*}"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error::plugin/package.json declares ${actual} but the release is ${expected};" \
              "regenerate the plugin bundle (task version:sync) before tagging"
            exit 1
          fi
          echo "plugin/package.json matches the release at ${expected}"
      # Plain ESM adapter — no build step. Skip if this version is already on npm so a
      # release re-run is idempotent (publish-npm has no built-in skip-existing). ~keep
      - name: Verify packed OpenCode and Pi resources
        shell: bash
        run: |
          pack_dir="$(mktemp -d)"
          npm pack ./plugin --ignore-scripts --json --pack-destination "$pack_dir" > "$pack_dir/pack.json"
          node - "$pack_dir/pack.json" <<'NODE'
          const fs = require('node:fs');
          const pkg = require('./plugin/package.json');
          const files = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))[0].files.map(file => file.path);
          for (const prefix of ['.opencode/plugins/', '.pi/skills/', '.pi/prompts/']) {
            if (!files.some(path => path.startsWith(prefix))) throw new Error(`Missing packed resource: ${prefix}`);
          }
          if (!pkg.keywords.includes('pi-package') || !pkg.pi.skills.length || !pkg.pi.prompts.length) {
            throw new Error('Missing Pi package metadata');
          }
          for (const resource of [...pkg.pi.skills, ...pkg.pi.prompts]) {
            const relative = resource.replace(/^\.\//, '').replace(/\/$/, '');
            if (!files.some(path => path === relative || path.startsWith(`${relative}/`))) {
              throw new Error(`Declared Pi resource was not packed: ${resource}`);
            }
          }
          console.log(`Verified ${files.length} packed files for OpenCode and Pi`);
          NODE
      - name: Skip if already on npm
        id: guard
        run: |
          name="$(node -p "require('./plugin/package.json').name")"
          ver="$(node -p "require('./plugin/package.json').version")"
          if npm view "${name}@${ver}" version >/dev/null 2>&1; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            echo "::notice::${name}@${ver} already on npm; skipping"
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi
      # No NODE_AUTH_TOKEN: publish via OIDC trusted publishing (like every other
      # npm job here). The classic NPM_TOKEN lacked write access to this package
      # and returned E404; trusted publishing uses the job's id-token instead. ~keep
      - uses: xberg-io/actions/publish-npm@v1
        if: steps.guard.outputs.skip != 'true'
        with:
          package-dir: plugin
          access: public
          npm-tag: ${{ needs.prepare.outputs.npm_tag }}
          provenance: "true"
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          expected-version: ${{ needs.prepare.outputs.version }}

  publish-plugin-hermes:
    name: Publish Hermes plugin to PyPI
    needs: [prepare, validate-versions]
    if: >-
      ${{ !cancelled() && needs.prepare.outputs.release_any == 'true'
      && needs.prepare.outputs.is_tag == 'true'
      && needs.validate-versions.result == 'success' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Install ai-rulez
        uses: xberg-io/actions/setup-ai-rulez@98adf87f1ed4c62a57ff56f9010d62faf42d4db6
        with:
          source-revision: 02a8bf25768d37648d4dac35f049c3671c9f7308
      - name: Verify plugin source and generated artifacts
        uses: xberg-io/actions/verify-ai-rulez-plugin@98adf87f1ed4c62a57ff56f9010d62faf42d4db6
        with:
          config-directory: .ai-rulez
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      # ~keep Same rendered-bundle gap as the npm job, but silent: this job had no guard at
      # all, and publish-pypi's skip-existing is not one — a stale
      # plugin/.hermes/package/pyproject.toml rebuilds an already-published wheel version,
      # gets skipped, and the job reports success having shipped nothing for the tag.
      # ai-rulez renders this manifest in PEP 440 form, so the semver prerelease suffix is
      # normalised on the expected side before compare (3.8.0-rc.1 -> 3.8.0rc1,
      # 4.0.0-beta.2 -> 4.0.0b2). An unrecognised spelling fails loudly rather than
      # publishing, which is the safe direction. ~keep
      - name: Assert the plugin bundle matches the release
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          pyproject="plugin/.hermes/package/pyproject.toml"
          actual="$(awk -F"[\"']" '/^version = /{print $2; exit}' "${pyproject}")"
          # ~keep Strip the dry-run suffix BEFORE the PEP 440 respelling, not after: the
          # respelling's generic `-<word><digits>` rule would otherwise mangle `-dryrun-<sha>`
          # into something that matches nothing, failing a bundle that is in fact correct.
          expected="$(printf '%s' "${VERSION%%-dryrun-*}" \
            | sed -E 's/-alpha\.?([0-9]+)$/a\1/; s/-beta\.?([0-9]+)$/b\1/; s/-([A-Za-z]+)\.?([0-9]+)$/\1\2/')"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error::${pyproject} declares ${actual} but the release is ${expected};" \
              "regenerate the plugin bundle (task version:sync) before tagging"
            exit 1
          fi
          echo "${pyproject} matches the release at ${expected}"
      - name: Build Hermes wheel
        run: uv build --wheel --out-dir dist-hermes plugin/.hermes/package
      # publish-pypi is idempotent (skips a version already on PyPI). ~keep
      - uses: xberg-io/actions/publish-pypi@v1
        with:
          packages-dir: dist-hermes
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          expected-version: ${{ needs.prepare.outputs.pypi_version }}

  # --- Release outcome report -------------------------------------------------------------------
  # Terminal job. The spine above deliberately lets a release complete with a per-language artifact
  # missing, so something has to make that state loud. This reads the run's real job conclusions
  # from the API — not `needs.*.result`, which carries the chain-failure poison described above —
  # and writes a summary saying whether the release shipped and exactly which artifacts are absent.
  # It fails the run whenever any job failed, so a partial release is red and named rather than
  # silently green. ~keep
  release-report:
    name: Report release outcome
    needs:
      - prepare
      - validate-versions
      - crates-gate
      - check-pypi
      - check-npm
      - check-wasm
      - check-rubygems
      - check-maven
      - check-nuget
      - check-packagist
      - check-cratesio
      - check-hex
      - check-homebrew
      - check-cli
      - check-go
      - check-c-ffi
      - check-elixir-release
      - check-maven-kotlin
      - check-pub
      - check-zig
      - upload-cli-release
      - upload-go-release
      - upload-c-ffi-release
      - upload-elixir-release
      - promote-release
      - release-finalize
      - announce-discord
      - verify-assets
      - verify-binstall
      - publish-homebrew-bottles
      - publish-scoop-manifest
      - publish-packagist
      - publish-crates
      - publish-pypi
      - publish-rubygems
      - publish-node
      - publish-wasm
      - publish-maven
      - publish-nuget
      - publish-hex
      - publish-kotlin-android
      - trigger-pubdev
      - publish-zig
      - update-swift-package-manifest
      - publish-plugin-opencode
      - publish-plugin-hermes
    if: ${{ always() && needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Summarize release outcome
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PROMOTED: ${{ needs.promote-release.outputs.promoted }}
        run: |
          set -euo pipefail

          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure") | .name' >/tmp/failed-jobs.txt

          # ~keep Same correction as the gate below: PROMOTED is empty whenever promote-release
          # was skipped, which is the normal shape of a partial-target dispatch against an
          # already-published release. Read the release's actual state.
          if [ "$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft' 2>/dev/null || echo unknown)" = "false" ]; then
            shipped="**${TAG} shipped** — the GitHub release is published."
          else
            shipped="**${TAG} did NOT ship** — the release is not published (promote-release reported '${PROMOTED:-<skipped>}')."
          fi

          {
            echo "## Release outcome: ${TAG}"
            echo
            echo "${shipped}"
            echo
            if [ -s /tmp/failed-jobs.txt ]; then
              echo "### Failed jobs"
              echo
              while IFS= read -r job; do
                printf -- "- \`%s\`\n" "${job}"
              done </tmp/failed-jobs.txt
              echo
              if [ "${PROMOTED}" = "true" ]; then
                echo "The release is **incomplete**: the artifacts those jobs produce are missing"
                echo "from ${TAG}. Fix the cause and re-run this workflow — the build, upload and"
                echo "publish jobs each guard against an already-published version, so a re-run"
                echo "fills the gaps without disturbing what already shipped."
              fi
            else
              echo "All jobs succeeded."
            fi
          } >>"${GITHUB_STEP_SUMMARY}"

          if [ -s /tmp/failed-jobs.txt ]; then
            while IFS= read -r job; do
              echo "::error title=Incomplete release::${TAG}: job '${job}' failed"
            done </tmp/failed-jobs.txt
            exit 1
          fi

      # ~keep The step above only inspects jobs whose conclusion is `failure`. A publish job that
      # was SKIPPED is invisible to it, and `skipped` is exactly what a downstream job becomes
      # when an upstream gate fails — so a release that shipped a GitHub tag to zero registries
      # reported green (tree-sitter-language-pack v1.15.5, 40+ failures, every publish skipped).
      # Judge each target on its own result and treat `skipped` as a failure unless one of the two
      # legitimate reasons applies: the target is not enabled for this release, or its registry
      # probe already found this exact version published and no republish was forced.
      - name: Verify every enabled publish target succeeded
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          FORCE_REPUBLISH: ${{ needs.prepare.outputs.force_republish }}
          RESULT_PREPARE: ${{ needs.prepare.result }}
          RESULT_VALIDATE: ${{ needs.validate-versions.result }}
          RESULT_CRATES_GATE: ${{ needs.crates-gate.outputs.ok }}
          RESULT_PROMOTE: ${{ needs.promote-release.outputs.promoted }}
          RESULT_FINALIZE: ${{ needs.release-finalize.result }}
          RESULT_PUBLISH_CRATES: ${{ needs.publish-crates.result }}
          RESULT_PUBLISH_PYPI: ${{ needs.publish-pypi.result }}
          RESULT_PUBLISH_RUBYGEMS: ${{ needs.publish-rubygems.result }}
          RESULT_PUBLISH_NODE: ${{ needs.publish-node.result }}
          RESULT_PUBLISH_WASM: ${{ needs.publish-wasm.result }}
          RESULT_PUBLISH_PACKAGIST: ${{ needs.publish-packagist.result }}
          RESULT_PUBLISH_MAVEN: ${{ needs.publish-maven.result }}
          RESULT_PUBLISH_NUGET: ${{ needs.publish-nuget.result }}
          RESULT_PUBLISH_HEX: ${{ needs.publish-hex.result }}
          RESULT_PUBLISH_KOTLIN: ${{ needs.publish-kotlin-android.result }}
          RESULT_TRIGGER_PUBDEV: ${{ needs.trigger-pubdev.result }}
          RESULT_PUBLISH_ZIG: ${{ needs.publish-zig.result }}
          RESULT_PUBLISH_HOMEBREW: ${{ needs.publish-homebrew-bottles.result }}
          RESULT_PUBLISH_SCOOP: ${{ needs.publish-scoop-manifest.result }}
          RESULT_UPLOAD_CLI: ${{ needs.upload-cli-release.result }}
          RESULT_VERIFY_BINSTALL: ${{ needs.verify-binstall.result }}
          RESULT_UPLOAD_GO: ${{ needs.upload-go-release.result }}
          RESULT_UPLOAD_C_FFI: ${{ needs.upload-c-ffi-release.result }}
          RESULT_UPLOAD_ELIXIR: ${{ needs.upload-elixir-release.result }}
          RESULT_SWIFT_MANIFEST: ${{ needs.update-swift-package-manifest.result }}
          RELEASE_CRATES: ${{ needs.prepare.outputs.release_crates }}
          RELEASE_PYTHON: ${{ needs.prepare.outputs.release_python }}
          RELEASE_RUBY: ${{ needs.prepare.outputs.release_ruby }}
          RELEASE_NODE: ${{ needs.prepare.outputs.release_node }}
          RELEASE_WASM: ${{ needs.prepare.outputs.release_wasm }}
          RELEASE_PHP: ${{ needs.prepare.outputs.release_php }}
          RELEASE_JAVA: ${{ needs.prepare.outputs.release_java }}
          RELEASE_CSHARP: ${{ needs.prepare.outputs.release_csharp }}
          RELEASE_ELIXIR: ${{ needs.prepare.outputs.release_elixir }}
          RELEASE_KOTLIN: ${{ needs.prepare.outputs.release_kotlin }}
          RELEASE_DART: ${{ needs.prepare.outputs.release_dart }}
          RELEASE_ZIG: ${{ needs.prepare.outputs.release_zig }}
          RELEASE_HOMEBREW: ${{ needs.prepare.outputs.release_homebrew }}
          RELEASE_SCOOP: ${{ needs.prepare.outputs.release_scoop }}
          RELEASE_CLI: ${{ needs.prepare.outputs.release_cli }}
          RELEASE_GO: ${{ needs.prepare.outputs.release_go }}
          RELEASE_C_FFI: ${{ needs.prepare.outputs.release_c_ffi }}
          RELEASE_SWIFT: ${{ needs.prepare.outputs.release_swift }}
          EXISTS_CRATES: ${{ needs.check-cratesio.outputs.all_exist }}
          EXISTS_PYPI: ${{ needs.check-pypi.outputs.exists }}
          EXISTS_RUBYGEMS: ${{ needs.check-rubygems.outputs.exists }}
          EXISTS_NPM: ${{ needs.check-npm.outputs.node_exists }}
          EXISTS_WASM: ${{ needs.check-wasm.outputs.exists }}
          EXISTS_PACKAGIST: ${{ needs.check-packagist.outputs.exists }}
          EXISTS_MAVEN: ${{ needs.check-maven.outputs.exists }}
          EXISTS_NUGET: ${{ needs.check-nuget.outputs.exists }}
          EXISTS_HEX: ${{ needs.check-hex.outputs.exists }}
          EXISTS_KOTLIN: ${{ needs.check-maven-kotlin.outputs.exists }}
          EXISTS_PUB: ${{ needs.check-pub.outputs.exists }}
          EXISTS_ZIG: ${{ needs.check-zig.outputs.exists }}
          EXISTS_HOMEBREW: ${{ needs.check-homebrew.outputs.exists }}
          EXISTS_CLI: ${{ needs.check-cli.outputs.exists }}
          EXISTS_GO: ${{ needs.check-go.outputs.exists }}
          EXISTS_C_FFI: ${{ needs.check-c-ffi.outputs.exists }}
          EXISTS_ELIXIR: ${{ needs.check-elixir-release.outputs.exists }}
        run: |
          set -uo pipefail
          failed=0

          require_success() {
            local name="$1" result="$2"
            if [[ "${result}" != "success" ]]; then
              echo "::error title=Incomplete release::Required release job '${name}' finished with '${result}' — ${TAG} did not ship."
              failed=1
              return
            fi
            echo "  - ${name}: ok"
          }

          # A target may legitimately not run for exactly two reasons. Anything else that is
          # not `success` — skipped, cancelled, failure — means the registry got nothing.
          require_publish() {
            local name="$1" result="$2" enabled="$3" already="${4:-}"

            if [[ "${enabled}" != "true" ]]; then
              echo "  - ${name}: not enabled for this release"
              return
            fi
            if [[ "${already}" == "true" && "${FORCE_REPUBLISH}" != "true" ]]; then
              echo "  - ${name}: already published at this version (correctly skipped)"
              return
            fi
            if [[ "${result}" != "success" ]]; then
              echo "::error title=Incomplete release::Publish target '${name}' is enabled and not yet published, but its job finished with '${result}' — refusing to report ${TAG} as a successful release."
              failed=1
              return
            fi
            echo "  - ${name}: published"
          }

          require_success "prepare" "${RESULT_PREPARE}"
          require_success "validate-versions" "${RESULT_VALIDATE}"

          if [[ "${RESULT_CRATES_GATE}" != "true" ]]; then
            echo "::error title=Incomplete release::crates-gate refused to release: the crates.io prerequisite for ${TAG} was never satisfied."
            failed=1
          fi
          # ~keep `promote-release.outputs.promoted` reports only whether THIS run flipped the
          # draft bit. On a partial-target dispatch promote-release is skipped and the output is
          # empty, so asserting on it declared "${TAG} was never promoted out of draft" about a
          # release that was in fact public with all 61 of its assets (run 33498311069, v3.12.0).
          # Ask the release what it IS, not the job what it did; the job result is kept in the
          # message because a genuine promote failure is still worth naming.
          release_is_draft="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft' 2>/dev/null || echo unknown)"
          if [[ "${release_is_draft}" != "false" ]]; then
            echo "::error title=Incomplete release::${TAG} is not a published release (isDraft=${release_is_draft}; promote-release reported '${RESULT_PROMOTE:-<skipped>}')."
            failed=1
          fi
          if [[ "${RESULT_FINALIZE}" != "success" && "${release_is_draft}" != "false" ]]; then
            echo "::error title=Incomplete release::Required release job 'release-finalize' finished with '${RESULT_FINALIZE}' and ${TAG} is not public."
            failed=1
          else
            echo "  - release-finalize: release is public"
          fi

          require_publish "crates.io" "${RESULT_PUBLISH_CRATES}" "${RELEASE_CRATES}" "${EXISTS_CRATES}"
          require_publish "pypi" "${RESULT_PUBLISH_PYPI}" "${RELEASE_PYTHON}" "${EXISTS_PYPI}"
          require_publish "rubygems" "${RESULT_PUBLISH_RUBYGEMS}" "${RELEASE_RUBY}" "${EXISTS_RUBYGEMS}"
          require_publish "npm" "${RESULT_PUBLISH_NODE}" "${RELEASE_NODE}" "${EXISTS_NPM}"
          require_publish "npm-wasm" "${RESULT_PUBLISH_WASM}" "${RELEASE_WASM}" "${EXISTS_WASM}"
          require_publish "packagist" "${RESULT_PUBLISH_PACKAGIST}" "${RELEASE_PHP}" "${EXISTS_PACKAGIST}"
          require_publish "maven" "${RESULT_PUBLISH_MAVEN}" "${RELEASE_JAVA}" "${EXISTS_MAVEN}"
          require_publish "nuget" "${RESULT_PUBLISH_NUGET}" "${RELEASE_CSHARP}" "${EXISTS_NUGET}"
          require_publish "hex" "${RESULT_PUBLISH_HEX}" "${RELEASE_ELIXIR}" "${EXISTS_HEX}"
          require_publish "maven-kotlin-android" "${RESULT_PUBLISH_KOTLIN}" "${RELEASE_KOTLIN}" "${EXISTS_KOTLIN}"
          require_publish "pub.dev" "${RESULT_TRIGGER_PUBDEV}" "${RELEASE_DART}" "${EXISTS_PUB}"
          require_publish "zig" "${RESULT_PUBLISH_ZIG}" "${RELEASE_ZIG}" "${EXISTS_ZIG}"
          require_publish "homebrew" "${RESULT_PUBLISH_HOMEBREW}" "${RELEASE_HOMEBREW}" "${EXISTS_HOMEBREW}"
          scoop_already=false
          if [[ "${RELEASE_SCOOP}" == "true" && "${RESULT_PUBLISH_SCOOP}" != "success" && "${FORCE_REPUBLISH}" != "true" ]]; then
            scoop_version="$(gh api 'repos/xberg-io/scoop-bucket/contents/bucket/html-to-markdown.json?ref=main' --jq '.content' 2>/dev/null | base64 --decode | jq -r '.version' 2>/dev/null || true)"
            if [[ "${scoop_version}" == "${VERSION}" ]]; then
              scoop_already=true
            fi
          fi
          require_publish "scoop" "${RESULT_PUBLISH_SCOOP}" "${RELEASE_SCOOP}" "${scoop_already}"

          # Release assets consumers resolve at install time.
          require_publish "cli-binaries" "${RESULT_UPLOAD_CLI}" "${RELEASE_CLI}" "${EXISTS_CLI}"
          require_publish "binstall-verify" "${RESULT_VERIFY_BINSTALL}" "${RELEASE_CLI}" "${EXISTS_CLI}"
          require_publish "go-ffi-assets" "${RESULT_UPLOAD_GO}" "${RELEASE_GO}" "${EXISTS_GO}"
          require_publish "c-ffi-assets" "${RESULT_UPLOAD_C_FFI}" "${RELEASE_C_FFI}" "${EXISTS_C_FFI}"
          require_publish "elixir-nif-assets" "${RESULT_UPLOAD_ELIXIR}" "${RELEASE_ELIXIR}" "${EXISTS_ELIXIR}"
          require_publish "swift-manifest" "${RESULT_SWIFT_MANIFEST}" "${RELEASE_SWIFT}"

          if [[ "${failed}" -eq 1 ]]; then
            echo "::error title=Incomplete release::Release ${TAG} did not reach every enabled target. See the errors above."
            exit 1
          fi
          echo "Every enabled publish target for ${TAG} succeeded."

  publish-plugin-artifacts:
    name: Publish all plugin runtime artifacts
    permissions:
      contents: write
    needs: [prepare, release-finalize]
    if: ${{ !cancelled() && needs.prepare.outputs.dry_run != 'true' && needs.release-finalize.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
      - name: Install ai-rulez
        uses: xberg-io/actions/setup-ai-rulez@98adf87f1ed4c62a57ff56f9010d62faf42d4db6
        with:
          source-revision: 02a8bf25768d37648d4dac35f049c3671c9f7308
      - name: Verify public skill exports
        run: python3 scripts/sync_public_skills.py --check
      - name: Package all supported plugin runtimes
        uses: xberg-io/actions/package-ai-rulez-plugin@98adf87f1ed4c62a57ff56f9010d62faf42d4db6
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          config-directory: .ai-rulez
          version-sync-script: scripts/sync_plugin_version.py
      - name: Archive verified runtime bundles and marketplace indexes
        shell: bash
        env:
          PLUGIN_TAG: ${{ needs.prepare.outputs.tag }}
          PLUGIN_PRODUCT: html-to-markdown
        run: |
          set -euo pipefail
          test -n "$PLUGIN_TAG"
          bundle="dist/${PLUGIN_PRODUCT}-plugins-${PLUGIN_TAG//\//-}.tar.gz"
          tar --sort=name --mtime="@$(git show -s --format=%ct HEAD)" \
            --owner=0 --group=0 --numeric-owner -cf - -C dist/plugin . | gzip -n > "$bundle"
          (cd dist && sha256sum "$(basename "$bundle")") > "$bundle.sha256"
      - name: Attach verified plugin archive and metadata
        uses: xberg-io/actions/upload-release-assets@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          assets: |
            dist/*-plugins-*.tar.gz
            dist/*-plugins-*.tar.gz.sha256
