name: CI E2E delegated jobs

on:
  workflow_call:
    inputs:
      task:
        required: true
        type: string
      os:
        required: false
        type: string
      java:
        required: false
        type: string
      runner:
        required: false
        type: string
      ruby:
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  BUILD_PROFILE: "ci"
  GO_VERSION: "1.26.0"
  GO_TOOLCHAIN: "go1.26.0"
  GOLANGCI_LINT_VERSION: "latest"

permissions:
  contents: read

jobs:
  build-ffi:
    name: "Build: FFI (${{ inputs.runner }})"
    if: inputs.task == 'build-ffi'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - { "name": "Checkout", "uses": "actions/checkout@v7", "id": "checkout" }
      - {
          "name": "Free disk space",
          "if": "startsWith(inputs.runner, 'ubuntu')",
          "uses": "xberg-io/actions/free-disk-space-linux@v1",
          "with": { "show-initial": "false", "show-final": "true" },
        }
      - {
          "name": "Setup Rust",
          "uses": "xberg-io/actions/setup-rust@v1",
          "with": { "cache-key-prefix": "ffi-${{ inputs.runner }}", "use-sccache": false },
        }
      - {
          "name": "Build html-to-markdown-ffi (release, Unix)",
          "if": "!startsWith(inputs.runner, 'windows')",
          "run": "cargo build --release --locked -p html-to-markdown-ffi",
          "shell": "bash",
          "env": {
            "CARGO_TERM_COLOR": "always",
            "CARGO_INCREMENTAL": "0",
            "RUST_BACKTRACE": "short",
            "ALEF_EXPORT_GENERATED_HEADERS": "1",
          },
        }
      - {
          "name": "Build html-to-markdown-ffi (debug, Windows)",
          "if": "startsWith(inputs.runner, 'windows')",
          "run": "cargo build --locked -p html-to-markdown-ffi",
          "shell": "bash",
          "env": { "CARGO_TERM_COLOR": "always", "ALEF_EXPORT_GENERATED_HEADERS": "1" },
        }
      # ~keep `test -f` alone only proves build.rs wrote *a* header — it says
      # nothing about whether the freshly-generated header matches the one
      # committed to git, so a stale checked-in header could never fail this
      # step. Diff against git to actually assert freshness. build.rs rewrites both
      # header copies only when ALEF_EXPORT_GENERATED_HEADERS is set, so every build
      # this check follows sets it; without it the diff compares each header with itself.
      - name: Verify header is fresh
        shell: bash
        run: |
          HEADER="crates/html-to-markdown-ffi/include/html_to_markdown.h"
          GO_HEADER="packages/go/include/html_to_markdown.h"
          for file in "$HEADER" "$GO_HEADER"; do
            test -f "$file" || {
              echo "::error::$file is missing after the build. Run 'ALEF_EXPORT_GENERATED_HEADERS=1 cargo build -p html-to-markdown-ffi' and commit the result."
              exit 1
            }
          done
          git diff --exit-code -- "$HEADER" "$GO_HEADER" || {
            echo "::error::$HEADER or $GO_HEADER is stale: cbindgen regenerated a different header than the one committed. Run 'ALEF_EXPORT_GENERATED_HEADERS=1 cargo build -p html-to-markdown-ffi' and commit the result."
            exit 1
          }
          echo "Headers verified fresh: $HEADER $GO_HEADER"
      - name: Upload FFI artifacts
        if: "!startsWith(inputs.runner, 'windows')"
        uses: actions/upload-artifact@v7
        with:
          name: ffi-${{ inputs.runner }}
          path: |
            target/release/libhtml_to_markdown_ffi.*
            target/release/html_to_markdown_ffi.*
            crates/html-to-markdown-ffi/include/html_to_markdown.h
          retention-days: 7
          if-no-files-found: warn
      - {
          "name": "Cleanup Rust cache",
          "if": "always() && steps.checkout.outcome == 'success'",
          "uses": "xberg-io/actions/cleanup-rust-cache@v1",
        }
  test-ruby:
    name: "Test: Ruby (${{ inputs.os }}, ruby-${{ inputs.ruby }})"
    if: inputs.task == 'test-ruby'
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    steps:
      - { "name": "Checkout", "uses": "actions/checkout@v7" }
      - { "name": "Setup Rust", "uses": "xberg-io/actions/setup-rust@v1" }
      - {
          "name": "Setup Ruby (Unix)",
          "if": "runner.os != 'Windows'",
          "uses": "ruby/setup-ruby@v1",
          "with": {
            "ruby-version": "${{ inputs.ruby }}",
            "bundler": "4.0.3",
            "bundler-cache": false,
            "working-directory": "packages/ruby",
          },
        }
      - {
          "name": "Setup Ruby (Windows)",
          "if": "runner.os == 'Windows'",
          "uses": "ruby/setup-ruby@v1",
          "with": {
            "ruby-version": "${{ inputs.ruby }}",
            "bundler": "4.0.3",
            "bundler-cache": false,
            "working-directory": "packages/ruby",
            "windows-toolchain": "UCRT64",
          },
        }
      - {
          "name": "Build CLI binary",
          "uses": "xberg-io/actions/build-rust-cli@v1",
          "with": { "package-name": "html-to-markdown-cli", "binary-name": "html-to-markdown" },
        }
      - name: Build Ruby extension
        uses: xberg-io/actions/build-ruby-gem@v1
        with:
          # Non-release e2e CI builds the gem against the local workspace path-dep;
          # skip the registry rewrite that hard-fails until core is on crates.io. ~keep
          rewrite-native-deps: "false"
      - {
          "name": "Run Rubocop (Ubuntu/ruby-3.3 only)",
          "if": "runner.os != 'Windows' && inputs.os == 'ubuntu-latest' && inputs.ruby == '3.3'",
          "run": "./scripts/ci/ruby/run-rubocop.sh",
          "shell": "bash",
        }
      - {
          "name": "Validate RBS signatures (Ubuntu/ruby-3.3 only)",
          "if": "runner.os != 'Windows' && inputs.os == 'ubuntu-latest' && inputs.ruby == '3.3'",
          "run": "./scripts/ci/ruby/run-rbs-validate.sh",
          "shell": "bash",
        }
      - {
          "name": "Run Steep type checking (Ubuntu/ruby-3.3 only)",
          "if": "runner.os != 'Windows' && inputs.os == 'ubuntu-latest' && inputs.ruby == '3.3'",
          "working-directory": "packages/ruby",
          "run": "../../scripts/ci/ruby/run-steep.sh",
          "shell": "bash",
        }
      - {
          "name": "Run Ruby specs (Unix)",
          "if": "runner.os != 'Windows'",
          "working-directory": "packages/ruby",
          "run": "../../scripts/ci/ruby/run-rspec-unix.sh",
          "shell": "bash",
        }
      - {
          "name": "Run Ruby specs (Windows)",
          "if": "runner.os == 'Windows'",
          "working-directory": "packages/ruby",
          "shell": "pwsh",
          "run": "../../scripts/ci/ruby/run-rspec-windows.ps1",
        }
      - { "name": "Install Task", "if": "runner.os != 'Windows'", "uses": "xberg-io/actions/install-task@v1" }
      - { "name": "Install alef", "if": "runner.os != 'Windows'", "uses": "xberg-io/actions/install-alef@v1" }
      - {
          "name": "Run E2E tests (Unix only)",
          "if": "runner.os != 'Windows'",
          "run": "alef test --e2e --lang ruby",
          "shell": "bash",
        }
  build-java:
    name: "Build: Java (${{ inputs.os }})"
    if: inputs.task == 'build-java'
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    steps:
      - { "name": "Checkout", "uses": "actions/checkout@v7", "id": "checkout" }
      - {
          "name": "Setup Rust",
          "uses": "xberg-io/actions/setup-rust@v1",
          "with": { "cache-key-prefix": "java-${{ inputs.os }}" },
        }
      - {
          "name": "Test Java Panama FFI bindings",
          "uses": "xberg-io/actions/test-java-ffi@v1",
          "with": {
            "ffi-crate-name": "html-to-markdown-ffi",
            "ffi-lib-name": "html_to_markdown_ffi",
            "java-version": "${{ inputs.java }}",
          },
        }
      - {
          "name": "Cleanup Rust cache",
          "if": "always() && steps.checkout.outcome == 'success'",
          "uses": "xberg-io/actions/cleanup-rust-cache@v1",
        }
  e2e-freshness:
    name: "Verify: e2e freshness"
    if: inputs.task == 'e2e-freshness'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - { "name": "Checkout", "uses": "actions/checkout@v7" }
      - {
          "name": "Setup Rust",
          "uses": "xberg-io/actions/setup-rust@v1",
          "with": { "cache-key-prefix": "e2e-freshness" },
        }
      # ~keep alef formats the Elixir suite with `mix format` during generation. Without mix on
      # PATH it degrades to a WARN and emits unformatted output, which the drift check below then
      # reports as staleness that has nothing to do with fixtures/ — the whole job failed on
      # e2e/elixir/**.exs for that reason alone. Only the formatter is needed here, so no hex,
      # rebar or dependency install. Every other language's formatter is already on the runner
      # image or installed by the steps below.
      - {
          "name": "Setup Elixir",
          "uses": "erlef/setup-beam@v1",
          "with": { "elixir-version": "1.19", "otp-version": "28.1" },
        }
      - { "name": "Install Task", "uses": "xberg-io/actions/install-task@v1" }
      - { "name": "Install alef", "uses": "xberg-io/actions/install-alef@v1" }
      # ~keep Alef runs Dart's formatter during generation; without it the freshness check reports formatting drift.
      - { "name": "Setup Dart", "uses": "dart-lang/setup-dart@v1" }
      # ~keep Alef delegates C# formatting to Poly's clang-format adapter. Ubuntu's clang-format
      # 18 leaves nullable switch assertions unformatted; pin the generator's local formatter
      # version so freshness compares fixture changes rather than formatter-version differences.
      - {
          "name": "Setup generation formatter",
          "uses": "xberg-io/actions/setup-c-cpp-tools@v1",
          "with": { "clang-format-version": "23.1.0", "install-cppcheck": "false", "install-shellcheck": "false" },
        }
      # ~keep `alef e2e generate` formats every suite it emits by shelling out to poly. With
      # poly absent this job failed all 16 languages with "poly not found on PATH" before the
      # drift check below ever ran, so the gate could not report on the drift it exists to catch.
      - { "name": "Install poly", "uses": "Goldziher/poly@v0" }
      # ~keep Alef runs `dart format` on the generated suite; omitting Dart makes freshness
      # compare unformatted output with committed formatted files.
      - { "name": "Setup Dart", "uses": "dart-lang/setup-dart@v1" }
      - { "name": "Regenerate e2e suites", "run": "task e2e:generate", "shell": "bash" }
      - name: Fail if generated e2e/ drifted from committed output
        # ~keep `git diff` reports only tracked paths, so a regeneration that ADDS a new suite
        # left the gate at exit 0 — it could not fail on the defect it exists to catch. Use
        # `git status --porcelain -uall`, which reports additions, modifications and deletions.
        run: |
          drift="$(git status --porcelain --untracked-files=all -- e2e/)"
          if [ -n "$drift" ]; then
            echo "::error::e2e/ is stale — regenerating from fixtures/ changed the tree. Run 'task e2e:generate' and commit the result."
            printf '%s\n' "$drift"
            git diff -- e2e/
            exit 1
          fi
        shell: bash
  # ~keep The FFI crate is the shared cross-compile base for the C, Go, Java, and
  # C# publish legs, all of which build it for macos-15-intel (darwin x64) and
  # windows-11-arm (windows arm64) too. Those two targets were previously only
  # ever compiled at publish time — cover them here so a cross-compile break
  # surfaces on the commit that causes it, not at tag time.
  build-node-linux-arm64-gnu:
    name: "Build: Node (aarch64-unknown-linux-gnu, napi-cross)"
    if: inputs.task == 'build-node-linux-arm64-gnu'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - { "name": "Checkout", "uses": "actions/checkout@v7", "id": "checkout" }
      - {
          "name": "Setup Rust",
          "uses": "xberg-io/actions/setup-rust@v1",
          "with": { "target": "aarch64-unknown-linux-gnu", "cache-key-prefix": "node-linux-arm64-gnu" },
        }
      - {
          "name": "Setup Node.js workspace",
          "uses": "xberg-io/actions/setup-node-workspace@v1",
          "with": { "node-version": "24" },
        }
      - {
          "name": "Build native module (napi-cross, docker toolchain)",
          "uses": "xberg-io/actions/build-node-napi@v1",
          # ~keep The action recreates npm/ after deleting it. pnpm 12 otherwise rejects the
          # temporarily missing workspace importers before napi can recreate them.
          "env": { "PNPM_CONFIG_FROZEN_LOCKFILE": "false" },
          "with": {
            "crate-dir": "crates/html-to-markdown-node",
            "target": "aarch64-unknown-linux-gnu",
            "use-napi-cross": true,
            "install-deps": "false",
          },
        }
      - name: Verify the platform package holds a native module
        shell: bash
        working-directory: crates/html-to-markdown-node
        run: |
          set -euo pipefail
          node_file=$(find npm -maxdepth 2 -name "*.node" -type f | head -1)
          if [ -z "${node_file}" ]; then
            echo "::error::No .node file found under npm/ for aarch64-unknown-linux-gnu"
            find npm -maxdepth 2 -type f
            exit 1
          fi
          file "${node_file}"
          echo "Verified: $(basename "$(dirname "${node_file}")") contains $(basename "${node_file}")"
      - {
          "name": "Cleanup Rust cache",
          "if": "always() && steps.checkout.outcome == 'success'",
          "uses": "xberg-io/actions/cleanup-rust-cache@v1",
        }
  build-wasm:
    name: "Build: WASM"
    if: inputs.task == 'build-wasm'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - { "name": "Checkout", "uses": "actions/checkout@v7", "id": "checkout" }
      - {
          "name": "Setup Rust",
          "uses": "xberg-io/actions/setup-rust@v1",
          "with": { "target": "wasm32-unknown-unknown", "use-sccache": false, "cache-key-prefix": "wasm" },
        }
      - { "name": "Ensure wasm target installed", "run": "scripts/common/ensure-wasm-target.sh", "shell": "bash" }
      - { "name": "Install wasm-pack", "run": "scripts/common/install-wasm-pack.sh", "shell": "bash" }
      - { "name": "Setup Node workspace", "uses": "xberg-io/actions/setup-node-workspace@v1" }
      - {
          "name": "Build WASM (all targets)",
          "uses": "xberg-io/actions/build-wasm-package@v1",
          "with": { "crate-dir": "crates/html-to-markdown-wasm" },
        }
      - {
          "name": "Cleanup Rust cache",
          "if": "always() && steps.checkout.outcome == 'success'",
          "uses": "xberg-io/actions/cleanup-rust-cache@v1",
        }
  test-php:
    name: "Test: PHP"
    if: inputs.task == 'test-php'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - { "name": "Checkout", "uses": "actions/checkout@v7" }
      - {
          "name": "Setup PHP",
          "uses": "shivammathur/setup-php@v2",
          "with": {
            "php-version": "8.4",
            "extensions": "ctype, dom, json, libxml, mbstring, tokenizer, xml, xmlwriter",
            "tools": "composer:2.9.8",
            "coverage": "none",
          },
        }
      - { "name": "Setup Rust", "uses": "xberg-io/actions/setup-rust@v1" }
      - { "name": "Capture php-config path", "run": "scripts/ci/php/set-php-config.sh", "shell": "bash" }
      - {
          "name": "Install root Composer dependencies",
          "uses": "ramsey/composer-install@v4",
          "with": { "dependency-versions": "locked" },
          "env": { "COMPOSER_AUTH": "{\"github-oauth\":{\"github.com\":\"${{ secrets.GITHUB_TOKEN }}\"}}" },
        }
      - name: Build PHP extension
        id: build-php-extension
        uses: xberg-io/actions/build-php-extension@v1
        with:
          # Keep unreleased core dependencies in the local workspace with its committed lockfile. ~keep
          rewrite-native-deps: "false"
          crate-name: html-to-markdown-php
          lib-name: html_to_markdown_php
      - {
          "name": "Run PHP tests",
          "run": "scripts/ci/php/run-php-tests.sh",
          "shell": "bash",
          "env": { "EXTENSION_PATH": "${{ steps.build-php-extension.outputs.extension-path }}" },
        }
      - { "name": "Install Task", "uses": "xberg-io/actions/install-task@v1" }
      - { "name": "Install alef", "uses": "xberg-io/actions/install-alef@v1" }
      - {
          "name": "Run E2E tests",
          "run": "alef test --e2e --lang php",
          "shell": "bash",
          "env": { "EXTENSION_PATH": "${{ steps.build-php-extension.outputs.extension-path }}" },
        }
  test-go:
    name: "Test: Go"
    if: inputs.task == 'test-go'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - { "name": "Checkout", "uses": "actions/checkout@v7" }
      - { "name": "Setup Rust", "uses": "xberg-io/actions/setup-rust@v1" }
      - {
          "name": "Setup Go",
          "uses": "actions/setup-go@v7",
          "with": { "go-version": "${{ env.GO_VERSION }}", "check-latest": true },
        }
      - {
          "name": "Build FFI library",
          "run": "cargo build --release --locked -p html-to-markdown-ffi",
          "shell": "bash",
        }
      - {
          "name": "Detect Go modules",
          "id": "set-modules",
          "shell": "bash",
          "run": "scripts/ci/go/detect-go-modules.sh",
        }
      - {
          "name": "Install golangci-lint",
          "if": "steps.set-modules.outputs.modules != '[]'",
          "env": { "GOTOOLCHAIN": "${{ env.GO_TOOLCHAIN }}" },
          "run": "scripts/ci/go/install-golangci-lint.sh",
          "shell": "bash",
        }
      - name: Run golangci-lint (all modules)
        if: steps.set-modules.outputs.modules != '[]'
        shell: bash
        run: |
          for module in $(echo '${{ steps.set-modules.outputs.modules }}' | jq -r '.[]'); do
            echo "=== Linting $module ==="
            (cd "$module" && "${{ github.workspace }}/scripts/ci/go/run-golangci-lint.sh")
          done
      - { "name": "Install Task", "uses": "xberg-io/actions/install-task@v1" }
      - { "name": "Install alef", "uses": "xberg-io/actions/install-alef@v1" }
      - { "name": "Run E2E tests", "run": "alef test --e2e --lang go", "shell": "bash" }
  test-elixir:
    name: "Test: Elixir"
    if: inputs.task == 'test-elixir'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - { "name": "Checkout", "uses": "actions/checkout@v7" }
      - {
          "name": "Setup Elixir",
          "uses": "erlef/setup-beam@v1",
          "with": { "elixir-version": "1.19", "otp-version": "28.1" },
        }
      - { "name": "Setup Rust", "uses": "xberg-io/actions/setup-rust@v1" }
      - { "name": "Install Hex/Rebar", "run": "scripts/ci/elixir/install-hex-rebar.sh", "shell": "bash" }
      - {
          "name": "Install dependencies",
          "working-directory": "packages/elixir",
          "run": "../../scripts/ci/elixir/install-deps.sh",
          "shell": "bash",
        }
      - {
          "name": "Run tests",
          "working-directory": "packages/elixir",
          "run": "../../scripts/ci/elixir/run-tests.sh",
          "shell": "bash",
        }
      - {
          "name": "Credo lint",
          "working-directory": "packages/elixir",
          "run": "../../scripts/ci/elixir/run-credo.sh",
          "shell": "bash",
        }
      - { "name": "Install Task", "uses": "xberg-io/actions/install-task@v1" }
      - { "name": "Install alef", "uses": "xberg-io/actions/install-alef@v1" }
      - { "name": "Run E2E tests", "run": "alef test --e2e --lang elixir", "shell": "bash" }
  test-r:
    name: "Test: R"
    if: inputs.task == 'test-r'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - { "name": "Checkout", "uses": "actions/checkout@v7" }
      - {
          "name": "Setup R",
          "uses": "xberg-io/actions/setup-r@v1",
          "with": { "install-deps-script": "scripts/ci/r/install-deps.sh" },
        }
      - { "name": "Setup Rust", "uses": "xberg-io/actions/setup-rust@v1" }
      - {
          "name": "Run tests",
          "working-directory": "packages/r",
          "run": "../../scripts/ci/r/run-tests.sh",
          "shell": "bash",
        }
      - {
          "name": "Run lintr",
          "working-directory": "packages/r",
          "run": "../../scripts/ci/r/run-lintr.sh",
          "shell": "bash",
        }
      - { "name": "Install Task", "uses": "xberg-io/actions/install-task@v1" }
      - { "name": "Verify R reference pages are fresh", "run": "task r:docs:verify", "shell": "bash" }
      - { "name": "Install alef", "uses": "xberg-io/actions/install-alef@v1" }
      - { "name": "Run E2E tests", "run": "alef test --e2e --lang r", "shell": "bash" }
  test-c-ffi-windows:
    name: "Test: C FFI (windows-latest)"
    if: inputs.task == 'test-c-ffi-windows'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - { "name": "Checkout", "uses": "actions/checkout@v7" }
      - {
          "name": "Setup Rust",
          "uses": "xberg-io/actions/setup-rust@v1",
          "with": { "cache-key-prefix": "c-ffi-windows", "use-sccache": false },
        }
      - {
          "name": "Build html-to-markdown-ffi",
          "shell": "bash",
          "run": "cargo build --locked -p html-to-markdown-ffi",
          "env": { "ALEF_EXPORT_GENERATED_HEADERS": "1" },
        }
      - name: Verify header is fresh
        shell: bash
        run: |
          HEADER="crates/html-to-markdown-ffi/include/html_to_markdown.h"
          GO_HEADER="packages/go/include/html_to_markdown.h"
          for file in "$HEADER" "$GO_HEADER"; do
            test -f "$file" || {
              echo "::error::$file is missing after the build. Run 'ALEF_EXPORT_GENERATED_HEADERS=1 cargo build -p html-to-markdown-ffi' and commit the result."
              exit 1
            }
          done
          git diff --exit-code -- "$HEADER" "$GO_HEADER" || {
            echo "::error::$HEADER or $GO_HEADER is stale: cbindgen regenerated a different header than the one committed. Run 'ALEF_EXPORT_GENERATED_HEADERS=1 cargo build -p html-to-markdown-ffi' and commit the result."
            exit 1
          }
          echo "Headers verified fresh on Windows: $HEADER $GO_HEADER"
  test-wasm:
    name: "Test: WASM"
    if: inputs.task == 'test-wasm'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - { "name": "Checkout", "uses": "actions/checkout@v7" }
      - {
          "name": "Setup Rust",
          "uses": "xberg-io/actions/setup-rust@v1",
          "with": { "target": "wasm32-unknown-unknown", "use-sccache": false },
        }
      - { "name": "Ensure wasm target installed", "run": "scripts/common/ensure-wasm-target.sh", "shell": "bash" }
      - { "name": "Install wasm-pack", "run": "scripts/common/install-wasm-pack.sh", "shell": "bash" }
      - { "name": "Setup Node workspace", "uses": "xberg-io/actions/setup-node-workspace@v1" }
      - {
          "name": "Build WASM (all targets)",
          "uses": "xberg-io/actions/build-wasm-package@v1",
          "with": { "crate-dir": "crates/html-to-markdown-wasm" },
        }
      - {
          "name": "Test WASM bundle",
          "working-directory": "crates/html-to-markdown-wasm",
          "run": "../../scripts/ci/wasm/test-wasm-bundle.sh",
          "shell": "bash",
        }
      - {
          "name": "Run Rust WASM tests",
          "working-directory": "crates/html-to-markdown-wasm",
          "run": "../../scripts/ci/wasm/test-wasm-rust.sh",
          "shell": "bash",
        }
      - { "name": "Install alef", "uses": "xberg-io/actions/install-alef@v1" }
      - { "name": "Run E2E tests", "run": "alef test --e2e --lang wasm", "shell": "bash" }
  build-kotlin-android:
    name: "Build: Kotlin Android"
    if: inputs.task == 'build-kotlin-android'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - { "name": "Checkout", "uses": "actions/checkout@v7", "id": "checkout" }
      - {
          "name": "Setup Rust",
          "uses": "xberg-io/actions/setup-rust@v1",
          "with": { "targets": "aarch64-linux-android,x86_64-linux-android", "cache-key-prefix": "kotlin-android" },
        }
      # Google removed the legacy `tools` SDK package, but setup-android's `packages` input
      # still defaults to `tools platform-tools`, so a bare invocation now dies on
      # `Warning: Failed to find package 'tools'` -> sdkmanager exit 1, which took out all four
      # kotlin-android-natives legs of the 3.13.0 release. Request platform-tools explicitly. ~keep
      - {
          "name": "Setup Android SDK/NDK",
          "uses": "android-actions/setup-android@v4",
          "with": { "packages": "platform-tools" },
        }
      # ~keep Bundle the JNI crate (libhtm_jni.so) that the Kotlin bridge loads via
      # System.loadLibrary("htm_jni") — NOT the plain C-FFI crate, whose lib*_ffi.so
      # lacks the JNI entry points (html-to-markdown#446). This mirrors the exact
      # crate/lib pair the publish workflow's kotlin-android-natives job builds, so a
      # regression in the JNI crate surfaces here instead of only at publish time.
      - {
          "name": "Build Android native libraries",
          "uses": "xberg-io/actions/build-android-natives@v1",
          "with": { "crate-name": "html-to-markdown-rs-jni", "lib-name": "htm_jni", "abis": "arm64-v8a,x86_64" },
        }
      - {
          "name": "Cleanup Rust cache",
          "if": "always() && steps.checkout.outcome == 'success'",
          "uses": "xberg-io/actions/cleanup-rust-cache@v1",
        }
  # ~keep Kotlin/Android ships to Maven Central but was never compiled or tested in
  # CI (html-to-markdown audit #38) — build-kotlin-android above only cross-compiles
  # the native .so, it never invokes Gradle/Kotlin compilation. `gradle test` here
  # compiles the Kotlin facade against the host JVM and runs the e2e fixture suite
  # via a host-platform JNI build (see packages/kotlin-android/build.gradle.kts'
  # buildHostJni/copyHostJni tasks) — no Android emulator required.
  test-kotlin-android:
    name: "Test: Kotlin Android (host JVM)"
    if: inputs.task == 'test-kotlin-android'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - { "name": "Checkout", "uses": "actions/checkout@v7", "id": "checkout" }
      - {
          "name": "Setup Rust",
          "uses": "xberg-io/actions/setup-rust@v1",
          "with": { "cache-key-prefix": "kotlin-android-test" },
        }
      # Google removed the legacy `tools` SDK package, but setup-android's `packages` input
      # still defaults to `tools platform-tools`, so a bare invocation now dies on
      # `Warning: Failed to find package 'tools'` -> sdkmanager exit 1, which took out all four
      # kotlin-android-natives legs of the 3.13.0 release. Request platform-tools explicitly. ~keep
      - {
          "name": "Setup Android SDK/NDK",
          "uses": "android-actions/setup-android@v4",
          "with": { "packages": "platform-tools" },
        }
      - {
          "name": "Setup JDK",
          "uses": "actions/setup-java@v6",
          "with": { "distribution": "temurin", "java-version": "17" },
        }
      - { "name": "Install Task", "uses": "xberg-io/actions/install-task@v1" }
      - { "name": "Install alef", "uses": "xberg-io/actions/install-alef@v1" }
      - {
          "name": "Compile and test Kotlin Android binding (host JVM)",
          "run": "alef test --e2e --lang kotlin_android",
          "shell": "bash",
        }
      - {
          "name": "Cleanup Rust cache",
          "if": "always() && steps.checkout.outcome == 'success'",
          "uses": "xberg-io/actions/cleanup-rust-cache@v1",
        }
  test-swift:
    name: "Test: Swift"
