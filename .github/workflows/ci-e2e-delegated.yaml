      - { "name": "Setup Rust", "uses": "xberg-io/actions/setup-rust@v1", "with": { "cache-key-prefix": "swift" } }
      - { "name": "Setup Swift", "uses": "xberg-io/actions/setup-swift@v1", "with": { "version": "6.0" } }
      - { "name": "Setup PHP", "uses": "shivammathur/setup-php@v2", "with": { "php-version": "8.3" } }
      - { "name": "Install alef", "uses": "xberg-io/actions/install-alef@v1" }
      - { "name": "Run E2E tests", "run": "alef test --e2e --lang swift", "shell": "bash" }
      - { "name": "Cleanup Rust cache", "if": "always()", "uses": "xberg-io/actions/cleanup-rust-cache@v1" }
  test-dart:
    name: "Test: Dart"
    if: inputs.task == 'test-dart'
