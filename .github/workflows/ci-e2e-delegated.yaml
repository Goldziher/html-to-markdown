      - { "name": "Setup Rust", "uses": "xberg-io/actions/setup-rust@v1", "with": { "cache-key-prefix": "dart" } }
      - { "name": "Setup Dart", "uses": "dart-lang/setup-dart@v1" }
      - { "name": "Install alef", "uses": "xberg-io/actions/install-alef@v1" }
      - { "name": "Run E2E tests", "run": "alef test --e2e --lang dart", "shell": "bash" }
      - { "name": "Cleanup Rust cache", "if": "always()", "uses": "xberg-io/actions/cleanup-rust-cache@v1" }
  test-zig:
    name: "Test: Zig"
    if: inputs.task == 'test-zig'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - { "name": "Checkout", "uses": "actions/checkout@v7" }
      - { "name": "Install Task", "uses": "xberg-io/actions/install-task@v1" }
      - { "name": "Setup Rust", "uses": "xberg-io/actions/setup-rust@v1", "with": { "cache-key-prefix": "zig" } }
      - { "name": "Setup Zig", "uses": "xberg-io/actions/setup-zig@v1", "with": { "version": "0.16.0" } }
      - { "name": "Install alef", "uses": "xberg-io/actions/install-alef@v1" }
      - { "name": "Run E2E tests", "run": "alef test --e2e --lang zig", "shell": "bash" }
      - { "name": "Cleanup Rust cache", "if": "always()", "uses": "xberg-io/actions/cleanup-rust-cache@v1" }
  # ~keep The run's own conclusion is green whether a leg passed, was filtered out, or was skipped
  # ~keep for another reason, so nothing else in this workflow says which legs ran. This job fails
  # ~keep unless every leg succeeded or was skipped because its `run-<job id>` output is false. It
  # ~keep must list every other job in `needs`; scripts/tests/test_e2e_result.py fails otherwise.
