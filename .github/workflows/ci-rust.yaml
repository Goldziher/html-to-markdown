name: CI Rust

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "packages/*/native/**"
      - "packages/*/ext/**"
      - "packages/*/src/**"
      - "packages/*/rust/**"
      - "tools/benchmark-harness/**"
      - "e2e/rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - ".cargo/config.toml"
      - "fixtures/**"
      - ".github/workflows/ci-rust.yaml"
      - "alef.toml"
      - ".alef-ownership.toml"
      - "poly.toml"
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "packages/*/native/**"
      - "packages/*/ext/**"
      - "packages/*/src/**"
      - "packages/*/rust/**"
      - "tools/benchmark-harness/**"
      - "e2e/rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - ".cargo/config.toml"
      - "fixtures/**"
      - ".github/workflows/ci-rust.yaml"
      - "alef.toml"
      - ".alef-ownership.toml"
      - "poly.toml"
  workflow_dispatch: {}

# ~keep `github.sha` not `github.ref` for pushes: a cancelled run reports neither pass
# ~keep nor fail, and cancelling main's previous run is one of the two ways 3.15.0's R break shipped.
concurrency:
  group: ci-rust-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  BUILD_PROFILE: "ci"

permissions:
  contents: read

jobs:
  validate-rust:
    name: "Validate: Rust"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install Task
        uses: xberg-io/actions/install-task@v1

      - name: Check Rust Formatting
        run: task rust:lint:check
        shell: bash

      - name: Run Clippy
        run: task rust:lint:check
        shell: bash

      - name: Check feature flags (html-to-markdown)
        shell: bash
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo clippy -p html-to-markdown-rs --all-targets --no-default-features -- -D warnings
          cargo check -p html-to-markdown-rs --no-default-features --features visitor
          cargo check -p html-to-markdown-rs --no-default-features --features metadata
          cargo check -p html-to-markdown-rs --no-default-features --features inline-images

      - name: Test testkit without default features
        shell: bash
        run: cargo test -p html-to-markdown-rs --no-default-features --features testkit --no-fail-fast

  # ~keep Runs as its own job, not a step in validate-rust. When it lived there it never
  # executed once: `Check Rust Formatting` failed first and aborted the job, so 246 drifted
  # files went unreported while CI was red for an unrelated reason. A gate that cannot be
  # reached is indistinguishable from one that cannot fail.
  verify-bindings:
    name: "Validate: binding freshness"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1

      - name: Install alef
        uses: xberg-io/actions/install-alef@v1

      # ~keep `alef verify` compares formatter-owned generated files after a real Poly pass.
      # Without Poly it cannot validate those bytes and can report formatted Markdown as raw drift.
      - name: Install poly
        uses: Goldziher/poly@v0

      # ~keep Enforcement is the DEFAULT: `alef verify` returns a failure status on drift, and
      # `--report-only` is the opt-out — never add it here. The `--exit-code` flag this step
      # used to pass is a hidden deprecated no-op as of alef 0.76.0 (absent from `verify --help`),
      # so it was removed rather than left implying it is what makes the gate strict.
      - name: Verify binding freshness
        run: alef verify

  rust-tests:
    name: "Test: Rust (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        id: checkout

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          components: rustfmt, clippy, llvm-tools-preview
          cache-key-prefix: rust-tests-${{ matrix.os }}

      - name: Install Task
        uses: xberg-io/actions/install-task@v1

      - name: Run Rust Tests
        env:
          RUST_BACKTRACE: full
        run: task rust:test:ci
        shell: bash

      - name: Run E2E Tests
        run: task rust:e2e:test
        shell: bash

      - name: Cleanup Rust cache
        if: always() && steps.checkout.outcome == 'success'
        uses: xberg-io/actions/cleanup-rust-cache@v1

  closing-tag-complexity:
    name: "Complexity: ten runs (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: closing-tag-complexity-${{ matrix.os }}
      - uses: xberg-io/actions/install-task@v1
      # ~keep Issue #796 requires repeated measurements on all three runner operating systems.
      # Run the unchanged ratio gate ten times, stopping on the first failure.
      - name: Repeat the complexity regression ten times
        shell: bash
        run: |
          for attempt in $(seq 1 10); do
            echo "Complexity run ${attempt}/10"
            task rust:test:complexity
          done

  rust-coverage:
    name: "Coverage: Rust"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install Task
        uses: xberg-io/actions/install-task@v1

      - name: Generate Rust Coverage
        run: task rust:coverage:check
        shell: bash

      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.sha }}
          path: rust-coverage.lcov
          retention-days: 7

  # ~keep Content gate only. The timing guardrail moved to benchmark-guardrail.yaml (nightly and
  # manual) because it is only meaningful on a quiet runner, and making every push wait out a
  # settle period was not worth it. `bench:oracle` is fully deterministic and host-independent --
  # it diffs checked-in snapshots line by line rather than timing anything -- so it stays here.
  # It ran in no workflow until #495, by which point 76 of the 116 snapshots had drifted
  # unnoticed, one of them a real defect (#494).
  benchmark-oracle:
    name: "Benchmark: Output snapshots"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        id: checkout

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: benchmark-oracle

      - name: Install Task
        uses: xberg-io/actions/install-task@v1

      - name: Verify output snapshots
        run: task bench:oracle
        shell: bash

      - name: Cleanup Rust cache
        if: always() && steps.checkout.outcome == 'success'
        uses: xberg-io/actions/cleanup-rust-cache@v1
