  push:
    branches: [main]
    paths:
      - ".ai-rulez/**"
      - "**/*.rs"
      - "**/*.py"
      - "**/*.ts"
      - "**/*.rb"
      - "**/*.php"
      - "**/*.go"
      - "**/*.java"
      - "**/*.swift"
      - "**/*.zig"
      - "**/*.cs"
      - "**/*.dart"
      - "**/*.kt"
      - "**/*.kts"
      - "**/*.ex"
      - "**/*.exs"
      - "**/*.R"
      - "**/*.c"
      - "**/*.h"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.pyi"
      - "**/*.css"
      - "**/*.rbs"
      - "**/*.sh"
      - "**/*.toml"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.json"
      - "**/*.md"
      - "**/*.mdx"
      - "*.md"
      - "alef.toml"
      - "uv.lock"
      - "Cargo.lock"
      - "packages/elixir/mix.lock"
      - "packages/csharp/HtmlToMarkdown/HtmlToMarkdown.csproj"
      - "packages/csharp/HtmlToMarkdown/runtime.json.template"
      - "packages/go/go.mod"
      - "packages/csharp/Directory.Build.props"
      - "packages/ruby/html_to_markdown.gemspec"
      - "packages/ruby/Rakefile"
      - "packages/r/configure"
      - "packages/r/src/Makevars.in"
      - "packages/ruby/ext/html_to_markdown_rb/native/Cargo.lock"
      - "packages/elixir/native/html_to_markdown_nif/Cargo.lock"
      - "packages/r/src/rust/Cargo.lock"
      - "**/.editorconfig"
      - "packages/ruby/Gemfile"
      - "packages/ruby/Gemfile.lock"
      - "packages/java/pom.xml"
      - "packages/r/DESCRIPTION"
      - "packages/zig/build.zig.zon"
      - ".github/workflows/ci-lint.yaml"
  pull_request:
    branches: [main]
    paths:
      - ".ai-rulez/**"
      - "**/*.rs"
      - "**/*.py"
      - "**/*.ts"
      - "**/*.rb"
      - "**/*.php"
      - "**/*.go"
      - "**/*.java"
      - "**/*.swift"
      - "**/*.zig"
      - "**/*.cs"
      - "**/*.dart"
      - "**/*.kt"
      - "**/*.kts"
      - "**/*.ex"
      - "**/*.exs"
      - "**/*.R"
      - "**/*.c"
      - "**/*.h"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.pyi"
      - "**/*.css"
      - "**/*.rbs"
      - "**/*.sh"
      - "**/*.toml"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.json"
      - "**/*.md"
      - "**/*.mdx"
      - "*.md"
      - "alef.toml"
      - "uv.lock"
      - "Cargo.lock"
      - "packages/elixir/mix.lock"
      - "packages/csharp/HtmlToMarkdown/HtmlToMarkdown.csproj"
      - "packages/csharp/HtmlToMarkdown/runtime.json.template"
      - "packages/go/go.mod"
      - "packages/csharp/Directory.Build.props"
      - "packages/ruby/html_to_markdown.gemspec"
      - "packages/ruby/Rakefile"
      - "packages/r/configure"
      - "packages/r/src/Makevars.in"
      - "packages/ruby/ext/html_to_markdown_rb/native/Cargo.lock"
      - "packages/elixir/native/html_to_markdown_nif/Cargo.lock"
      - "packages/r/src/rust/Cargo.lock"
      - "**/.editorconfig"
      - "packages/ruby/Gemfile"
      - "packages/ruby/Gemfile.lock"
      - "packages/java/pom.xml"
      - "packages/r/DESCRIPTION"
      - "packages/zig/build.zig.zon"
      - ".github/workflows/ci-lint.yaml"
  workflow_dispatch: {}

# ~keep `github.sha` not `github.ref` for pushes: a cancelled run reports neither pass
# ~keep nor fail, and cancelling main's previous run is one of the two ways 3.15.0's R break shipped.
concurrency:
  group: ci-lint-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ~keep This lives here, not in `CI Docs`, because `CI Docs` filters on `docs-site/**`: a commit
  # that edits only CHANGELOG.md would not trigger it, which is exactly the drift being guarded
  # against. This workflow's filter covers `**/*.md` and `*.md`, so both changelogs match it.
  changelog-mirror:
    name: Changelog mirror
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the docs-site changelog mirror
        run: ./scripts/ci/check-changelog-mirror.sh

  release-scripts:
    name: Verify release helper regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/setup-python-env@v1
        with:
          python-version: "3.13"
          install-command: "uv sync --no-install-project --no-install-workspace"
      - uses: xberg-io/actions/install-task@2d3e217104ad1edf519be3e38703c14e3ed48aa4
      - name: Test release helpers
        run: task test:release-scripts

  quality-warnings:
    name: Reject quality warning regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: xberg-io/actions/install-task@2d3e217104ad1edf519be3e38703c14e3ed48aa4
      - uses: Goldziher/poly@601463a7592beb1e3f00b18816aea4e15b0d7007
      - run: task check:quality-warnings
        env:
          QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  validate:
    uses: xberg-io/actions/.github/workflows/reusable-validate.yml@v1
    with:
      setup-rust: true
      setup-python: true
      # poly's checkstyle whole-project check runs `mvn checkstyle:check`;
      # checkstyle 13+ requires JDK 21+. The version must also match
      # packages/java/pom.xml's maven.compiler.release, or the snippet
      # session's `mvn package` dies with "release version 25 not
      # supported" on the default JDK 21. ~keep
      setup-java: true
      java-version: "25"
      setup-android: true
      # The remaining whole-project checks poly runs (golangci-lint, rubocop, steep,
      # dart-analyze, credo) each need their own toolchain. Without them this job
      # skipped poly's workspace phase entirely, so those five linters ran only in
      # the git hooks and CI never saw them. ~keep
      setup-go: true
      setup-ruby: true
      setup-dart: true
      setup-elixir: true
      # zig and R snippets validated as `Unavailable` -- "toolchain not found" -- because
      # reusable-validate wired no setup step for either, and under `--strict` an Unavailable
      # fails the run exactly like a Fail. 566 of the 1078 Unavailable in run 32541909482 were
      # zig (283) + r (283). All three inputs are available on actions v1.8.144+. ~keep
      # ~keep `setup-swift` is NOT what fixed the 341 swift Unavailable: ubuntu-latest already
      # preinstalls Swift, so this action's own "Check existing Swift" step short-circuits and
      # the install is skipped ("Swift already installed: Swift version 6.4" in run 36162480685,
      # which still reported all 341). Those were a build-system layout change -- see
      # scripts/ci/swift/snippet-module-shim.sh. Kept only so a runner without Swift still works.
      setup-zig: true
      zig-version: "0.16.0"
      setup-r: true
      r-install-deps-script: scripts/ci/r/install-deps.sh
      setup-swift: true
      check-fixture-snippets: true
