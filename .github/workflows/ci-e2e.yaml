name: CI E2E
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
# ~keep `github.sha` not `github.ref` for pushes: a cancelled run reports neither pass
# ~keep nor fail, and cancelling main's previous run is one of the two ways 3.15.0's R break shipped.
concurrency:
  group: ci-e2e-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  BUILD_PROFILE: "ci"
  GO_VERSION: "1.26.0"
  GO_TOOLCHAIN: "go1.26.0"
  GOLANGCI_LINT_VERSION: "latest"
permissions:
  contents: read
jobs:
  changes:
    name: "Detect Changes"
    runs-on: ubuntu-24.04-arm
    # ~keep One `run-<job id>` output per gated leg, and each leg's `if:` reads only its own. The
    # ~keep `e2e-result` job reads the same outputs to tell a leg the filters skipped from a leg
    # ~keep that should have run and did not, so a leg's condition is written here and nowhere else.
    outputs:
      run-build-ffi: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.ffi == 'true' }}
      run-build-python: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.python == 'true' }}
      run-build-node: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.node == 'true' }}
      run-build-node-musl: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.node == 'true' }}
      run-build-node-linux-arm64-gnu: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.node == 'true' }}
      run-build-ruby: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.ruby == 'true' }}
      run-build-php: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.php == 'true' }}
      run-build-csharp: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.csharp == 'true' }}
      run-build-java: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.java == 'true' }}
      run-build-wasm: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.wasm == 'true' }}
      run-build-kotlin-android: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.kotlin == 'true' }}
      run-test-python: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.python == 'true' }}
      run-test-node: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.node == 'true' }}
      run-test-ruby: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.ruby == 'true' }}
      run-test-php: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.php == 'true' }}
      run-test-csharp: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.csharp == 'true' }}
      run-test-go: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.ffi == 'true' || steps.filter.outputs.go == 'true' }}
      run-test-java: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.java == 'true' }}
      run-test-elixir: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.ffi == 'true' || steps.filter.outputs.elixir == 'true' }}
      run-test-r: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.r == 'true' }}
      run-test-c-ffi: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.ffi == 'true' || steps.filter.outputs.cffi == 'true' }}
      run-test-c-ffi-windows: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.ffi == 'true' }}
      run-test-wasm: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.wasm == 'true' }}
      run-test-kotlin-android: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.kotlin == 'true' }}
      run-test-swift: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.ffi == 'true' || steps.filter.outputs.swift == 'true' }}
      run-test-dart: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.dart == 'true' }}
      run-test-zig: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.ffi == 'true' || steps.filter.outputs.zig == 'true' }}
    steps:
      - { "name": "Checkout", "uses": "actions/checkout@v7" }
      - name: Detect changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            core:
              - "crates/html-to-markdown/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - ".cargo/config.toml"
              - "fixtures/**"
              - "alef.toml"
              - ".github/workflows/ci-e2e.yaml"
              - ".github/workflows/ci-e2e-delegated.yaml"
            ffi:
              - "crates/html-to-markdown-ffi/**"
              - "crates/html-to-markdown/**"
              - "Cargo.toml"
              - "Cargo.lock"
            cffi:
              - "e2e/c/**"
            python:
              - "crates/html-to-markdown-py/**"
              - "crates/html-to-markdown-cli/**"
              - "packages/python/**"
              - "e2e/python/**"
              - "pyproject.toml"
              - "uv.lock"
              - "uv.toml"
              - "fixtures/**"
            node:
              - "crates/html-to-markdown-node/**"
              - "e2e/node/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "fixtures/**"
            ruby:
              - "packages/ruby/**"
              - "crates/html-to-markdown-cli/**"
              - "scripts/ci/ruby/**"
              - "e2e/ruby/**"
              - "fixtures/**"
            php:
              - "crates/html-to-markdown-php/**"
              - "scripts/ci/php/**"
              - "e2e/php/**"
              - "composer.json"
              - "composer.lock"
              - "fixtures/**"
            go:
              - "packages/go/**"
              - "scripts/ci/go/**"
              - "e2e/go/**"
              - "crates/html-to-markdown-ffi/**"
              - "fixtures/**"
            java:
              - "packages/java/**"
              - "e2e/java/**"
              - "crates/html-to-markdown-ffi/**"
              - "fixtures/**"
            elixir:
              - "packages/elixir/**"
              - "scripts/ci/elixir/**"
              - "e2e/elixir/**"
              - "crates/html-to-markdown-ffi/**"
              - "fixtures/**"
            r:
              - "packages/r/**"
              - "scripts/ci/r/**"
              - "e2e/r/**"
              - "fixtures/**"
            wasm:
              - "crates/html-to-markdown-wasm/**"
              - "scripts/ci/wasm/**"
              - "scripts/common/**"
              - "e2e/wasm/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "fixtures/**"
            csharp:
              - "packages/csharp/**"
              - "scripts/ci/csharp/**"
              - "e2e/csharp/**"
              - "crates/html-to-markdown-ffi/**"
              - "fixtures/**"
            kotlin:
              - "packages/kotlin-android/**"
              # ~keep build-kotlin-android builds html-to-markdown-rs-jni, NOT the plain
              # ~keep C-FFI crate; without this a JNI-only change skipped both Kotlin jobs.
              - "crates/html-to-markdown-rs-jni/**"
              - "e2e/kotlin_android/**"
              - "fixtures/**"
            swift:
              - "packages/swift/**"
              - "e2e/swift_e2e/**"
              - "fixtures/**"
            dart:
              - "packages/dart/**"
              - "e2e/dart/**"
              - "fixtures/**"
            zig:
              - "packages/zig/**"
              - "e2e/zig/**"
              - "crates/html-to-markdown-ffi/**"
              - "fixtures/**"
  # ~keep e2e/ is entirely generated from fixtures/ (html-to-markdown audit #40).
  # Nothing previously regenerated it in CI and diffed the result, so a fixture or
  # generator change could drift from the checked-in e2e suite indefinitely.
  e2e-freshness:
    name: "Verify: e2e freshness"
    uses: ./.github/workflows/ci-e2e-delegated.yaml
    with:
      task: e2e-freshness
  build-ffi:
    needs: [changes]
    name: "Build: FFI (${{ matrix.runner }})"
    if: needs.changes.outputs.run-build-ffi == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
          - windows-11-arm
    uses: ./.github/workflows/ci-e2e-delegated.yaml
    with:
      task: build-ffi
      runner: ${{ matrix.runner }}
  build-python:
    needs: [changes]
    name: "Build: Python (${{ matrix.os }})"
    if: needs.changes.outputs.run-build-python == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.14"]
    steps:
      - { "name": "Checkout", "uses": "actions/checkout@v7", "id": "checkout" }
      - { "name": "Install Task", "uses": "xberg-io/actions/install-task@v1" }
      - { "name": "Install uv", "uses": "astral-sh/setup-uv@v10.3.0", "with": { "enable-cache": true } }
      - {
          "name": "Set up Python",
          "uses": "actions/setup-python@v7",
          "with": { "python-version": "${{ matrix.python }}" },
        }
      - {
          "name": "Setup Rust",
          "uses": "xberg-io/actions/setup-rust@v1",
          "with": {
            "components": "rustfmt, clippy, llvm-tools-preview",
            "cache-key-prefix": "python-${{ matrix.os }}-${{ matrix.python }}",
          },
        }
      - name: Install Python Dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            if [[ "${{ runner.os }}" == "Windows" ]] && [[ -d ".venv" ]]; then
              echo "Removing existing .venv directory on Windows"
              rm -rf .venv
            fi
            uv sync --all-extras --no-install-project --no-install-workspace
          shell: bash
      - name: Build Python Bindings
        run: |
          uv pip install maturin
          cd packages/python && uv run maturin develop --release
        shell: bash
      - { "name": "Build CLI binary", "run": "cargo build --release --locked -p html-to-markdown-cli", "shell": "bash" }
      - {
          "name": "Cleanup Rust cache",
          "if": "always() && steps.checkout.outcome == 'success'",
          "uses": "xberg-io/actions/cleanup-rust-cache@v1",
        }
  build-node:
    needs: [changes]
    name: "Build: Node (${{ matrix.os }}, ${{ matrix.runtime }})"
    if: needs.changes.outputs.run-build-node == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        runtime: [node, bun]
        exclude:
          - os: windows-latest
            runtime: bun
    steps:
      - { "name": "Checkout", "uses": "actions/checkout@v7", "id": "checkout" }
      - { "name": "Install Task", "uses": "xberg-io/actions/install-task@v1" }
      - {
          "name": "Setup Rust",
          "uses": "xberg-io/actions/setup-rust@v1",
          "with": { "cache-key-prefix": "node-${{ matrix.os }}-${{ matrix.runtime }}" },
        }
      - {
          "name": "Setup Node.js workspace",
          "uses": "xberg-io/actions/setup-node-workspace@59f1b4d0d2e6186a995f4b8a543951c39ac5edd2",
        }
      - {
          "name": "Setup Bun",
          "if": "matrix.runtime == 'bun'",
          "uses": "oven-sh/setup-bun@v2",
          "with": { "bun-version": "latest" },
        }
      - {
          "name": "Build NAPI-RS Bindings (Node.js)",
          "if": "matrix.runtime == 'node'",
          "uses": "xberg-io/actions/build-node-napi@v1",
          "with": { "crate-dir": "crates/html-to-markdown-node" },
        }
      - {
          "name": "Install workspace dependencies (Bun)",
          "if": "matrix.runtime == 'bun'",
          "run": "task node:install:bun",
          "shell": "bash",
        }
      - {
          "name": "Build NAPI-RS Bindings (Bun)",
          "if": "matrix.runtime == 'bun'",
          "run": "task node:build:bun",
          "shell": "bash",
        }
      - {
          "name": "Cleanup Rust cache",
          "if": "always() && steps.checkout.outcome == 'success'",
          "uses": "xberg-io/actions/cleanup-rust-cache@v1",
        }
  # ~keep The musl platform packages are cross-compiled through zig and were only ever built at
  # publish time, where both legs failed and skipped the whole npm publish. This mirrors the
  # publish job's steps so a broken cross-compile surfaces on the commit that causes it.
  build-node-musl:
    needs: [changes]
    name: "Build: Node (${{ matrix.target }}, zig cross-compile)"
    if: needs.changes.outputs.run-build-node-musl == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - { "name": "Checkout", "uses": "actions/checkout@v7", "id": "checkout" }
      - {
          "name": "Setup Rust",
          "uses": "xberg-io/actions/setup-rust@v1",
          "with": {
            "target": "${{ matrix.target }}",
            "cache-key-prefix": "node-musl-${{ matrix.target }}",
            "configure-musl-cc": "false",
          },
        }
      - {
          "name": "Setup Node.js workspace",
          "uses": "xberg-io/actions/setup-node-workspace@v1",
          "with": { "node-version": "24" },
        }
      - { "name": "Setup Zig", "uses": "xberg-io/actions/setup-zig@v1", "with": { "version": "0.16.0" } }
      - {
          "name": "Install cargo-zigbuild",
          "shell": "bash",
          "run": "command -v cargo-zigbuild || cargo install --locked cargo-zigbuild",
        }
      - {
          "name": "Build native module",
          "uses": "xberg-io/actions/build-node-napi@v1",
          # ~keep The action recreates npm/ after deleting it. pnpm 12 otherwise rejects the
          # temporarily missing workspace importers before napi can recreate them.
          "env": { "PNPM_CONFIG_FROZEN_LOCKFILE": "false" },
          "with": {
            "crate-dir": "crates/html-to-markdown-node",
            "target": "${{ matrix.target }}",
            "cross-compile": "true",
            "install-deps": "false",
          },
        }
      - name: Verify the platform package holds a native module
        shell: bash
        working-directory: crates/html-to-markdown-node
        run: |
          set -euo pipefail
          node_file=$(find npm -maxdepth 2 -name "*.node" -type f | head -1)
          if [ -z "${node_file}" ]; then
            echo "::error::No .node file found under npm/ for ${{ matrix.target }}"
            find npm -maxdepth 2 -type f
            exit 1
          fi
          file "${node_file}"
          echo "Verified: $(basename "$(dirname "${node_file}")") contains $(basename "${node_file}")"
      - {
          "name": "Cleanup Rust cache",
          "if": "always() && steps.checkout.outcome == 'success'",
          "uses": "xberg-io/actions/cleanup-rust-cache@v1",
        }
  # ~keep aarch64-unknown-linux-gnu is cross-compiled through the docker-based
  # @napi-rs/cross-toolchain (napi build --use-napi-cross), a different code path
  # than the host-native builds above and the zig cross-compile below. It was only
  # ever exercised at publish time (same publish-only-leg class as the musl job
  # above) — mirror it here so a broken cross-toolchain surfaces on the commit
  # that causes it instead of at tag time.
  build-node-linux-arm64-gnu:
    needs: [changes]
    name: "Build: Node (aarch64-unknown-linux-gnu, napi-cross)"
    if: needs.changes.outputs.run-build-node-linux-arm64-gnu == 'true'
    uses: ./.github/workflows/ci-e2e-delegated.yaml
    with:
      task: build-node-linux-arm64-gnu
  build-ruby:
    needs: [changes]
    name: "Build: Ruby (${{ matrix.os }}, ruby-${{ matrix.ruby }})"
    if: needs.changes.outputs.run-build-ruby == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby: ["3.2", "3.3"]
    steps:
      - { "name": "Checkout", "uses": "actions/checkout@v7", "id": "checkout" }
      - {
          "name": "Setup Rust",
          "uses": "xberg-io/actions/setup-rust@v1",
          "with": { "cache-key-prefix": "ruby-${{ matrix.os }}-${{ matrix.ruby }}" },
        }
      - {
          "name": "Setup Ruby (Unix)",
          "if": "runner.os != 'Windows'",
          "uses": "ruby/setup-ruby@v1",
          "with": {
            "ruby-version": "${{ matrix.ruby }}",
            "bundler": "4.0.3",
            "bundler-cache": false,
            "working-directory": "packages/ruby",
          },
        }
      - {
          "name": "Setup Ruby (Windows)",
          "if": "runner.os == 'Windows'",
          "uses": "ruby/setup-ruby@v1",
          "with": {
            "ruby-version": "${{ matrix.ruby }}",
            "bundler": "4.0.3",
            "bundler-cache": false,
            "working-directory": "packages/ruby",
            "windows-toolchain": "UCRT64",
          },
        }
      - {
          "name": "Build CLI binary",
          "uses": "xberg-io/actions/build-rust-cli@v1",
          "with": { "package-name": "html-to-markdown-cli", "binary-name": "html-to-markdown" },
        }
      - name: Build Ruby extension
        uses: xberg-io/actions/build-ruby-gem@v1
        with:
          # Non-release e2e CI builds the gem against the local workspace path-dep;
          # skip the registry rewrite that hard-fails until core is on crates.io. ~keep
          rewrite-native-deps: "false"
      - {
          "name": "Cleanup Rust cache",
          "if": "always() && steps.checkout.outcome == 'success'",
          "uses": "xberg-io/actions/cleanup-rust-cache@v1",
        }
  # ~keep Publish builds the PHP extension across linux-x86_64, linux-arm64,
  # macos-arm64, and windows-x86_64 for every supported PHP version (16 legs
  # total), but until now only ubuntu/php8.4 was ever exercised before tag
  # time. Mirror the per-platform build (one php version, not the full 4x4
  # matrix) so a total per-platform failure surfaces in CI instead of at
  # publish. Cross-PHP-version coverage stays publish-only — see the audit.
  build-php:
    needs: [changes]
    name: "Build: PHP (${{ matrix.platform.label }})"
    if: needs.changes.outputs.run-build-php == 'true'
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-latest, label: linux-x86_64 }
          - { os: ubuntu-24.04-arm, label: linux-arm64 }
          - { os: macos-latest, label: macos-arm64 }
          - { os: windows-latest, label: windows-x86_64 }
    steps:
      - { "name": "Checkout", "uses": "actions/checkout@v7", "id": "checkout" }
      - {
          "name": "Setup PHP",
          "uses": "shivammathur/setup-php@v2",
          "with": {
            "php-version": "8.4",
            "extensions": "ctype, dom, json, libxml, mbstring, tokenizer, xml, xmlwriter",
            "tools": "composer:2.9.8",
            "coverage": "none",
          },
        }
      - {
          "name": "Setup Rust",
          "uses": "xberg-io/actions/setup-rust@v1",
          "with": { "cache-key-prefix": "php-${{ matrix.platform.label }}" },
        }
      - { "name": "Capture php-config path", "run": "scripts/ci/php/set-php-config.sh", "shell": "bash" }
      - {
          "name": "Install root Composer dependencies",
          "uses": "ramsey/composer-install@v4",
          "with": { "dependency-versions": "locked" },
          "env": { "COMPOSER_AUTH": "{\"github-oauth\":{\"github.com\":\"${{ secrets.GITHUB_TOKEN }}\"}}" },
        }
      - name: Build PHP extension
        id: build-php-extension
        uses: xberg-io/actions/build-php-extension@v1
        with:
          # Keep unreleased core dependencies in the local workspace with its committed lockfile. ~keep
          rewrite-native-deps: "false"
          crate-name: html-to-markdown-php
          lib-name: html_to_markdown_php
      - {
          "name": "Upload PHP extension artifact",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "php-extension-${{ matrix.platform.label }}",
            "path": "${{ steps.build-php-extension.outputs.extension-path }}",
            "retention-days": 7,
          },
        }
      - {
          "name": "Cleanup Rust cache",
          "if": "always() && steps.checkout.outcome == 'success'",
          "uses": "xberg-io/actions/cleanup-rust-cache@v1",
        }
  build-csharp:
    needs: [changes]
    name: "Build: C# (${{ matrix.os }})"
    if: needs.changes.outputs.run-build-csharp == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - { "name": "Checkout", "uses": "actions/checkout@v7", "id": "checkout" }
      - { "name": "Install Task", "uses": "xberg-io/actions/install-task@v1" }
      - {
          "name": "Setup Rust",
          "uses": "xberg-io/actions/setup-rust@v1",
          "with": { "cache-key-prefix": "csharp-${{ matrix.os }}" },
        }
      - { "name": "Setup .NET", "uses": "actions/setup-dotnet@v6", "with": { "dotnet-version": "10.0.x" } }
      - {
          "name": "Build FFI library (Unix)",
          "if": "runner.os != 'Windows'",
          "run": "cargo build --release --locked -p html-to-markdown-ffi",
          "shell": "bash",
        }
      - {
          "name": "Build FFI library (Windows)",
          "if": "runner.os == 'Windows'",
          "run": "cargo build --locked -p html-to-markdown-ffi",
          "shell": "bash",
        }
      - name: Restore C# dependencies
        run: dotnet restore packages/csharp/
        shell: bash
      - name: Build C# package
        run: dotnet build packages/csharp/ -c Release
        shell: bash
      - {
          "name": "Cleanup Rust cache",
          "if": "always() && steps.checkout.outcome == 'success'",
          "uses": "xberg-io/actions/cleanup-rust-cache@v1",
        }
  build-java:
    needs: [changes]
    name: "Build: Java (${{ matrix.os }})"
    if: needs.changes.outputs.run-build-java == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: ["25"]
    uses: ./.github/workflows/ci-e2e-delegated.yaml
    with:
      task: build-java
      os: ${{ matrix.os }}
      java: ${{ matrix.java }}
  build-wasm:
    needs: [changes]
    name: "Build: WASM"
    if: needs.changes.outputs.run-build-wasm == 'true'
    uses: ./.github/workflows/ci-e2e-delegated.yaml
    with:
      task: build-wasm
  test-python:
    needs: [build-python, changes]
    name: "Test: Python (${{ matrix.os }}, py-${{ matrix.python }})"
    if: always() && !cancelled() && needs.changes.outputs.run-test-python == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.14"]
    steps:
      - { "name": "Checkout", "uses": "actions/checkout@v7" }
      - { "name": "Install Task", "uses": "xberg-io/actions/install-task@v1" }
      - { "name": "Install uv", "uses": "astral-sh/setup-uv@v10.3.0", "with": { "enable-cache": true } }
      - {
          "name": "Set up Python",
          "uses": "actions/setup-python@v7",
          "with": { "python-version": "${{ matrix.python }}" },
        }
      - {
          "name": "Setup Rust",
          "uses": "xberg-io/actions/setup-rust@v1",
          "with": { "components": "rustfmt, clippy, llvm-tools-preview" },
        }
      - name: Install Python Dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            if [[ "${{ runner.os }}" == "Windows" ]] && [[ -d ".venv" ]]; then
              echo "Removing existing .venv directory on Windows"
              rm -rf .venv
            fi
            uv sync --all-extras --no-install-project --no-install-workspace
          shell: bash
      - name: Build Python Bindings
        run: |
          uv pip install maturin
          cd packages/python && uv run maturin develop --release
        shell: bash
      - { "name": "Build CLI binary", "run": "cargo build --release --locked -p html-to-markdown-cli", "shell": "bash" }
      - { "name": "Install alef", "uses": "xberg-io/actions/install-alef@v1" }
      - { "name": "Run E2E tests", "run": "alef test --e2e --lang python", "shell": "bash" }
  test-node:
    needs: [build-node, changes]
    name: "Test: Node (${{ matrix.os }}, ${{ matrix.runtime }})"
    if: always() && !cancelled() && needs.changes.outputs.run-test-node == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        runtime: [node, bun]
        exclude:
          - os: windows-latest
            runtime: bun
    steps:
      - { "name": "Checkout", "uses": "actions/checkout@v7" }
      - { "name": "Install Task", "uses": "xberg-io/actions/install-task@v1" }
      - { "name": "Setup Rust", "uses": "xberg-io/actions/setup-rust@v1" }
      - {
          "name": "Setup Node.js workspace",
          "uses": "xberg-io/actions/setup-node-workspace@59f1b4d0d2e6186a995f4b8a543951c39ac5edd2",
        }
      - {
          "name": "Setup Bun",
          "if": "matrix.runtime == 'bun'",
          "uses": "oven-sh/setup-bun@v2",
          "with": { "bun-version": "latest" },
        }
      - {
          "name": "Build NAPI-RS Bindings (Node.js)",
          "if": "matrix.runtime == 'node'",
          "uses": "xberg-io/actions/build-node-napi@v1",
          "with": { "crate-dir": "crates/html-to-markdown-node" },
        }
      - {
          "name": "Install workspace dependencies (Bun)",
          "if": "matrix.runtime == 'bun'",
          "run": "task node:install:bun",
          "shell": "bash",
        }
      - {
          "name": "Build NAPI-RS Bindings (Bun)",
          "if": "matrix.runtime == 'bun'",
          "run": "task node:build:bun",
          "shell": "bash",
        }
      - { "name": "Install alef", "if": "matrix.runtime == 'node'", "uses": "xberg-io/actions/install-alef@v1" }
      - {
          "name": "Run E2E tests (Node.js only)",
          "if": "matrix.runtime == 'node'",
          "run": "alef test --e2e --lang node",
          "shell": "bash",
        }
  test-ruby:
    needs: [build-ruby, changes]
    name: "Test: Ruby (${{ matrix.os }}, ruby-${{ matrix.ruby }})"
    if: always() && !cancelled() && needs.changes.outputs.run-test-ruby == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby: ["3.2", "3.3"]
    uses: ./.github/workflows/ci-e2e-delegated.yaml
    with:
      task: test-ruby
      os: ${{ matrix.os }}
      ruby: ${{ matrix.ruby }}
  test-php:
    needs: [build-php, changes]
    name: "Test: PHP"
    if: always() && !cancelled() && needs.changes.outputs.run-test-php == 'true'
    uses: ./.github/workflows/ci-e2e-delegated.yaml
    with:
      task: test-php
  test-csharp:
    needs: [build-csharp, build-ffi, changes]
    name: "Test: C# (${{ matrix.os }})"
    if: always() && !cancelled() && needs.changes.outputs.run-test-csharp == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - { "name": "Checkout", "uses": "actions/checkout@v7" }
      - { "name": "Install Task", "uses": "xberg-io/actions/install-task@v1" }
      - {
          "name": "Setup Rust",
          "uses": "xberg-io/actions/setup-rust@v1",
          "with": { "cache-key-prefix": "csharp-test-${{ matrix.os }}" },
        }
      - { "name": "Setup .NET", "uses": "actions/setup-dotnet@v6", "with": { "dotnet-version": "10.0.x" } }
      - {
          "name": "Build FFI library (Unix)",
          "if": "runner.os != 'Windows'",
          "run": "cargo build --release --locked -p html-to-markdown-ffi",
          "shell": "bash",
        }
      - {
          "name": "Build FFI library (Windows)",
          "if": "runner.os == 'Windows'",
          "run": "cargo build --locked -p html-to-markdown-ffi",
          "shell": "bash",
        }
      - name: Restore C# dependencies
        run: dotnet restore packages/csharp/
        shell: bash
      - name: Build C# package
        run: dotnet build packages/csharp/ -c Release
        shell: bash
      - { "name": "Install alef", "uses": "xberg-io/actions/install-alef@v1" }
      - {
          "name": "Run E2E tests (Unix)",
          "if": "runner.os != 'Windows'",
          "run": "alef test --e2e --lang csharp",
          "shell": "bash",
          "env": {
            "LD_LIBRARY_PATH": "${{ github.workspace }}/target/release:${{ github.workspace }}/target/debug",
            "DYLD_LIBRARY_PATH": "${{ github.workspace }}/target/release:${{ github.workspace }}/target/debug",
          },
        }
      - name: Run E2E tests (Windows)
        if: runner.os == 'Windows'
        run: |
          export PATH="${{ github.workspace }}/target/release:${{ github.workspace }}/target/debug:$PATH"
          alef test --e2e --lang csharp
        shell: bash
      - { "name": "Cleanup Rust cache", "if": "always()", "uses": "xberg-io/actions/cleanup-rust-cache@v1" }
  test-go:
    needs: [changes]
    name: "Test: Go"
    if: needs.changes.outputs.run-test-go == 'true'
    uses: ./.github/workflows/ci-e2e-delegated.yaml
    with:
      task: test-go
  test-java:
    needs: [build-java, changes]
    name: "Test: Java (${{ matrix.os }})"
    if: always() && !cancelled() && needs.changes.outputs.run-test-java == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: ["25"]
    steps:
      - { "name": "Checkout", "uses": "actions/checkout@v7" }
      - { "name": "Setup Rust", "uses": "xberg-io/actions/setup-rust@v1" }
      - {
          "name": "Test Java Panama FFI bindings",
          "uses": "xberg-io/actions/test-java-ffi@v1",
          "with": {
            "ffi-crate-name": "html-to-markdown-ffi",
            "ffi-lib-name": "html_to_markdown_ffi",
            "java-version": "${{ matrix.java }}",
          },
        }
      - { "name": "Install Task", "uses": "xberg-io/actions/install-task@v1" }
      - { "name": "Install alef", "if": "matrix.os != 'windows-latest'", "uses": "xberg-io/actions/install-alef@v1" }
      - {
          "name": "Run E2E tests (Linux + macOS)",
          "if": "matrix.os != 'windows-latest'",
          "run": "alef test --e2e --lang java",
          "shell": "bash",
        }
  test-elixir:
    needs: [changes]
    name: "Test: Elixir"
    if: needs.changes.outputs.run-test-elixir == 'true'
    uses: ./.github/workflows/ci-e2e-delegated.yaml
    with:
      task: test-elixir
  test-r:
    needs: [changes]
    name: "Test: R"
    if: always() && !cancelled() && needs.changes.outputs.run-test-r == 'true'
    uses: ./.github/workflows/ci-e2e-delegated.yaml
    with:
      task: test-r
  test-c-ffi:
    needs: [build-ffi, changes]
    name: "Test: C FFI (${{ matrix.runner }})"
    if: always() && !cancelled() && needs.changes.outputs.run-test-c-ffi == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
    steps:
      - { "name": "Checkout", "uses": "actions/checkout@v7" }
      - {
          "name": "Setup Rust",
          "uses": "xberg-io/actions/setup-rust@v1",
          "with": { "cache-key-prefix": "c-ffi-${{ matrix.runner }}", "use-sccache": false },
        }
      - {
          "name": "Build html-to-markdown-ffi",
          "shell": "bash",
          "run": "cargo build --release --locked -p html-to-markdown-ffi",
          "env": { "ALEF_EXPORT_GENERATED_HEADERS": "1" },
        }
      - {
          "name": "Run C e2e tests",
          "shell": "bash",
          "env": {
            "LD_LIBRARY_PATH": "${{ github.workspace }}/target/release",
            "DYLD_LIBRARY_PATH": "${{ github.workspace }}/target/release",
          },
          "run": "cd e2e/c && make test",
        }
      - name: Verify header is fresh
        shell: bash
        run: |
          HEADER="crates/html-to-markdown-ffi/include/html_to_markdown.h"
          GO_HEADER="packages/go/include/html_to_markdown.h"
          for file in "$HEADER" "$GO_HEADER"; do
            test -f "$file" || {
              echo "::error::$file is missing after the build. Run 'ALEF_EXPORT_GENERATED_HEADERS=1 cargo build -p html-to-markdown-ffi' and commit the result."
              exit 1
            }
          done
          git diff --exit-code -- "$HEADER" "$GO_HEADER" || {
            echo "::error::$HEADER or $GO_HEADER is stale: cbindgen regenerated a different header than the one committed. Run 'ALEF_EXPORT_GENERATED_HEADERS=1 cargo build -p html-to-markdown-ffi' and commit the result."
            exit 1
          }
          echo "Headers verified fresh: $HEADER $GO_HEADER"
  test-c-ffi-windows:
    needs: [build-ffi, changes]
    name: "Test: C FFI (windows-latest)"
    if: always() && !cancelled() && needs.changes.outputs.run-test-c-ffi-windows == 'true'
    uses: ./.github/workflows/ci-e2e-delegated.yaml
    with:
      task: test-c-ffi-windows
  test-wasm:
    needs: [build-wasm, changes]
    name: "Test: WASM"
    if: always() && !cancelled() && needs.changes.outputs.run-test-wasm == 'true'
    uses: ./.github/workflows/ci-e2e-delegated.yaml
    with:
      task: test-wasm
  build-kotlin-android:
    needs: [changes]
    name: "Build: Kotlin Android"
    if: needs.changes.outputs.run-build-kotlin-android == 'true'
    uses: ./.github/workflows/ci-e2e-delegated.yaml
    with:
      task: build-kotlin-android
  test-kotlin-android:
    needs: [changes]
    name: "Test: Kotlin Android (host JVM)"
    if: needs.changes.outputs.run-test-kotlin-android == 'true'
    uses: ./.github/workflows/ci-e2e-delegated.yaml
    with:
      task: test-kotlin-android
  test-swift:
    needs: [changes]
    name: "Test: Swift"
    if: needs.changes.outputs.run-test-swift == 'true'
    uses: ./.github/workflows/ci-e2e-delegated.yaml
    with:
      task: test-swift
  test-dart:
    needs: [changes]
    name: "Test: Dart"
    if: needs.changes.outputs.run-test-dart == 'true'
    uses: ./.github/workflows/ci-e2e-delegated.yaml
    with:
      task: test-dart
  test-zig:
    needs: [changes]
    name: "Test: Zig"
    if: needs.changes.outputs.run-test-zig == 'true'
    uses: ./.github/workflows/ci-e2e-delegated.yaml
    with:
      task: test-zig
  e2e-result:
    name: "E2E result"
    needs:
      - changes
      - e2e-freshness
      - build-ffi
      - build-python
      - build-node
      - build-node-musl
      - build-node-linux-arm64-gnu
      - build-ruby
      - build-php
      - build-csharp
      - build-java
      - build-wasm
      - build-kotlin-android
      - test-python
      - test-node
      - test-ruby
      - test-php
      - test-csharp
      - test-go
      - test-java
      - test-elixir
      - test-r
      - test-c-ffi
      - test-c-ffi-windows
      - test-wasm
      - test-kotlin-android
      - test-swift
      - test-dart
      - test-zig
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - {
          "name": "Checkout",
          "uses": "actions/checkout@v7",
          "with": { "sparse-checkout": "scripts/check_e2e_result.py", "sparse-checkout-cone-mode": false },
        }
      - {
          "name": "Check every leg ran or was filtered out",
          "env": { "NEEDS": "${{ toJSON(needs) }}" },
          "run": "python3 scripts/check_e2e_result.py verdict",
          "shell": "bash",
        }
