[package]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/src/**",
]
name = "html-to-markdown-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Command-line interface for html-to-markdown - high-performance HTML to Markdown converter"
keywords = ["html", "markdown", "cli", "converter", "html5ever"]
categories = ["command-line-utilities", "text-processing"]

# ~keep cargo-binstall support: release assets use a `cli-` prefix that doesn't match
# ~keep binstall's default naming, so pin the download URL and bin-dir explicitly.
# ~keep See https://github.com/cargo-bins/cargo-binstall/blob/main/SUPPORT.md
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/cli-{ target }{ archive-suffix }"
bin-dir = "cli-{ target }/{ bin }{ binary-ext }"

[[bin]]
name = "html-to-markdown"
path = "src/main.rs"

[features]
# ~keep mcp-http opens an unauthenticated HTTP listener; a CLI installed via
# ~keep brew/cargo/npm/pip must not start a network service by default, so it
# ~keep is opt-in (`--features mcp-http`) while stdio `mcp` (no listening
# ~keep socket) stays on by default for the plugin's `mcp` subcommand.
default = ["mcp"]
mcp = ["html-to-markdown-rs/mcp", "dep:tokio"]
mcp-http = ["mcp", "html-to-markdown-rs/mcp-http"]

# ~keep A `#[global_allocator]` is a process-wide choice, so it belongs to this binary
# ~keep and never to the library or the extension crates that load into a host runtime.
# ~keep Enabling both at once is resolved by precedence in `src/main.rs` (jemalloc wins), not by
# ~keep `compile_error!`: features are additive, so `--all-features` would otherwise be unbuildable.
mimalloc = ["dep:mimalloc"]
jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
base64.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
encoding_rs.workspace = true
html-to-markdown-rs = { workspace = true, features = ["metadata", "inline-images", "visitor", "serde"] }
mimalloc = { workspace = true, optional = true }
reqwest = { version = "0.13.5", default-features = false, features = [
  "blocking",
  "rustls",
  "gzip",
  "deflate",
  "charset",
] }
serde_json = "1.0"
tikv-jemallocator = { workspace = true, optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"

[lints]
workspace = true
