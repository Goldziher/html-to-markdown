[package]
name = "html-to-markdown-rs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
rust-version.workspace = true
description = "High-performance HTML to Markdown converter using the astral-tl parser. Part of the Xberg ecosystem."
keywords = ["html", "markdown", "converter", "astral-tl", "doc-processing"]
categories = ["parsing", "text-processing", "web-programming"]
# ~keep These two tests `include_str!` the CommonMark spec fixture from
# ~keep `packages/python/tests/`, which is outside this package root and so is not
# ~keep carried by `cargo package`. Shipping them would publish a crate whose
# ~keep `cargo test` cannot compile. They are excluded rather than having the
# ~keep fixture moved in, because that fixture is CC-BY-SA and vendoring it into
# ~keep the published artifact is a licensing decision, not a packaging one.
exclude = ["tests/commonmark_compliance_test.rs", "tests/commonmark_spec_fixpoint.rs"]

[package.metadata.cargo-machete]
ignored = ["once_cell", "ahash"]

[lib]
crate-type = ["rlib"]

[features]
default = ["metadata"]
full = ["inline-images", "metadata", "visitor", "serde"]
inline-images = ["dep:image"]
metadata = ["dep:serde"]
visitor = []
serde = ["dep:serde"]
testkit = []
mcp = ["dep:rmcp", "dep:tokio", "dep:schemars", "serde", "metadata"]
mcp-http = ["mcp", "dep:axum", "dep:tower", "dep:tower-http"]

[dependencies]
ahash.workspace = true
axum = { version = "0.8", optional = true }
base64.workspace = true
bitflags = "2"
html-escape = "0.2.15"
html5ever.workspace = true
image = { version = "0.25", default-features = false, features = [
    "gif",
    "jpeg",
    "png",
    "bmp",
    "webp",
], optional = true }
memchr = "2"
once_cell.workspace = true
phf = { version = "0.14", features = ["macros"] }
regex.workspace = true
rmcp = { version = "3.5.1", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
    "server-side-http",
], optional = true }
schemars = { version = "1.2.2", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", features = ["raw_value"] }
thiserror.workspace = true
tl.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"], optional = true }
tower = { version = "0.5", default-features = false, features = ["limit", "timeout"], optional = true }
tower-http = { version = "0.7", default-features = false, features = ["limit"], optional = true }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
comrak = { version = "0.55.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml.workspace = true

[[test]]
name = "issue_489_regressions"
required-features = ["testkit"]

[[test]]
name = "issue_818_structured_data_script_test"
required-features = ["testkit"]

[[test]]
name = "issue_772_omitted_end_tags_test"
required-features = ["testkit"]

[[test]]
name = "form_whitespace_followups_test"
required-features = ["testkit"]

[[example]]
name = "test_deser"
required-features = ["serde"]

[[test]]
name = "inline_boundary_followups"
required-features = ["testkit"]

[[test]]
name = "issue_863_nested_break_ownership_test"
required-features = ["testkit"]

[[test]]
name = "issue_829_form_tree_test"
required-features = ["testkit"]

[[test]]
name = "issue_859_heading_block_markers_test"
required-features = ["testkit"]

[[test]]
name = "review_791_block_boundaries_test"
required-features = ["testkit"]

[[test]]
name = "issue_868_silent_void_boundary_test"
required-features = ["testkit"]

[[test]]
name = "issue_868_empty_inline_boundary_test"
required-features = ["testkit"]

[lints]
workspace = true
