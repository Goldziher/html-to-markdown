
version = "5.0"
name = 'html-to-markdown'
description = 'High-performance HTML to Markdown converter with active Python, TypeScript/Node, Ruby, PHP, Go, Java/JNI, C#, Elixir, R, WebAssembly, Dart, Kotlin Android, Swift, Zig, and C FFI bindings'
gitignore = true
presets = ["claude", "codex", "opencode", "pi"]
builtins = [
  'rust',
  'python',
  'go',
  'java',
  'ruby',
  'php',
  'csharp',
  'elixir',
  'r',
  'wasm',
  'pyo3',
  'napi-rs',
  'magnus',
  'ext-php-rs',
  'rustler',
  'cgo',
  'jni-rs',
  'extendr',
  'default-commands',
]

compact = true
[header]
text = """AI-RULEZ :: GENERATED FILE - DO NOT EDIT
Source: .ai-rulez/config.toml
Modify .ai-rulez/ content and regenerate with pnpm dlx ai-rulez@5.0.1 generate
MCP server: pnpm dlx ai-rulez@5.0.1 mcp"""
style = 'minimal'
hashes = "full"

[[includes]]
name = 'xberg-core'
source = 'https://github.com/xberg-io/agent-conventions.git'
path = 'modules/core'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-languages'
source = 'https://github.com/xberg-io/agent-conventions.git'
path = 'modules/languages'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-cicd'
source = 'https://github.com/xberg-io/agent-conventions.git'
path = 'modules/cicd'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-infrastructure'
source = 'https://github.com/xberg-io/agent-conventions.git'
path = 'modules/infrastructure'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-e2e-generator'
source = 'https://github.com/xberg-io/agent-conventions.git'
path = 'modules/e2e-generator'
merge_strategy = 'local-override'

[[installed_skills]]
name = 'alef'
source = 'https://github.com/xberg-io/alef.git'

[[mcp_servers]]
name = 'playwright'
description = 'Playwright browser automation for E2E testing and docs verification'
command = 'npx'
args = ['-y', '@playwright/mcp@latest']

[defaults]
effort = 'medium'

[[marketplaces]]
name = "basemind"
source = "Goldziher/basemind"
type = "github"

[[plugins]]
marketplace = "basemind"
name = "basemind"
scope = "project"
enabled = true

# Plugin authoring: `ai-rulez generate --plugin` fans plugin/.ai-rulez/config.toml
# ([plugin] block) out to per-runtime bundles under plugin/ and emits the repo-root
# marketplace index. Only read by `generate --plugin`; normal governance generation ignores it.
[marketplace]
name = "html-to-markdown"
description = "Fast, lossless HTML→Markdown conversion for coding agents, by Kreuzberg, Inc."
members = ["plugin"]

[marketplace.owner]
name = "Kreuzberg, Inc."
email = "contact@xberg.io"

[mcp]
self_server_command = ["pnpm", "dlx", "ai-rulez@5.0.1", "mcp"]
