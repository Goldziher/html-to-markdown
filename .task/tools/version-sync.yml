version: "3"
internal: true

includes:
  platforms: ../config/platforms.yml

vars:
  ALEF: "alef"
  AI_RULEZ: "ai-rulez"

tasks:
  sync:
    desc: "Synchronize version across all package manifests"
    cmds:
      # ~keep The pin check runs FIRST, before anything writes. CI installs the
      # ~keep `alef_version` from alef.toml, not whatever is on this machine, so regenerating
      # ~keep with a different local alef commits output the pinned version cannot reproduce
      # ~keep -- and every freshness gate then reads the tree as stale forever, with no diff
      # ~keep to explain why. A binary built from a dirty tree is rejected for the same
      # ~keep reason: its output is not attributable to any released version.
      - cmd: |
          set -euo pipefail
          pinned=$(sed -n 's/^alef_version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' alef.toml | head -1)
          [ -n "$pinned" ] || { echo "ERROR: alef.toml has no alef_version pin." >&2; exit 1; }
          identity=$({{.ALEF}} --version)
          running=$(printf '%s\n' "$identity" | head -1 | awk '{print $2}')
          if [ "$pinned" != "$running" ]; then
            echo "ERROR: alef.toml pins $pinned but the alef on PATH is $running." >&2
            echo "       Install the pinned version, or bump alef_version to the version that" >&2
            echo "       will actually generate this tree. CI installs the pin." >&2
            exit 1
          fi
          if printf '%s\n' "$identity" | grep -q 'tree:.*DIRTY'; then
            echo "ERROR: the alef on PATH was built from a dirty working tree, so its output" >&2
            echo "       is not reproducible from any released version." >&2
            exit 1
          fi
      - "{{.ALEF}} sync-versions"
      - python3 scripts/sync_consumer_versions.py
      # ~keep `alef sync-versions` writes the version INTO manifests; a lockfile is not a
      # ~keep manifest, so nothing above touches one. In the 3.12.4 release that cost four
      # ~keep separate CI failures, each surfacing in a different workflow, discovered one
      # ~keep push at a time: the root pnpm lockfile still carried the previous version for
      # ~keep `crates/html-to-markdown-node`'s eight platform `optionalDependencies` (they
      # ~keep resolve as `link:npm/<target>`, so no unpublished package is fetched), and
      # ~keep `uv.lock` for the editable `html-to-markdown` package. Use the PINNED pnpm from
      # ~keep `package.json`'s `packageManager`: a different major rewrites the lockfile
      # ~keep format. `test_apps/*` lockfiles legitimately lag until publish and are NOT
      # ~keep refreshed here -- `alef validate versions` reports those as BLOCKED by design.
      - cmd: |
          set -euo pipefail
          pin=$(python3 -c 'import json; print(json.load(open("package.json"))["packageManager"])')
          case "$pin" in
            pnpm@*) ;;
            *) echo "ERROR: package.json packageManager is $pin, expected a pnpm@ pin." >&2; exit 1 ;;
          esac
          npx --yes "$pin" install --lockfile-only
      - uv lock
      # ~keep `alef sync-versions` rewrites MANIFESTS ONLY. Everything generated from the
      # version -- README install snippets, test-app installers, e2e download scripts, stubs,
      # scaffolding -- is produced by separate subcommands, so a bump that stops at
      # sync-versions leaves generated files contradicting the manifests beside them.
      # liter-llm v1.19.0 and tree-sitter-language-pack v1.16.0 were both tagged in exactly
      # that state and reached no registry. Each command below writes a different part of that
      # surface; none is redundant with another.
      #
      # `alef docs` is deliberately NOT here. It aborts on doc-snippet typechecking, and when
      # it aborts it has already written the reference pages WITHOUT their `alef:hash:` lines,
      # which flips `alef verify` from pass to fail. Run it separately and deliberately.
      - "{{.ALEF}} generate --skip-compile"
      - "{{.ALEF}} stubs"
      - "{{.ALEF}} scaffold"
      - "{{.ALEF}} readme"
      - "{{.ALEF}} test-apps generate"
      - "{{.ALEF}} e2e generate"
      # Sync the coding-agent plugin: pin plugin/.ai-rulez/config.toml [plugin].version
      # to core, then regenerate the per-runtime bundles under plugin/ from it. ~keep
      - python3 scripts/sync_plugin_version.py
      - "{{.AI_RULEZ}} generate --plugin"
      # ~keep The gate. A bump is not finished because the commands above exited 0 -- each
      # reports only on what it writes. `alef verify` is the only step that looks at the whole
      # managed surface at once. Read its output: it exits 0 while still reporting frozen paths
      # that drifted, so a zero exit code is necessary and not sufficient.
      - cmd: |
          set -o pipefail
          verify_log=$(mktemp)
          trap 'rm -f "$verify_log"' EXIT
          {{.ALEF}} verify 2>&1 | tee "$verify_log"
          # ~keep `alef verify` deliberately does NOT set a failure exit code for a drifted
          # create-once seed: upstream reasons that a consumer cannot fix content the write
          # guard refuses to overwrite, so failing there would only buy a blanket
          # `user_owned` opt-out. We own these files, so here it IS fixable and IS fatal --
          # a drifted version-bearing installer is exactly how liter-llm shipped a 1.4.0-rc
          # artifact URL for three releases. `alef verify --help` names this grep as the
          # supported way to make it fatal.
          if grep -q 'frozen path(s) DRIFTED' "$verify_log"; then
            echo "ERROR: alef verify reported drifted frozen paths (see the DRIFTED block above)." >&2
            echo "       Fix the file, or declare it [workspace.ownership] user_owned in alef.toml once reviewed." >&2
            exit 1
          fi

  check:
    desc: "Check if versions are synchronized (dry-run)"
    cmds:
      - python3 scripts/sync_consumer_versions.py --check
      - cmd: grep -m 1 'version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/'
        silent: false

  bump:major:
    desc: "Bump major version (X.0.0) and sync"
    cmds:
      - "{{.ALEF}} sync-versions --bump major"
      - task: sync

  bump:minor:
    desc: "Bump minor version (0.X.0) and sync"
    cmds:
      - "{{.ALEF}} sync-versions --bump minor"
      - task: sync

  bump:patch:
    desc: "Bump patch version (0.0.X) and sync"
    cmds:
      - "{{.ALEF}} sync-versions --bump patch"
      - task: sync

  show:
    desc: "Show current version from Cargo.toml"
    cmds:
      - cmd: grep -m 1 'version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/'
        silent: false
