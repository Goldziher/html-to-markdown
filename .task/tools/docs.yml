version: "3"

tasks:
  build:
    desc: Build documentation
    cmds:
      - pnpm --dir docs-site install --frozen-lockfile
      - pnpm --dir docs-site build

  serve:
    desc: Serve documentation locally with live reload
    cmds:
      - pnpm --dir docs-site install
      - pnpm --dir docs-site dev

  generate:
    desc: Generate API reference documentation using alef
    cmds:
      - alef docs

  lint:links:
    desc: Check links with lychee
    cmds:
      - lychee --offline docs-site/src/content/docs README.md

  lint:prose:
    desc: Lint prose with textlint
    cmds:
      - pnpm exec textlint 'docs-site/src/content/docs/**/*.{md,mdx}'

  snippets:validate:lang:
    desc: "Validate snippets for one language (set LANG=dart|kotlin|swift|...)"
    cmds:
      - alef snippets validate --snippets docs-site/src/snippets --level syntax --languages {{.LANG}} --timeout 120 -j 4
    requires:
      vars: [LANG]

  snippets:list:
    desc: List all discovered snippets
    cmds:
      - alef snippets list --snippets docs-site/src/snippets

  snippets:gaps:
    desc: Report snippet coverage gaps (missing variants, unreferenced files, etc.)
    # kotlin is absent from the required set: alef.toml gives kotlin_android
    # exclude_functions = ["visitor"], because its trait-bridge emitter cannot bind via an
    # options field. The binding therefore has no visitor API and alef stops emitting the 49
    # visitor and 5 visitor edge-case snippets for it, which requiring kotlin here reports as
    # 54 permanent gaps. ~keep
    cmds:
      - alef snippets gaps --snippets docs-site/src/snippets --docs docs-site/src/content/docs --required-languages rust,python,typescript,go,ruby,php,java,csharp,elixir,r,c,swift,dart,zig

  snippets:check:
    desc: Generate and strictly validate fixture-driven documentation snippets
    cmds:
      - alef e2e generate
      - alef snippets check --strict --cache off

  snippets:audit:
    desc: Run structural audit (frontmatter, fences, includes)
    cmds:
      - alef snippets audit --snippets docs-site/src/snippets --docs docs-site/src/content/docs
