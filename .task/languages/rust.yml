version: "3"
internal: true

includes:
  platforms: ../config/platforms.yml

vars:
  RUST_LOG: '{{.RUST_LOG | default "info"}}'
  BUILD_PROFILE: '{{.BUILD_PROFILE | default "release"}}'
  RUST_BACKTRACE: '{{.RUST_BACKTRACE | default "1"}}'
  CARGO_TERM_COLOR: "always"

tasks:
  install:
    desc: "Install Rust toolchain and components (rustup, cargo)"
    silent: false
    cmds:
      - rustup update stable
      - rustup component add rustfmt clippy
      - rustup component add llvm-tools-preview
      - cargo install cargo-llvm-cov --locked
      - cargo install cargo-upgrades --locked
      - cargo install cargo-deny --locked
      - cargo --version
      - rustc --version

  audit:
    desc: "Check Rust dependencies for advisories, license, and source violations (cargo-deny)"
    silent: false
    cmds:
      - cmd: cargo deny check
        ignore_error: false

  build:
    desc: "Build all Rust crates with {{.BUILD_PROFILE}} profile"
    silent: false
    cmds:
      - cmd: |
          cargo build --workspace --profile {{.BUILD_PROFILE}} -j {{.NUM_CPUS}}
        ignore_error: false

  build:dev:
    desc: "Build all Rust crates in debug mode"
    silent: false
    cmds:
      - cmd: |
          cargo build --workspace -j {{.NUM_CPUS}}
        ignore_error: false

  build:release:
    desc: "Build all Rust crates in release mode"
    silent: false
    cmds:
      - cmd: |
          cargo build --workspace --release -j {{.NUM_CPUS}}
        ignore_error: false

  build:ci:
    desc: "Build for CI with debug info enabled (no strip)"
    silent: false
    cmds:
      - cmd: |
          CARGO_PROFILE_RELEASE_DEBUG=2 CARGO_PROFILE_RELEASE_STRIP=none cargo build --workspace --exclude html-to-markdown-php --release -j {{.NUM_CPUS}}
        ignore_error: false

  test:
    desc: "Run Rust test suite"
    silent: false
    cmds:
      - cmd: |
          RUST_LOG={{.RUST_LOG}} RUST_BACKTRACE={{.RUST_BACKTRACE}} cargo test --release --no-default-features -p html-to-markdown-rs -j {{.NUM_CPUS}}
        ignore_error: false
      - cmd: |
          RUST_LOG={{.RUST_LOG}} RUST_BACKTRACE={{.RUST_BACKTRACE}} cargo test --release --workspace --exclude html-to-markdown-py --exclude html-to-markdown-php -j {{.NUM_CPUS}}
        ignore_error: false

  test:ci:
    desc: "Run CI tests; generate coverage on Linux and macOS"
    silent: false
    cmds:
      - cmd: |
          {{if eq OS "windows"}}
          # ~keep llvm-cov's object list exceeds Windows' command-line limit; Linux and macOS collect coverage.
          RUST_LOG={{.RUST_LOG}} RUST_BACKTRACE={{.RUST_BACKTRACE}} cargo test --features metadata,visitor,inline-images --workspace --exclude html-to-markdown-py --exclude html-to-markdown-php --exclude html-to-markdown-rs-swift --exclude html-to-markdown-rs-dart --exclude html-to-markdown-bench -j {{.NUM_CPUS}}
          {{else}}
          RUST_LOG={{.RUST_LOG}} RUST_BACKTRACE={{.RUST_BACKTRACE}} cargo llvm-cov --all-features --workspace --exclude html-to-markdown-py --exclude html-to-markdown-php --exclude html-to-markdown-bench --lcov --output-path rust-coverage.lcov -j {{.NUM_CPUS}}
          {{end}}
        ignore_error: false
      - cmd: |
          cargo llvm-cov --all-features --workspace --exclude html-to-markdown-py --exclude html-to-markdown-php --exclude html-to-markdown-bench --summary-only
        platforms: [linux, darwin]
        ignore_error: false

  coverage:
    desc: "Generate code coverage report (lcov format)"
    silent: false
    cmds:
      - cmd: |
          RUST_LOG={{.RUST_LOG}} cargo llvm-cov --all-features --workspace --exclude html-to-markdown-py --exclude html-to-markdown-php --exclude benchmark-harness --exclude html-to-markdown-wasm-wasmtime-tests --lcov --output-path rust-coverage.lcov -j {{.NUM_CPUS}}
        ignore_error: false

  # ~keep The CI coverage job previously only generated rust-coverage.lcov and
  # uploaded it as an artifact — nothing ever read the number, so the job passed
  # regardless of coverage (html-to-markdown audit #39). `--fail-under-lines`
  # turns it into a real gate. The floor is a regression tripwire, NOT the
  # aspirational 95%-core/80%-bindings target documented in CLAUDE.md: a measured
  # run of this exact command on 2026-08-11 came in at ~32.9% line coverage
  # workspace-wide (the binding shim crates — node/wasm/ffi/jni/dart/swift — have
  # near-zero direct Rust unit tests since they're covered by e2e suites in their
  # target language, not `cargo test`). Setting the floor at the documented target
  # would fail every CI run today; 30% is a few points below the current measured
  # value so it catches a real regression without being a no-op.
  coverage:check:
    desc: "Generate code coverage report and fail if line coverage regresses below the floor"
    silent: false
    cmds:
      - cmd: |
          RUST_LOG={{.RUST_LOG}} cargo llvm-cov --all-features --workspace --exclude html-to-markdown-py --exclude html-to-markdown-php --exclude benchmark-harness --exclude html-to-markdown-wasm-wasmtime-tests --lcov --output-path rust-coverage.lcov --fail-under-lines 30 -j {{.NUM_CPUS}}
        ignore_error: false

  lint:
    desc: "Lint Rust code WITH auto-fix (cargo fmt + cargo clippy --fix)"
    silent: false
    cmds:
      - cmd: cargo fmt --all
        ignore_error: false
      - cmd: |
          cargo clippy --workspace --fix --allow-dirty --allow-staged -j {{.NUM_CPUS}}
        ignore_error: false

  lint:check:
    desc: "Lint Rust code WITHOUT auto-fix (check-only)"
    silent: false
    cmds:
      - cmd: cargo fmt --all --check
        ignore_error: false
      - cmd: |
          cargo clippy -j {{.NUM_CPUS}} --workspace -- -D warnings
        ignore_error: false

  format:
    desc: "Format Rust code (with modifications)"
    silent: false
    cmds:
      - cmd: cargo fmt --all
        ignore_error: false

  format:check:
    desc: "Check Rust formatting without modifications"
    silent: false
    cmds:
      - cmd: cargo fmt --all --check
        ignore_error: false

  update:
    desc: "Update Rust dependencies within major versions (cargo update)"
    silent: false
    cmds:
      - cmd: cargo update
        ignore_error: false
      - cmd: cargo update --manifest-path packages/ruby/ext/html_to_markdown_rb/native/Cargo.toml
        ignore_error: false
      - cmd: cargo update --manifest-path packages/elixir/native/html_to_markdown_nif/Cargo.toml
        ignore_error: false
      - cmd: cargo update --manifest-path packages/r/src/rust/Cargo.toml
        ignore_error: false

  upgrade:
    desc: "Upgrade Rust dependencies to latest including breaking changes (cargo upgrade --incompatible + cargo update)"
    silent: false
    cmds:
      - cmd: cargo upgrade --incompatible
        ignore_error: false
      - cmd: cargo update
        ignore_error: false
      - cmd: cargo upgrade --incompatible --manifest-path packages/ruby/ext/html_to_markdown_rb/native/Cargo.toml
        ignore_error: false
      - cmd: cargo update --manifest-path packages/ruby/ext/html_to_markdown_rb/native/Cargo.toml
        ignore_error: false
      - cmd: cargo upgrade --incompatible --manifest-path packages/elixir/native/html_to_markdown_nif/Cargo.toml
        ignore_error: false
      - cmd: cargo update --manifest-path packages/elixir/native/html_to_markdown_nif/Cargo.toml
        ignore_error: false
      - cmd: cargo upgrade --incompatible --manifest-path packages/r/src/rust/Cargo.toml
        ignore_error: false
      - cmd: cargo update --manifest-path packages/r/src/rust/Cargo.toml
        ignore_error: false

  clean:
    desc: "Clean Rust build artifacts"
    silent: false
    cmds:
      - cmd: cargo clean
        ignore_error: false

  doc:
    desc: "Generate and open Rust documentation"
    silent: false
    cmds:
      - cmd: |
          cargo doc --workspace --all-features --no-deps --open
        ignore_error: false

  e2e:generate:
    desc: "Generate E2E tests from fixtures using alef"
    silent: false
    cmds:
      - cmd: alef e2e generate --lang rust
        ignore_error: false

  e2e:test:
    desc: "Run Rust E2E tests in e2e/rust directory"
    silent: false
    cmds:
      - cmd: cargo test --manifest-path e2e/rust/Cargo.toml
        ignore_error: false
