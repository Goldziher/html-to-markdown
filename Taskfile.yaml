version: "3"

# ============================================================================
# ============================================================================

includes:
  rust:
    taskfile: ./.task/languages/rust.yml
  python:
    taskfile: ./.task/languages/python.yml
  node:
    taskfile: ./.task/languages/node.yml
  ruby:
    taskfile: ./.task/languages/ruby.yml
  php:
    taskfile: ./.task/languages/php.yml
  go:
    taskfile: ./.task/languages/go.yml
  java:
    taskfile: ./.task/languages/java.yml
  csharp:
    taskfile: ./.task/languages/csharp.yml
  elixir:
    taskfile: ./.task/languages/elixir.yml
  dart:
    taskfile: ./.task/languages/dart.yml
  swift:
    taskfile: ./.task/languages/swift.yml
  kotlin-android:
    taskfile: ./.task/languages/kotlin_android.yml
  zig:
    taskfile: ./.task/languages/zig.yml
  bench:
    taskfile: ./.task/workflows/benchmark.yml
  version:
    taskfile: ./.task/tools/version-sync.yml
  plugin:
    taskfile: ./.task/tools/plugin.yml
  docs:
    taskfile: ./.task/tools/docs.yml
  readme:
    taskfile: ./.task/tools/generate.yml
  _tools:
    taskfile: ./.task/tools/general.yml
    flatten: true

tasks:
  setup:
    desc: "Install all dependencies and dev tools"
    cmds:
      - task: rust:install
      - alef setup
      - command -v poly >/dev/null 2>&1 || brew install goldziher/tap/poly
      - task: governance:hooks:install

  build:
    desc: "Build Rust core library only"
    cmds:
      - task: build:core

  build:dev:
    desc: "Build all in debug mode"
    cmds:
      - task: rust:build:dev

  build:release:
    desc: "Build Rust core in release mode"
    cmds:
      - task: rust:build:release

  build:ci:
    desc: "Build Rust core in CI mode"
    cmds:
      - task: rust:build:ci

  build:core:
    desc: "Build Rust core library only"
    cmds:
      - task: rust:build

  build:bindings:
    desc: "Build all language bindings"
    cmds:
      - task: alef:build

  build:all:
    desc: "Build Rust core library and all language bindings"
    cmds:
      - task: build:core
      - task: build:bindings

  build:cli:
    desc: "Build the html-to-markdown CLI binary"
    cmds:
      - task: rust:build:release

  test:
    desc: "Run Rust core test suite only"
    cmds:
      - task: rust:test

  test:bindings:
    desc: "Run binding test suites only (skip Rust core)"
    cmds:
      - alef test

  test:all:
    desc: "Run all test suites across all languages"
    cmds:
      - task: test
      - task: test:bindings
      - task: test:scripts

  test:scripts:
    desc: "Run the Bats contract tests for the repo's own shell scripts"
    env:
      # Suites load the shared helpers with `bats_load_library xberg-bats`, which searches
      # BATS_LIB_PATH and nothing else. CI sets the same directory for the bats job, so a local
      # run and a CI run load identical bytes.
      BATS_LIB_PATH: "{{.ROOT_DIR}}/scripts/tests/lib"
    preconditions:
      - sh: command -v bats
        msg: "bats is required: brew install bats-core"
      - sh: test -f scripts/tests/lib/xberg-bats/load.bash
        msg: "shared Bats helpers are missing; run `task test:scripts:lib:sync`"
    cmds:
      - bats --recursive --print-output-on-failure scripts/tests/bats

  test:scripts:lib:sync:
    desc: "Refresh the vendored Bats helper library from xberg-io/actions"
    cmds:
      - scripts/task/sync-bats-lib.sh sync

  test:scripts:lib:check:
    desc: "Fail when the vendored Bats helper library has drifted from its pinned source"
    cmds:
      - scripts/task/sync-bats-lib.sh --check

  test:ci:
    desc: "Run all tests with coverage (CI mode)"
    cmds:
      - task: rust:test:ci
      - alef test --coverage

  lint:
    desc: "Lint all code via poly"
    cmds:
      - poly lint .

  lint:check:
    desc: "Lint all code WITHOUT auto-fix (check-only)"
    cmds:
      - poly lint .

  go:lint:
    desc: "Lint Go bindings with golangci-lint"
    cmds:
      - golangci-lint run ./... --config .golangci.yml
    dir: packages/go

  ruby:lint:
    desc: "Lint Ruby bindings with rubocop and steep"
    cmds:
      - alef lint --lang ruby

  csharp:lint:
    desc: "Lint C# bindings with dotnet format"
    cmds:
      - alef lint --lang csharp

  format:
    desc: "Format all code via poly"
    cmds:
      - poly fmt --fix .

  format:check:
    desc: "Check code formatting without modifications"
    cmds:
      - poly fmt --check .

  check:ffi-symbols:
    desc: "Diff exported htm_* FFI symbols against the symbols bindings call"
    cmds:
      - python3 scripts/check_ffi_symbols.py {{.CLI_ARGS}}

  check:quality-warnings:
    desc: "Fail on unsuppressed poly quality warnings"
    cmds:
      - python3 scripts/check_quality_warnings.py

  check:ffi-symbols:known:
    desc: "check:ffi-symbols, treating the known-missing allowlist as non-blocking"
    cmds:
      - python3 scripts/check_ffi_symbols.py --allow-known {{.CLI_ARGS}}

  check:binding-parse:
    desc: "Parse every generated binding with its own language front end"
    cmds:
      - python3 scripts/check_binding_parse.py {{.CLI_ARGS}}

  check:binding-parse:strict:
    desc: "check:binding-parse, treating a skipped language as a failure (CI)"
    cmds:
      - python3 scripts/check_binding_parse.py --strict {{.CLI_ARGS}}

  check:binding-parse:self-test:
    desc: "Prove each binding-parse checker rejects deliberately invalid syntax"
    cmds:
      - python3 scripts/check_binding_parse.py --self-test {{.CLI_ARGS}}

  check:
    desc: "Run all checks (format + lint, no modifications)"
    cmds:
      - task: format:check
      - task: lint:check
      - task: node:verify-loader

  update:
    desc: "Update all dependencies (within major versions)"
    cmds:
      - alef update
      - cmd: gau --update .
        ignore_error: false
      - task: rust:update
      - task: python:update
      - task: node:update
      - task: ruby:update
      - task: php:update
      - task: go:update
      - task: java:update
      - task: csharp:update
      - task: elixir:update
      - task: dart:update
      - task: swift:update
      - task: kotlin-android:update
      - task: zig:update

  upgrade:
    desc: "Upgrade all dependencies to latest (including breaking changes)"
    cmds:
      - alef update --latest
      - cmd: gau --update .
        ignore_error: false
      - task: rust:upgrade
      - task: python:upgrade
      - task: node:upgrade
      - task: ruby:upgrade
      - task: php:upgrade
      - task: go:upgrade
      - task: java:upgrade
      - task: csharp:upgrade
      - task: elixir:upgrade
      - task: dart:upgrade
      - task: swift:upgrade
      - task: kotlin-android:upgrade
      - task: zig:upgrade

  audit:
    desc: "Check dependencies for known vulnerabilities and license/advisory violations"
    cmds:
      - task: rust:audit
      - task: node:audit

  cov:rust:
    desc: "Generate Rust coverage report"
    cmds:
      - task: rust:coverage

  cov:all:
    desc: "Generate coverage for all languages"
    cmds:
      - task: rust:test:ci
      - alef test --coverage

  versions:sync:
    desc: "Synchronize version from Cargo.toml to all package manifests"
    cmds:
      - task: version:sync

  publish:validate:
    desc: "Validate publish manifests are consistent"
    cmds:
      - alef publish validate

  publish:prepare:
    desc: "Prepare packages for publishing (vendor deps, stage FFI)"
    cmds:
      - alef publish prepare

  publish:build:
    desc: "Build release artifacts for all languages"
    cmds:
      - alef publish build

  publish:package:
    desc: "Package built artifacts into distributable archives"
    cmds:
      - alef publish package -o dist/

  alef:generate:
    desc: "Regenerate all Alef-managed outputs without building"
    cmds:
      # @napi-rs/cli 3.x emits an explicit `module.exports.<name> = nativeBinding.<name>` line for
      # every runtime export, so cjs-module-lexer resolves named ESM imports straight off napi's
      # output (#450). The post-build re-export fixup that used to run here is gone; do not
      # reintroduce one. `node:verify-esm` is the guard that this stays true. ~keep
      # ~keep `alef all` never builds the per-language artifacts that a `compile`/`typecheck`
      # `docs.snippets.validation_level` needs (only `alef build` does), so leaving validation on
      # spawns a doomed toolchain per snippet and cannot pass by construction. Discovery, the
      # reference-page audit and gap detection still run. Use `task alef:snippets` after
      # `alef build` when you actually want validation.
      - alef all --clean --skip-snippet-validation --skip-compile

  alef:verify:
    desc: "Check Alef-generated files are up to date"
    cmds:
      - alef verify --exit-code

  alef:snippets:
    desc: Validate documentation snippets (needs built artifacts; run after alef build)
    cmds:
      - alef snippets check

  alef:build:
    desc: "Build all language bindings"
    cmds:
      - alef build

  alef:sync:
    desc: "Sync the version to all manifests and the plugin version pin"
    cmds:
      # Delegate instead of calling `alef sync-versions` directly. This is the only
      # sync task `task --list-all` surfaces -- `version:sync` is in an internal
      # included taskfile -- so the discoverable entry point was the incomplete one,
      # and release runs that used it left the plugin version pin behind. ~keep
      - task: version:sync

  alef:docs:
    desc: "Generate API reference documentation"
    cmds:
      - alef docs

  node:verify-esm:
    desc: "Assert named ESM imports resolve from the built Node binding (#450 guard)"
    # Requires an already-built host binding: the guard loads the real `.node`, so it cannot run
    # after a bare `alef:generate` (nothing built) or in the cross-compiling publish pipeline
    # (artifact targets a foreign platform). ~keep
    cmds:
      - node crates/html-to-markdown-node/scripts/verify-esm-exports.mjs

  node:verify-loader:
    desc: "Assert the committed Node index.js loader matches package.json and index.d.ts"
    # Purely static, so unlike `node:verify-esm` it needs nothing built and can run in the
    # publish pipeline. index.js is committed source that publish ships verbatim, and a
    # `napi build` run from the repo root silently rewrites it to reference
    # `html-to-markdown-monorepo-*` packages that are never published. ~keep
    cmds:
      - node crates/html-to-markdown-node/scripts/verify-loader-manifest.mjs

  node:e2e:
    desc: "Build Node binding and run e2e/node fixture tests"
    cmds:
      - alef test --e2e --lang node
      - task: node:verify-esm

  ruby:e2e:
    desc: "Build Ruby binding and run e2e/ruby fixture tests"
    cmds:
      - alef test --e2e --lang ruby

  php:e2e:
    desc: "Build PHP extension and run e2e/php fixture tests"
    cmds:
      - alef test --e2e --lang php

  go:e2e:
    desc: "Build FFI and run e2e/go fixture tests"
    cmds:
      - alef test --e2e --lang go

  java:e2e:
    desc: "Build FFI and run e2e/java fixture tests"
    cmds:
      - alef test --e2e --lang java

  csharp:e2e:
    desc: "Build FFI and run e2e/csharp fixture tests"
    cmds:
      - alef test --e2e --lang csharp

  elixir:e2e:
    desc: "Build Elixir NIF and run e2e/elixir fixture tests"
    cmds:
      - alef test --e2e --lang elixir

  wasm:e2e:
    desc: "Build WASM and run e2e/wasm fixture tests"
    cmds:
      - alef test --e2e --lang wasm

  r:e2e:
    desc: "Run e2e/r fixture tests"
    cmds:
      - alef test --e2e --lang r

  r:docs:verify:
    desc: "Check committed R reference pages against a fresh roxygen2 render"
    cmds:
      - scripts/ci/r/verify-reference.sh

  c:e2e:
    desc: "Build FFI and run e2e/c fixture tests"
    cmds:
      - alef test --e2e --lang c

  dart:e2e:
    desc: "Build Dart binding and run e2e/dart fixture tests"
    cmds:
      - alef test --e2e --lang dart

  swift:e2e:
    desc: "Build Swift bridge and run e2e/swift_e2e fixture tests"
    cmds:
      - alef test --e2e --lang swift

  zig:e2e:
    desc: "Build FFI and run e2e/zig fixture tests"
    cmds:
      - alef test --e2e --lang zig

  kotlin-android:e2e:
    desc: "Build JNI and run e2e/kotlin_android fixture tests (host JVM)"
    cmds:
      - alef test --e2e --lang kotlin_android

  e2e:all:
    desc: "Build all bindings and run all local e2e fixture tests"
    cmds:
      - task: e2e:build
      - task: e2e:test

  e2e:quick:
    desc: "Run quick E2E tests (Rust only)"
    cmds:
      - task: rust:e2e:test

  e2e:generate:
    desc: "Generate E2E tests for all languages from fixtures"
    cmds:
      - alef e2e generate

  e2e:build:
    desc: "Build all language bindings for E2E tests"
    cmds:
      - task: alef:build

  e2e:test:
    desc: "Run E2E tests for all languages"
    cmds:
      - alef test --e2e

  e2e:lint:
    desc: "Lint generated E2E test code"
    cmds:
      - alef lint

  e2e:verify:
    desc: "Full E2E pipeline - generate, lint, and test all suites"
    cmds:
      - task: e2e:generate
      - task: e2e:lint
      - task: e2e:test

  test-apps:smoke:
    desc: "Run smoke tests for all published packages (fast validation)"
    cmds:
      - task: test-apps:smoke:python
      - task: test-apps:smoke:node
      - task: test-apps:smoke:bun
      - task: test-apps:smoke:wasm
      - task: test-apps:smoke:ruby
      - task: test-apps:smoke:php
      - task: test-apps:smoke:php_ext
      - task: test-apps:smoke:go
      - task: test-apps:smoke:java
      - task: test-apps:smoke:csharp
      - task: test-apps:smoke:elixir
      - task: test-apps:smoke:r
      - task: test-apps:smoke:rust
      - task: test-apps:smoke:c
      - task: test-apps:smoke:homebrew

  test-apps:smoke:python:
    desc: "Smoke test Python package from PyPI"
    dir: test_apps/python
    cmds:
      - uv sync --no-install-project --no-install-workspace
      - uv run --no-sync pytest tests/test_smoke.py -v

  test-apps:smoke:node:
    desc: "Smoke test Node package from npm"
    dir: test_apps/node
    cmds:
      - pnpm install
      - pnpm exec vitest run tests/smoke.test.ts

  test-apps:smoke:ruby:
    desc: "Smoke test Ruby gem from RubyGems"
    dir: test_apps/ruby
    cmds:
      - bundle install
      - bundle exec rspec spec/smoke_spec.rb

  test-apps:smoke:php:
    desc: "Smoke test PHP package from Packagist"
    dir: test_apps/php
    cmds:
      - bash install.sh
      - composer install
      - vendor/bin/phpunit tests/SmokeTest.php

  test-apps:smoke:go:
    desc: "Smoke test Go package from pkg.go.dev"
    dir: test_apps/go
    cmds:
      - go mod download github.com/xberg-io/html-to-markdown/packages/go/v3
      - bash ./download_ffi.sh
      - go test -v -run Smoke

  test-apps:smoke:java:
    desc: "Smoke test Java package from Maven Central"
    dir: test_apps/java
    cmds:
      - ./mvnw{{if eq .OS "windows"}}.cmd{{end}} clean install -DskipTests
      - ./mvnw{{if eq .OS "windows"}}.cmd{{end}} test -Dtest=SmokeTest

  test-apps:smoke:csharp:
    desc: "Smoke test C# package from NuGet"
    dir: test_apps/csharp
    cmds:
      - dotnet restore
      - dotnet test --filter FullyQualifiedName~SmokeTest

  test-apps:smoke:elixir:
    desc: "Smoke test Elixir package from Hex.pm"
    dir: test_apps/elixir
    cmds:
      - mix deps.get
      - mix test test/smoke_test.exs

  test-apps:smoke:r:
    desc: "Smoke test R package"
    dir: test_apps/r
    cmds:
      - Rscript install.R
      - Rscript -e "library(testthat); library(htmltomarkdown); test_file('tests/test_smoke.R')"

  test-apps:smoke:bun:
    desc: "Smoke test Node package from npm under Bun"
    dir: test_apps/bun
    cmds:
      - bun install
      - bun test smoke.test.ts

  test-apps:smoke:wasm:
    desc: "Smoke test WASM package from npm"
    dir: test_apps/wasm
    cmds:
      - pnpm install
      - pnpm exec vitest run tests/smoke.test.ts

  test-apps:smoke:rust:
    desc: "Smoke test Rust crate from crates.io"
    dir: test_apps/rust
    cmds:
      - cargo test --test smoke_test

  test-apps:smoke:c:
    desc: "Smoke test C FFI from GitHub release tarballs"
    dir: test_apps/c
    cmds:
      - make test

  test-apps:smoke:php_ext:
    desc: "Smoke test PHP native extension installed via PIE"
    dir: test_apps/php_ext
    cmds:
      - ./run_tests.sh

  test-apps:smoke:homebrew:
    desc: "Smoke test the Homebrew CLI + FFI formulae"
    dir: test_apps/homebrew
    vars:
      H2M_VERSION:
        sh: cd ../.. && grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/'
    cmds:
      - brew bundle install --file=Brewfile
      - test "$("$(brew --prefix html-to-markdown)/bin/html-to-markdown" --version)" = "html-to-markdown {{.H2M_VERSION}}"
      - |
        ffi_prefix="$(brew --prefix libhtml-to-markdown)"
        probe_dir="$(mktemp -d)"
        trap 'rm -rf "$probe_dir"' EXIT
        printf '#include <stdio.h>\n#include <html_to_markdown.h>\nint main(void) { puts(htm_version()); return 0; }\n' |
          cc -x c -I"$ffi_prefix/include" -L"$ffi_prefix/lib" -Wl,-rpath,"$ffi_prefix/lib" \
            -lhtml_to_markdown_ffi -o "$probe_dir/version" -
        test "$("$probe_dir/version")" = "{{.H2M_VERSION}}"

  test-apps:test:
    desc: "Run comprehensive tests for all published packages"
    cmds:
      - task: test-apps:test:python
      - task: test-apps:test:node
      - task: test-apps:test:ruby
      - task: test-apps:test:php
      - task: test-apps:test:go
      - task: test-apps:test:java
      - task: test-apps:test:csharp
      - task: test-apps:test:elixir
      - task: test-apps:test:r
      - task: test-apps:test:swift
      - task: test-apps:test:dart
      - task: test-apps:test:zig
      - task: test-apps:test:kotlin-android

  test-apps:test:python:
    desc: "Comprehensive tests for Python package"
    dir: test_apps/python
    cmds:
      - uv sync --no-install-project --no-install-workspace
      - uv run --no-sync pytest tests/test_conversion.py -v

  test-apps:test:node:
    desc: "Comprehensive tests for Node package"
    dir: test_apps/node
    cmds:
      - pnpm install
      - pnpm test

  test-apps:test:ruby:
    desc: "Comprehensive tests for Ruby gem"
    dir: test_apps/ruby
    cmds:
      - bundle install
      - bundle exec rspec spec/conversion_spec.rb

  test-apps:test:php:
    desc: "Comprehensive tests for PHP package"
    dir: test_apps/php
    cmds:
      - bash install.sh
      - composer install
      - vendor/bin/phpunit tests

  test-apps:test:go:
    desc: "Comprehensive tests for Go package"
    dir: test_apps/go
    cmds:
      - go mod tidy
      - go test -v -run Test_

  test-apps:test:java:
    desc: "Comprehensive tests for Java package"
    dir: test_apps/java
    cmds:
      - ./mvnw{{if eq .OS "windows"}}.cmd{{end}} test -Dtest=ConversionTest

  test-apps:test:csharp:
    desc: "Comprehensive tests for C# package"
    dir: test_apps/csharp
    cmds:
      - dotnet test --filter FullyQualifiedName~ConversionTests

  test-apps:test:elixir:
    desc: "Comprehensive tests for Elixir package"
    dir: test_apps/elixir
    cmds:
      - mix deps.get
      - mix test test/conversion_test.exs

  test-apps:test:r:
    desc: "Comprehensive tests for R package"
    dir: test_apps/r
    cmds:
      - Rscript install.R
      - Rscript run_tests.R

  test-apps:test:swift:
    desc: "Comprehensive tests for Swift package"
    dir: test_apps/swift_e2e
    cmds:
      - swift test

  test-apps:test:dart:
    desc: "Comprehensive tests for Dart package"
    dir: test_apps/dart
    cmds:
      - dart pub get
      - dart test

  test-apps:test:zig:
    desc: "Comprehensive tests for Zig package"
    dir: test_apps/zig
    vars:
      H2M_VERSION:
        sh: cd ../.. && grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/'
    cmds:
      - (cd ../c && bash download_ffi.sh)
      - zig fetch --save=html_to_markdown "https://github.com/xberg-io/html-to-markdown/releases/download/v{{.H2M_VERSION}}/html-to-markdown-rs-zig-v{{.H2M_VERSION}}.tar.gz"
      - zig build test

  test-apps:test:kotlin-android:
    desc: "Comprehensive tests for Kotlin/Android AAR (host JVM tests)"
    dir: test_apps/kotlin_android
    cmds:
      - ./gradlew test

  test-apps:comprehensive:
    desc: "Run all test_app comprehensive tests (alias for test-apps:test)"
    cmds:
      - task: test-apps:test

  build:demo:
    desc: "Build the GitHub Pages demo"
    cmds:
      - ./scripts/build-demo.sh

  serve:demo:
    desc: "Serve the GitHub Pages demo locally on port 8000"
    dir: docs
    cmds:
      - python3 -m http.server 8000

  clean:
    desc: "Remove build artifacts across all languages"
    cmds:
      - task: rust:clean
      - alef clean

  default:
    desc: "List available tasks"
    cmds:
      - task --list

  governance:hooks:install:
    desc: Provision machine preferences and install reviewed AI governance hooks
    cmds:
      - |
        python3 - <<'PYTHON'
        import pathlib
        import shutil
        import subprocess
        import tomllib

        if shutil.which("ai-rulez") is None:
            raise SystemExit("Install the reviewed ai-rulez CLI before installing hooks")
        preferences = pathlib.Path("poly.local.toml")
        text = preferences.read_text() if preferences.exists() else ""
        data = tomllib.loads(text)
        if "hook_preferences" not in data:
            preferences.write_text(text.rstrip() + '\n\n[hook_preferences]\nchannels = ["system"]\n')
        elif "system" not in data["hook_preferences"].get("channels", []):
            raise SystemExit("Add system to hook_preferences.channels in poly.local.toml")
        subprocess.run(["poly", "hooks", "install"], check=True)
        PYTHON

  plugin:hermes:test:
    desc: Verify the Hermes bridge against a real MCP stdio fixture
    cmds:
      - uv run --no-project --python 3.11 --with mcp==1.28.1 --with PyYAML==6.0.3 python scripts/tests/test_hermes_plugin.py

  governance:check:
    desc: Check materialized local governance outputs against shared sources
    cmds:
      - ai-rulez generate --check --no-local --strict-config

  plugin:skills:test:
    desc: Verify public skill ownership and resource freshness
    cmds:
      - python3 scripts/tests/test_public_skills.py
      - python3 scripts/sync_public_skills.py --check

  plugin:launcher:test:
    desc: Verify npm launcher preserves caller directory and relative configuration
    cmds:
      - python3 scripts/tests/test_mcp_launcher_cwd.py
