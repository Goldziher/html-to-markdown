install_command = 'install.packages("htmltomarkdown", repos = "https://xberg-io.r-universe.dev")'
description = """
High-performance HTML to Markdown converter with R bindings powered by a Rust core via extendr.
Ship identical Markdown across every runtime while enjoying native performance with extendr bindings.
"""
migration_version = ""

[crates.readme.languages.r.features]
visitor_pattern = true
metadata_extraction = true
cli_proxy = false

[crates.readme.languages.r.performance]
platform = "Apple M4"
function = "convert()"
note = "Real Wikipedia documents"

[[crates.readme.languages.r.performance.benchmarks]]
name = "Lists (Timeline)"
