table_extraction = "table-extraction/basic_extraction.md"

[crates.readme.languages.kotlin_android]
name = "Kotlin (Android)"
template = "language_package.md"
output_path = "packages/kotlin-android/README.md"
package_manager = ["gradle", "maven"]
package_name = "io.xberg:html-to-markdown-android"
install_command = """
implementation("io.xberg:html-to-markdown-android:{{ version }}")"""
description = """
High-performance HTML to Markdown converter for Android, packaged as an AAR with bundled JNI libraries for `arm64-v8a`, `x86_64`, `armeabi-v7a`, and `x86`.
Server-side Kotlin/JVM consumers should use the `io.xberg:html-to-markdown` Java package directly — Kotlin/JVM treats Java classes as native, and Panama FFM is unavailable on Android, which is why Android ships as its own artifact.
"""
migration_version = ""

[crates.readme.languages.kotlin_android.features]
# Visitor pattern is not yet bridged via JNI for Kotlin Android — NodeContext.attributes()
# and intoOwned() both throw UnsupportedOperationException. Keep this false until the
# visitor callback bridge ships; see docs-site/src/snippets/kotlin_android/visitor/basic_visitor.md. ~keep
visitor_pattern = false
metadata_extraction = false
cli_proxy = false

[crates.readme.languages.kotlin_android.performance]
platform = "Apple M4"
function = "convert()"
note = "Real Wikipedia documents"

[crates.readme.languages.kotlin_android.snippets]
basic_usage = "getting-started/basic_usage.md"
with_options = "getting-started/with_options.md"

[crates.readme.languages.swift]
name = "Swift"
template = "language_package.md"
output_path = "packages/swift/README.md"
package_manager = ["spm"]
package_name = "HtmlToMarkdown"
install_command = """
# SwiftPM URL consumption is not yet available (no published XCFramework).
# Build from source against the Rust static library:
git clone https://github.com/xberg-io/html-to-markdown.git
cd html-to-markdown
cargo build -p html-to-markdown-rs-swift --release
swift build --package-path packages/swift"""
description = """
High-performance HTML to Markdown converter for Swift via `swift-bridge`. Distributed through the Swift Package Manager; targets macOS 13+ and iOS 16+.
Ship identical Markdown across every runtime while keeping idiomatic Swift APIs and Codable-friendly result types.
"""
migration_version = ""

[crates.readme.languages.swift.features]
visitor_pattern = true
metadata_extraction = true
cli_proxy = false

