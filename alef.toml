[workspace.poly.per-file-ignores]
# Alef's source and generated configuration grow with the number of languages, packages,
# fixtures, and documentation surfaces they describe; line count is not a maintainability
# signal for these declarative inventories. ~keep
"alef.toml" = ["file-too-long"]
"poly.toml" = ["file-too-long"]
".alef-toml-merge-provenance.toml" = ["file-too-long"]
".alef-ownership.toml" = ["file-too-long"]
# Quality metrics do not apply to test code. A test function's length is its assertion
# count and a table-driven test's arity mirrors its cases; splitting either to satisfy a
# production-code maintainability metric makes the test harder to read, not easier. Only
# `file-too-long` and `type-too-long` still apply here -- an oversized test FILE is a real
# organisational problem, unlike an oversized test function. ~keep
"**/tests/**/*" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/test/**/*" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/benches/**/*" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*_test.rs" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*_tests.rs" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/test_*.py" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*_test.py" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/conftest.py" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*.test.ts" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*.test.js" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*.test.mjs" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*.spec.ts" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*.spec.js" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*_test.go" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*Test.java" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*Tests.cs" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*_test.dart" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*_spec.rb" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
# Stylistic rules disabled repo-wide. Each is a formatting or idiom preference with no
# correctness or security consequence, and each fires in volumes no one can hand-maintain
# (`require-unicode-regexp` alone was 724 across the polyrepo, `no-inline-comments` 200).
# `eqeqeq` is here for a stronger reason: every occurrence audited was the deliberate
# `== null` nullish idiom, so the rule had a 100% false-positive rate here.
# Rules with a real correctness or security angle are deliberately NOT listed and stay on:
# unicorn/require-post-message-target-origin, unicorn/no-array-callback-reference,
# unicorn/no-immediate-mutation, unicorn/no-array-fill-with-reference-type. ~keep
"**" = [
  "CPY001",
  "UnorderedKey",
  "eqeqeq",
  "no-inline-comments",
  "no-negated-condition",
  "require-unicode-regexp",
  "unicorn/consistent-function-scoping",
  "unicorn/escape-case",
  "unicorn/explicit-length-check",
  "unicorn/new-for-builtins",
  "unicorn/no-array-sort",
  "unicorn/no-hex-escape",
  "unicorn/no-lonely-if",
  "unicorn/no-negated-condition",
  "unicorn/no-typeof-undefined",
  "unicorn/no-useless-undefined",
  "unicorn/prefer-add-event-listener",
  "unicorn/prefer-at",
  "unicorn/prefer-code-point",
  "unicorn/prefer-dom-node-append",
  "unicorn/prefer-dom-node-remove",
  "unicorn/prefer-import-meta-properties",
  "unicorn/prefer-native-coercion-functions",
  "unicorn/prefer-number-coercion",
  "unicorn/prefer-query-selector",
  "unicorn/prefer-single-call",
  "unicorn/prefer-string-replace-all",
  "unicorn/prefer-string-slice",
  "unicorn/prefer-top-level-await",
  "unicorn/prefer-type-error",
  "unicorn/require-module-specifiers",
]
# The `quality` rules below are suppressed on these generated paths for a reason distinct
# from the uncomment exemption. poly's quality tier measures function length, parameter count,
# file length, nesting depth and cyclomatic complexity -- metrics written for hand-maintained
# code. A generated binding surface cannot satisfy them and must not try: a binding function's
# parameter list mirrors the core API it wraps one-for-one, and a single-file binding crate is
# one file by construction. poly still REPORTS on generated files (only `--fix-generated` gates
# rewriting, and a `DO NOT EDIT` banner holds nothing back), so without these entries the
# metrics fire on every regeneration and no edit here could silence them -- regeneration would
# revert it. `astgrep` and language-specific rules stay ACTIVE on these paths on purpose:
# those catch real generator defects. ~keep
# Alef-generated binding output — never hand-clean comments; regeneration owns
# them. Exempts these paths from the uncomment sweep. ~keep
".cargo/config.toml" = ["comment", "doc-comment"]
"Package.swift" = ["comment", "doc-comment"]
"packages/**" = [
  "comment",
  "doc-comment",
  "cyclomatic-complexity",
  "file-too-long",
  "function-too-long",
  "nesting-too-deep",
  "too-many-parameters",
  "type-too-long",
]
"crates/html-to-markdown-node/**" = [
  "comment",
  "doc-comment",
  "cyclomatic-complexity",
  "file-too-long",
  "function-too-long",
  "nesting-too-deep",
  "too-many-parameters",
  "type-too-long",
]
# The php crate is MIXED: src/lib.rs, the visitor interface and the stubs are alef-generated,
# but src/HtmlVisitor.php is hand-written and must keep its quality metrics. ~keep
"crates/html-to-markdown-php/**" = ["comment", "doc-comment"]
"crates/html-to-markdown-php/src/lib.rs" = [
  "file-too-long",
  "function-too-long",
  "too-many-parameters",
  "type-too-long",
]
"crates/html-to-markdown-php/stubs/**" = [
  "comment",
  "doc-comment",
  "cyclomatic-complexity",
  "file-too-long",
  "function-too-long",
  "nesting-too-deep",
  "too-many-parameters",
  "type-too-long",
]
"crates/html-to-markdown-rs-jni/**" = [
  "comment",
  "doc-comment",
  "cyclomatic-complexity",
  "file-too-long",
  "function-too-long",
  "nesting-too-deep",
  "too-many-parameters",
  "type-too-long",
]
# ffi/py/wasm are MIXED: only the alef-generated src/lib.rs (+ ffi
# build.rs/cbindgen.toml/header) is exempt; other modules are hand-written and
# get the uncomment sweep. ~keep
"crates/html-to-markdown-ffi/src/lib.rs" = [
  "file-too-long",
  "function-too-long",
  "too-many-parameters",
  "type-too-long",
]
"crates/html-to-markdown-ffi/build.rs" = ["comment", "doc-comment"]
"crates/html-to-markdown-ffi/cbindgen.toml" = ["comment", "doc-comment"]
"crates/html-to-markdown-ffi/include/html_to_markdown.h" = ["comment", "doc-comment"]
"crates/html-to-markdown-py/src/lib.rs" = [
  "file-too-long",
  "function-too-long",
  "nesting-too-deep",
  "too-many-parameters",
]
"crates/html-to-markdown-wasm/src/lib.rs" = [
  "cyclomatic-complexity",
  "file-too-long",
  "function-too-long",
  "too-many-parameters",
]
# alef-generated e2e registry scaffold apps (alef:hash headers) — exempt from the
# uncomment sweep; regeneration owns their comments. Distinct glob from the
# builtin "**/test_apps/**" ruff-relaxation key. ~keep
"test_apps/**" = [
  "comment",
  "doc-comment",
  "cyclomatic-complexity",
  "file-too-long",
  "function-too-long",
  "nesting-too-deep",
  "too-many-parameters",
  "type-too-long",
]
# alef-generated Python entrypoint; RET504 fires on the passthrough return. ~keep
"packages/python/**/api.py" = ["RET504"]
# Test-code relaxations on top of the builtin "**/tests/**" defaults. ~keep
"**/tests/**/*.py" = ["PT019", "PLC0415", "SLF001"]
# html-to-markdown specific
"scripts/**/*.py" = ["INP001", "S607", "T201", "D103", "D212"]
# Redundant "# noqa: S603" (S603 is globally ignored) in a hand-written proxy module.
"cli-proxy/**/*.py" = ["PLR0917", "RUF100"]
"readme_templates/**" = ["MD057"]
# Alef-generated API reference pages: one page per language, each a full rendering of the
# public surface, so `file-too-long` is a property of the surface's size. ~keep
"docs-site/src/content/docs/reference/**" = ["file-too-long"]
".github/workflows/publish.yaml" = ["file-too-long"]
"packages/r/R/version.R" = ["empty_file"]
"crates/html-to-markdown/src/visitor/types.rs" = ["too-many-parameters"]
"packages/python/html_to_markdown/options.py" = ["F821"]
"packages/kotlin-android/src/main/kotlin/**/*.kt" = ["typo"]
"packages/swift/Sources/RustBridge*/**" = ["trailing-whitespace"]
"e2e/**/*.py" = ["Q000"]
"**/skills/**/SKILL.md" = ["MD032"]
# Node build-time scripts whose console output IS their product: the two `verify-*` guards
# report the check they ran, and fail the build via `console.error` + `process.exit(1)`;
# `patch-bundler-entry.js` reports the wasm entry it rewrote. These are standalone scripts run
# by npm/task with no subscriber or logger to route through. ~keep
"crates/html-to-markdown-node/scripts/**" = ["no-console"]
"crates/html-to-markdown-wasm/scripts/**" = ["no-console"]
# Standalone browser demo asset, loaded straight into a `<script type="module">` on the docs
# site with no bundler and no logger. Every `console.error` here already has a paired
# user-visible status message; the console line is the devtools-side detail. ~keep
"docs-site/public/demo/**" = ["no-console"]
# Vendored upstream Apache Maven wrapper (Apache-2.0, (c) the original authors). The empty
# `catch (IOException)` around a stream close is upstream's; editing it forks a file we take
# verbatim and would re-take on every wrapper upgrade. ~keep
"**/MavenWrapperDownloader.java" = ["empty-catch-block"]
# OpenCode v2's setup and tool execution contracts are asynchronous. Each `execute` relies on
# `async` to turn argument-validation throws into rejections the runtime handles; dropping it to
# satisfy require-await would make those throws synchronous and break the contract. ~keep
"plugin/.ai-rulez/opencode/index.js" = ["function-too-long", "require-await"]

