  "docs-site/src/snippets/feedback.md",
  "docs-site/src/snippets/*/error-handling/*.md",
  "docs-site/src/snippets/*/getting-started/*.md",
  "docs-site/src/snippets/*/metadata/basic_extraction.md",
  "docs-site/src/snippets/*/table-extraction/*.md",
