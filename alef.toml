[crates.custom_modules]
# No `node` key: the node backend does not consume `custom_modules`, so `node = ["helpers"]`
# emitted nothing and alef reported it as `[warning:unconsumed_config]` on every run. The r
# backend does consume it -- `options` is what produces packages/r/R/options.R. ~keep
r = ["options", "types"]

[[crates.trait_bridges]]
trait_name = "HtmlVisitor"
type_alias = "VisitorHandle"
param_name = "visitor"
bind_via = "options_field"
options_type = "ConversionOptions"
context_type = "NodeContext"
result_type = "VisitResult"
exclude_languages = ["php"]
