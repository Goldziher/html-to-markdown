# The 96 files below are hand-authored on purpose and have no fixture behind them, so alef will
# never generate an equivalent: `alef e2e snippets-migrate docs-site/src/snippets` reports every
# one as `no_generated_equivalent`. Five narrative topics x 16 language roots (wasm has no
# `error-handling` variant, hence 95 rather than 96) demonstrate the public field-access idiom
# -- `result.content` / `result.metadata` / `metadata.document.title` -- that the fixture-driven
# corpus under `output` never emits; `feedback.md` is an MDX prose partial, not code at all.
# Declaring them here is what turns them from `UnaccountedSnippet` warnings into recorded
# curation. Patterns resolve against the PROJECT ROOT, not against `output` -- these files sit
# beside the generated tree, so an `output`-relative pattern could not name them. The topic
# names are disjoint from every directory under `generated/<lang>/`, so none of these patterns
# can shadow a generated file. ~keep
