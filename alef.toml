[workspace]
alef_version = "0.105.0"
languages = [
  "python",
  "node",
  "ruby",
  "php",
  "ffi",
  "go",
  "java",
  "csharp",
  "elixir",
  "wasm",
  "r",
  "kotlin_android",
  "jni",
  "swift",
  "dart",
  "zig",
]

# ~keep Consumer manifests contain maintained toolchain/dependency settings and JNI tasks,
# while archived changelogs are human-owned historical records. Release dependency pins are
# updated by scripts/sync_consumer_versions.py.
[workspace.ownership]
user_owned = [
  "changelog-archive-*.md",
  "test_apps/dart/pubspec.yaml",
  "test_apps/elixir/mix.exs",
  "test_apps/kotlin_android/build.gradle.kts",
  "test_apps/zig/build.zig",
]

[workspace.docs]
reference_output = "docs-site/src/content/docs/reference"

[workspace.docs.cli]
sources = ["crates/html-to-markdown-cli/src/args.rs"]

[workspace.docs.mcp]
sources = ["crates/html-to-markdown/src/mcp/server.rs"]


[workspace.docs.skills]
template_dir = "templates/docs/skills"
outputs = [".codex/skills", ".agents/skills", ".github/skills", ".claude/skills"]

[workspace.docs.snippets]
# `generated/` is the fixture-driven regression corpus (alef-owned, one topic per fixture
# category). The per-language roots below are the hand-written narrative snippets used directly
# by usage.mdx / errors.mdx / tables.mdx / visitor.mdx (getting-started, error-handling,
# table-extraction, metadata "basic_extraction", visitor "basic_visitor"). They demonstrate the
# public field-access idiom (`result.content` / `result.tables` / `result.metadata`) that the
# fixture-driven snippets don't show, so they aren't dropped in favor of a generated equivalent
# -- but until now they sat entirely outside `dirs`, so nothing ever validated they still compile.
# Listing each language root (not a glob) picks up only the hand-written topic dirs; it does not
# overlap `generated/<lang>/...`, which lives one level deeper under its own subtree. ~keep
dirs = [
  "docs-site/src/snippets/generated",
  "docs-site/src/snippets/c",
  "docs-site/src/snippets/csharp",
  "docs-site/src/snippets/dart",
  "docs-site/src/snippets/elixir",
  "docs-site/src/snippets/go",
  "docs-site/src/snippets/java",
  "docs-site/src/snippets/kotlin_android",
  "docs-site/src/snippets/php",
  "docs-site/src/snippets/python",
  "docs-site/src/snippets/r",
  "docs-site/src/snippets/ruby",
  "docs-site/src/snippets/rust",
  "docs-site/src/snippets/swift",
  "docs-site/src/snippets/typescript",
  "docs-site/src/snippets/wasm",
  "docs-site/src/snippets/zig",
]
# The gap pass (unreferenced snippets, missing language variants) is skipped entirely unless at
# least one of `docs_dirs`/`required_languages` is set, and a `--strict` run refuses to pass on a
# check that compared nothing. These two mirror the flags `task docs:snippets:gaps` already
# passes, so `alef snippets check --strict` runs the same comparison CI does instead of erroring.
# kotlin is absent from the required set: alef.toml gives kotlin_android
# exclude_functions = ["visitor"], because its trait-bridge emitter cannot bind via an options
# field. The binding therefore has no visitor API and alef stops emitting the 49 visitor and 5
# visitor edge-case snippets for it, which requiring kotlin here would report as 54 permanent
# gaps. ~keep
docs_dirs = ["docs-site/src/content/docs"]
required_languages = [
  "rust",
  "python",
  "typescript",
  "go",
  "ruby",
  "php",
  "java",
  "csharp",
  "elixir",
  "r",
  "c",
  "swift",
  "dart",
  "zig",
]
validation_level = "compile"
# `timeout_secs` bounds both snippet validation and every session's `before` hook (see
# `DocsSnippetsConfig::timeout_secs` in alef's `src/core/config/output.rs`). 120s is enough for
# `syntax`/`typecheck` snippets but not for a cold `before` build: kotlin_android's
# `assembleDebug`, wasm's `pnpm run build:all`, and swift's `swift build` can each take several
# minutes on a fresh checkout, so those sessions' snippets were reclassified `unresolved_dependency`
# (reported as `Unavailable`) and failed CI under `--strict` even though every snippet itself was
# fine. 900s matches the precedent set in tree-sitter-language-pack's alef.toml for the same
# multi-minute `before` hooks. ~keep
timeout_secs = 900
strict = true
deny_unclassified = true

# Every session below needs a `before` that produces the artifact its snippets compile against.
# `validation_level = "compile"` reads a built artifact, but `alef all` does not build one, so any
# session without a `before` is an ordering gap: alef refused 2603 snippets across c, dart, elixir,
# php, python, r, ruby, rust and zig with "no pipeline-guaranteed build for their language" and
# failed the strict run. The seven sessions that already had a `before` were never in that list.
# Each command below is the same one the matching `[crates.test.<lang>].before` uses, rebased on
# the session's own `cwd`. ~keep
[workspace.docs.snippets.sessions.python]
cwd = "packages/python"
manifest = "packages/python/pyproject.toml"
# `uv sync` here resolves against the uv workspace root, so the venv it populates is ../../.venv,
# not a local one; maturin needs VIRTUAL_ENV pointed at it or it cannot find an interpreter. ~keep
# maturin is only a `[build-system] requires` entry, so no sync ever puts it on PATH and the hook
# died with `sh: 1: maturin: not found`, failing all 289 python snippets as ERROR. `uvx` fetches it
# into an ephemeral env and it still installs into the VIRTUAL_ENV named above. ~keep
before = [
  "uv sync --no-install-project --no-install-workspace",
  "VIRTUAL_ENV=$PWD/../../.venv uvx maturin develop --release",
]

[workspace.docs.snippets.sessions.node]
cwd = "crates/html-to-markdown-node"
manifest = "crates/html-to-markdown-node/package.json"
# The hand-written typescript snippets import the published package name
# (`@xberg-io/html-to-markdown`), same as a real consumer would -- but this
# session's cwd IS that package, so nothing installs it into its own
# node_modules the way `npm install @xberg-io/html-to-markdown` would for a
# consumer. Self-link it so the compile check resolves the same import a
# reader copies. ~keep
before = ["mkdir -p node_modules/@xberg-io && ln -sfn ../.. node_modules/@xberg-io/html-to-markdown"]

[workspace.docs.snippets.sessions.wasm]
cwd = "crates/html-to-markdown-wasm"
manifest = "crates/html-to-markdown-wasm/package.json"
# Same hand-written typescript snippets are validated again from this
# session; they still import `@xberg-io/html-to-markdown` (the node
# package), not this crate's own wasm package name, so link to the sibling
# node package rather than self-linking. ~keep
before = [
  "pnpm run build:all",
  "mkdir -p node_modules/@xberg-io && ln -sfn ../../../html-to-markdown-node node_modules/@xberg-io/html-to-markdown",
]

[workspace.docs.snippets.sessions.ruby]
cwd = "packages/ruby"
# `rm -rf .bundle tmp` first, exactly as `[crates.test.ruby].before` does: ruby/setup-ruby writes
# `.bundle/config` with `path: vendor/bundle` + `deployment: true`, and build-extension.sh unsets
# every BUNDLE_* variable before `exec rake compile`, so bare rake looks in the default gem home
# and the Rakefile's `require "rb_sys/extensiontask"` raised LoadError -- failing all 289 ruby
# snippets as ERROR. Dropping the local config makes `bundle install` land where bare rake looks.
# ~keep
before = ["rm -rf .bundle tmp", "bundle install", "./build-extension.sh"]

[workspace.docs.snippets.sessions.php]
cwd = "."
manifest = "composer.json"
before = ["cargo build --release --locked -p html-to-markdown-php"]

[workspace.docs.snippets.sessions.go]
cwd = "packages/go"
manifest = "packages/go/go.mod"
before = ["cd ../.. && cargo build --release --locked -p html-to-markdown-ffi", "cd ../.. && scripts/ci/go/copy-ffi.sh"]

[workspace.docs.snippets.sessions.java]
cwd = "packages/java"
manifest = "packages/java/pom.xml"
before = ["cd ../.. && cargo build --release --locked -p html-to-markdown-ffi", "mvn package -DskipTests -q"]

[workspace.docs.snippets.sessions.csharp]
cwd = "packages/csharp"
manifest = "packages/csharp/HtmlToMarkdown/HtmlToMarkdown.csproj"
before = [
  "cd ../.. && cargo build --release --locked -p html-to-markdown-ffi",
  "cd ../.. && scripts/ci/csharp/copy-ffi.sh",
]

[workspace.docs.snippets.sessions.elixir]
cwd = "packages/elixir"
manifest = "packages/elixir/mix.exs"
before = ["mix deps.get", "HTML_TO_MARKDOWN_BUILD=1 mix compile"]

[workspace.docs.snippets.sessions.rust]
cwd = "crates/html-to-markdown"
manifest = "crates/html-to-markdown/Cargo.toml"
before = ["cargo build --release --locked"]

[workspace.docs.snippets.sessions.kotlin_android]
cwd = "packages/kotlin-android"
manifest = "packages/kotlin-android/build.gradle.kts"
before = [
  "cd ../.. && cargo build --release --locked -p html-to-markdown-rs-jni",
  "./gradlew assembleDebug -Palef.skipHostJni=true",
]

[workspace.docs.snippets.sessions.swift]
cwd = "packages/swift"
manifest = "packages/swift/Package.swift"
# ~keep The shim rebuilds the module layout alef looks for; Swift 6.3 changed the default
# build system and moved it. See scripts/ci/swift/snippet-module-shim.sh for the mechanism
# and the negative control. Without it all 341 swift snippets report Unavailable and the
# strict run fails, with no change to this tree.
before = ["swift build", "../../scripts/ci/swift/snippet-module-shim.sh"]

[workspace.docs.snippets.sessions.dart]
cwd = "packages/dart"
manifest = "packages/dart/pubspec.yaml"
before = ["cd ../.. && cargo build --release --locked -p html-to-markdown-rs-dart", "dart pub get"]

[workspace.docs.snippets.sessions.zig]
cwd = "packages/zig"
manifest = "packages/zig/build.zig"
before = ["cd ../.. && cargo build --release --locked -p html-to-markdown-ffi", "zig build"]
env = { ZIG_GLOBAL_CACHE_DIR = ".zig-global-cache", ZIG_LOCAL_CACHE_DIR = ".zig-cache" }

[workspace.docs.snippets.sessions.c]
cwd = "."
manifest = "crates/html-to-markdown-ffi/include/html_to_markdown.h"
before = ["cargo build --release --locked -p html-to-markdown-ffi"]

[workspace.docs.snippets.sessions.r]
cwd = "packages/r"
manifest = "packages/r/DESCRIPTION"
before = ["Rscript -e \"devtools::load_all('.')\""]
[workspace.sync]
extra_paths = [
  "packages/ruby/lib/html_to_markdown/version.rb",
  "packages/python/html_to_markdown/__init__.py",
  "crates/html-to-markdown-node/package.json",
  "crates/html-to-markdown-node/npm/*/package.json",
  "package.json",
]

[workspace.citation]
title = "html-to-markdown"
abstract = "Fast, lossless HTML to Markdown engine."
repository-code = "https://github.com/xberg-io/html-to-markdown"
url = "https://xberg.io"
license = "MIT"
date-released = "2026-10-06"

[[workspace.citation.authors]]
family-names = "Hirschfeld"
given-names = "Na'aman"
email = "naaman@xberg.io"
orcid = "https://orcid.org/0009-0000-2247-5072"

[[workspace.sync.text_replacements]]
path = "test_apps/node/package.json"
search = '"@xberg-io/html-to-markdown": "[^"]*"'
replace = '"@xberg-io/html-to-markdown": "^{version}"'

[[workspace.sync.text_replacements]]
path = "test_apps/bun/package.json"
search = '"@xberg-io/html-to-markdown": "[^"]*"'
replace = '"@xberg-io/html-to-markdown": "^{version}"'

[[workspace.sync.text_replacements]]
path = "test_apps/wasm/package.json"
search = '"@xberg-io/html-to-markdown-wasm": "[^"]*"'
replace = '"@xberg-io/html-to-markdown-wasm": "^{version}"'

[[workspace.sync.text_replacements]]
path = "test_apps/java/pom.xml"
search = "<artifactId>html-to-markdown</artifactId>\\s*<version>[^<]*</version>"
replace = "<artifactId>html-to-markdown</artifactId>\n      <version>{version}</version>"

[[workspace.sync.text_replacements]]
path = "test_apps/csharp/XbergIo.HtmlToMarkdown.E2eTests.csproj"
search = 'Include="XbergIo.HtmlToMarkdown" Version="[^"]*"'
replace = 'Include="XbergIo.HtmlToMarkdown" Version="{version}"'

[[workspace.sync.text_replacements]]
path = "test_apps/python/pyproject.toml"
search = '"html-to-markdown>=[^"]*"'
replace = '"html-to-markdown>={python_version}"'

[[workspace.sync.text_replacements]]
path = "test_apps/ruby/Gemfile"
search = "gem 'html-to-markdown', '[^']*'"
replace = "gem 'html-to-markdown', '~> {ruby_version}'"

[[workspace.sync.text_replacements]]
path = "test_apps/go/go.mod"
search = 'github\.com/xberg-io/html-to-markdown/packages/go/v3 v[0-9][^\s]*'
replace = "github.com/xberg-io/html-to-markdown/packages/go/v3 v{version}"

[[workspace.sync.text_replacements]]
path = "test_apps/r/DESCRIPTION"
search = 'htmltomarkdown \([^)]*\)'
replace = 'htmltomarkdown ({r_version})'

[[workspace.sync.text_replacements]]
path = "test_apps/rust/Cargo.toml"
search = 'package = "html-to-markdown-rs", version = "[^"]*"'
replace = 'package = "html-to-markdown-rs", version = "{version}"'

[[workspace.sync.text_replacements]]
# The swift e2e app consumes the release/swift/<version> branch the release workflow
# publishes, not a `from:` semver bound, so alef's built-in `from:` sync never reaches it.
# Without this entry the pin silently stayed four releases behind. ~keep
path = "test_apps/swift_e2e/Package.swift"
search = 'release/swift/[^"]*'
replace = 'release/swift/{version}'

[workspace.poly]
# Skip poly's whole-project lint phase in `poly lint`: the shared CI validate job installs only
# Rust/Python/Java, so the other whole-workspace linters (credo, dart-analyze, golangci-lint,
# rubocop, steep, pyrefly) cannot run there. They run via the git pre-commit hooks and each
# language's dedicated CI job. Equivalent to always passing `poly lint --no-workspace`.
# Lives here, not as a hand-edit to the generated poly.toml, because `alef all --clean` eats
# hand-edits -- which is exactly how c99104d1f's fix was lost. ~keep
lint-workspace = false
exclude = [
  # The vendored Bats helper is copied byte-identical from xberg-io/actions, whose shell is
  # tab-indented; reformatting it here would break `task test:scripts:lib:check`. Excluded from
  # discovery rather than from fmt alone because poly has no per-engine exclude -- and the file
  # is linted and formatted in the repo that owns it. ~keep
  "scripts/tests/lib/**",
  "docs-site/src/snippets/**",
  "**/_generated/**",
  "**/coverage/**",
  "**/pkg/**",
  "**/.next/**",
  "**/*.min.js",
  "**/vendored/**",
  "**/stopwords/**",
  "**/testdata/**",
  "**/e2e/**",
  "**/fixtures/**",
  "**/*.diff",
  "**/*.patch",
  "**/frb_generated.rs",
  "charts/**",
  # html-to-markdown specific
  "**/tsconfig*.json",
  "**/*_bridge_generated/**",
  "crates/html-to-markdown-node/index.js",
  "test_apps/wasm/tests/**",
  # cbindgen-generated FFI headers: keep byte-identical to cbindgen output; poly's
  # C doc-comment reflow would diverge from the canonical generated form. ~keep
  "crates/html-to-markdown-ffi/include/html_to_markdown.h",
  "packages/go/include/html_to_markdown.h",
  # Alef-generated C#/Java bindings: poly's formatters disagree with the generator's output, so
  # `poly fmt` and the regeneration freshness check fight over every line. ~keep
  "packages/csharp/**/*.cs",
  "packages/java/**/*.java",
  "test_apps/csharp/**/*.cs",
  "test_apps/java/**/*.java",
  # Zig 0.16 is the authoritative formatter for its build graph. Poly's Zig formatter removes
  # continuation indentation that `zig fmt --check` immediately restores, so the two cannot
  # share ownership of this generated scaffold. The Zig E2E lane still parses and builds it. ~keep
  "packages/zig/build.zig",
  # htmbench-promoted calibration pair: serde_json's pretty printer always expands short
  # arrays that poly collapses onto one line, so formatting them is undone by the next
  # `bench:calibrate` promotion and the two fight forever. ~keep
  "tools/benchmark-harness/baselines/baseline.json",
  "tools/benchmark-harness/guardrails.json",
  # Vendored wasm-bindgen artifact (docs live demo); hand-written script.js /
  # style.css / index.html in the same dir stay linted. ~keep
  "docs-site/public/demo/html_to_markdown_wasm*",
  # ai-rulez-generated coding-agent plugin outputs: owned by `ai-rulez generate
  # --plugin`, never reformatted by poly (would break BLAKE3 provenance). Sources
  # under plugin/.ai-rulez/ + plugin/scripts/ stay poly-managed. ~keep
  "plugin/.claude-plugin/**",
  "plugin/.codex-plugin/**",
  "plugin/.cursor-plugin/**",
  "plugin/.factory-plugin/**",
  "plugin/.opencode/**",
  "plugin/.hermes/**",
  "plugin/skills/**",
  "plugin/.mcp.json",
  "plugin/gemini-extension.json",
  "plugin/kimi.plugin.json",
  "plugin/package.json",
  "plugin/.ai-rulez-generated.json",
  ".claude-plugin/marketplace.json",
  ".agents/plugins/marketplace.json",
  ".ai-rulez-generated.json",
]

# Opt-in comment-removal sweep. Preserve doc comments, TODO/FIXME, and
# SAFETY/license markers. Generated binding output is exempted via
# per-file-ignores below. ~keep
[workspace.poly.uncomment]
enabled = true
remove-todos = false
remove-fixme = false
remove-docs = false
use-default-ignores = true
preserve-patterns = ["SAFETY", "SPDX", "Copyright", "License", "licensed under"]

# Shell is two-space in this tree (15 of 17 sampled scripts). Both keys are load-bearing:
# without `enabled` poly runs no shell formatter at all, and without `indent-width` it falls
# through to the language default of four and reindents every script. poly resolves this from
# the generated poly.toml, not .editorconfig -- it pipes stdin to shfmt with an explicit -i,
# under which .editorconfig is inert by design. ~keep
[workspace.poly.shell-formatter]
enabled = true
indent-width = 2

[workspace.poly.typos.extend-words]
# Deliberate misspelling inside a generated comment that quotes a type-checker error
# message verbatim ("has no attribute `addresss`"). Must stay as-is. ~keep
addresss = "addresss"
ake = "ake"
algoritmos = "algoritmos"
arange = "arange"
