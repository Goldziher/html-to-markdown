packages:
  - crates/html-to-markdown-node
  - crates/html-to-markdown-node/npm/*
  - crates/html-to-markdown-wasm
  - e2e/node
  - e2e/wasm

linkWorkspacePackages: true

onlyBuiltDependencies:
  - esbuild

ignoredBuiltDependencies:
  - wasm-pack

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - "@xberg-io/html-to-markdown-*"
  - "@xberg-io/html-to-markdown-wasm"
  - "@xberg-io/html-to-markdown"

minimumReleaseAge: 0

overrides:
  # ~keep GHSA-fx2h-pf6j-xcff / GHSA-v6wh-96g9-6wx3: vite <=8.0.15 fs.deny bypass + NTLMv2 leak
  vite: ">=8.2.1 <9"
  # ~keep GHSA-r28c-9q8g-f849 / GHSA-fxqj-rqcc-2cmp: postcss sourceMappingURL path traversal
  postcss: ">=8.5.26 <9"
  # ~keep GHSA-2v37-7h3g-55p8 / GHSA-28wg-ghj8-5hjv: nanoid infinite loop on negative/zero size
  nanoid: ">=3.3.17 <4"
  # ~keep GHSA-2883-xcg3-v3hh: js-yaml merge-key CPU exhaustion, including empty merge sources
  js-yaml: ">=4.3.2 <5"
  # ~keep GHSA-68fv-2mgg-jv7q: indexed source-map section offsets can exhaust the event loop.
  source-map-js: ">=1.2.2 <2"
