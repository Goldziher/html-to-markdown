allowBuilds:
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - "@xberg-io/docs-theme@0.4.1"
overrides:
  # ~keep GHSA-rj75-hqrm-r3gf: avoid quadratic parsing in nested CSS selectors.
  postcss-selector-parser: ">=7.1.6 <8"
  # ~keep GHSA-vfj7-8cjw-p6xm: the patched plugin uses picomatch directly; no braces dependency is needed.
  "starlight-llms-txt>micromatch": "-"
  "starlight-llms-txt>@types/micromatch": "-"
packageExtensions:
  starlight-llms-txt@0.12.0:
    dependencies:
      picomatch: "2.3.2"
      "@types/picomatch": "^2.3.4"
patchedDependencies:
  starlight-llms-txt@0.12.0: patches/starlight-llms-txt@0.12.0.patch
